<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome</title>
    <meta
      name="description"
      content="Finch0714 的个人主页 —— MC 服务器查询、Steam 游戏库、手速与反应测试、排行榜生成器等实用小工具。"
    />
    <link rel="icon" type="image/png" sizes="64x64" href="Favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="./assets/md.css" />
    <!-- 字体：霞鹜文楷 Bright Medium（中文网字计划 CDN，按 unicode-range 分片）
         非阻塞加载：media=print 先挂起，下载完自动切回 all，不挡首屏绘制 -->
    <link
      rel="preconnect"
      href="https://cn-font.claude-code-best.win"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://cn-font.claude-code-best.win/packages/lxgwwenkaibright/dist/LXGWBright-Medium/result.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cn-font.claude-code-best.win/packages/lxgwwenkaibright/dist/LXGWBright-Medium/result.css"
      />
    </noscript>
    <script>
      document.documentElement.classList.add("md-js");
    </script>
  </head>

  <body>
    <main class="md-page">
      <div class="md-container">
        <!-- ============ Hero ============ -->
        <section class="md-hero md-anim">
          <span class="md-hero__badge">
            <span class="md-dot"></span>WELCOME
          </span>
          <h1 class="md-display md-hero__title">你好，我是 <em>Finch</em></h1>
          <p class="md-hero__desc">
            一个热衷于终身学习和影视、游戏的探索者。这里放着我平时写给自己用的小工具，
            全部免费、免登录、打开就能用。
          </p>
          <div class="md-row">
            <a
              class="md-btn md-btn--filled md-ripple"
              href="https://space.bilibili.com/2066563707"
              target="_blank"
              rel="noopener"
              >▶ 我的 Bilibili</a
            >
            <button
              class="md-btn md-btn--outlined md-ripple"
              onclick="MD.open('contact-dialog')"
            >
              获取联系方式
            </button>
          </div>
        </section>

        <!-- ============ 名片 + 一言 ============ -->
        <section class="md-section" style="margin-top: 40px">
          <div
            class="md-grid"
            style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr))"
          >
            <div class="md-card md-card--elevated md-reveal">
              <div class="md-card__head">
                <img
                  class="md-avatar md-avatar--round"
                  style="
                    width: 56px;
                    height: 56px;
                    padding: 0;
                    object-fit: cover;
                  "
                  src="./assets/avatar-160.jpg"
                  alt="Finch0714"
                />
                <div>
                  <h2 class="md-title">Finch0714</h2>
                  <p class="md-body" style="font-style: italic; margin: 0">
                    海浪的声音平静了我的心灵。
                  </p>
                </div>
              </div>
              <p class="md-card__body">
                感谢你的到来。如果这里的某个小工具帮到了你，那就是它存在的意义。
              </p>
              <div class="md-row" style="margin-top: 18px">
                <span class="md-chip">🚀 持续更新</span>
                <span class="md-chip md-chip--muted">🆓 全部免费</span>
              </div>
            </div>

            <div class="md-card md-card--elevated md-reveal">
              <div class="md-card__head">
                <span class="md-avatar">💬</span>
                <div>
                  <h2 class="md-title">每日一言</h2>
                  <p class="md-body" style="margin: 0">随手换一句</p>
                </div>
                <span class="md-spacer"></span>
                <button
                  class="md-icon-btn md-ripple"
                  onclick="fetchHitokoto()"
                  aria-label="换一句"
                  title="换一句"
                >
                  🔄
                </button>
              </div>
              <p
                id="hitokoto_text"
                class="md-card__body"
                style="
                  min-height: 48px;
                  color: var(--md-on-surface);
                  font-size: 0.9375rem;
                "
              >
                加载中...
              </p>
              <p
                id="hitokoto_from"
                class="md-label"
                style="text-align: right; margin-top: 8px"
              ></p>
            </div>
          </div>
        </section>

        <!-- ============ 全部功能 ============ -->
        <section class="md-section">
          <div class="md-section__head">
            <div>
              <h2 class="md-section__title">
                <span class="md-section__rule"></span>全部功能
              </h2>
              <p class="md-body" style="margin: 8px 0 0">
                点任意一张卡片直接进入，顶部导航也可以随时切换。
              </p>
            </div>
            <span class="md-chip md-chip--muted" id="feature-count">—</span>
          </div>
          <div class="md-grid" id="feature-grid"></div>
        </section>
      </div>

      <!-- ============ 页脚 ============ -->
      <footer class="md-footer">
        <div class="md-footer__stats">
          <span class="md-footer__stat">
            <span class="md-label">浏览数</span>
            <b id="busuanzi_value_site_pv">—</b>
          </span>
          <span style="opacity: 0.3">|</span>
          <span class="md-footer__stat">
            <span class="md-label">访客数</span>
            <b id="busuanzi_value_site_uv">—</b>
          </span>
        </div>
        <p style="margin: 0">
          © <span id="year"></span> Finch0714 · Built with ♥
        </p>
      </footer>
    </main>

    <!-- ============ 联系方式对话框 ============ -->
    <div
      class="md-dialog-scrim"
      id="contact-dialog"
      onclick="if (event.target === this) MD.close('contact-dialog');"
    >
      <div class="md-dialog" role="dialog" aria-modal="true">
        <div
          class="md-row"
          style="justify-content: space-between; margin-bottom: 4px"
        >
          <h3 class="md-dialog__title" style="margin: 0">联系方式</h3>
          <button
            class="md-icon-btn md-ripple"
            onclick="MD.close('contact-dialog')"
            aria-label="关闭"
          >
            ✕
          </button>
        </div>
        <p class="md-body" style="margin-bottom: 18px">
          欢迎交流，注明来意我会尽快回复。
        </p>
        <div class="md-list" id="contact-list"></div>
      </div>
    </div>

    <script src="./assets/site.js"></script>
    <script src="./assets/nav.js"></script>
    <script>
      /* ---------- 功能卡片 ---------- */
      function renderFeatures() {
        var grid = document.getElementById("feature-grid");
        /* 「关于」只出现在顶栏（不占功能面板）；「抽大奖」标记 hide 完全隐藏 */
        var list = (window.SITE_FEATURES || []).filter(function (f) {
          return !f.hide && f.panel !== false;
        });
        document.getElementById("feature-count").textContent =
          list.length + " 个功能";

        grid.innerHTML = list
          .map(function (f) {
            var tags = (f.tags || [])
              .map(function (t) {
                return (
                  '<span class="md-chip md-chip--muted">' +
                  MD.esc(t) +
                  "</span>"
                );
              })
              .join("");
            var ext = f.external ? ' target="_blank" rel="noopener"' : "";
            var arrow = f.external ? "↗" : "→";
            return (
              '<a class="md-card md-card--elevated md-card--interactive md-ripple md-reveal" href="' +
              MD.esc(f.url) +
              '"' +
              ext +
              ">" +
              '<div class="md-card__head">' +
              '<span class="md-avatar">' +
              MD.esc(f.icon) +
              "</span>" +
              '<h3 class="md-title">' +
              MD.esc(f.title) +
              "</h3>" +
              '<span class="md-spacer"></span>' +
              '<span class="md-label">' +
              arrow +
              "</span>" +
              "</div>" +
              '<p class="md-card__body" style="margin: 0 0 16px">' +
              MD.esc(f.desc) +
              "</p>" +
              '<div class="md-row" style="gap: 8px">' +
              tags +
              "</div>" +
              "</a>"
            );
          })
          .join("");
      }
      renderFeatures();

      /* ---------- 联系方式 ---------- */
      function renderContacts() {
        var box = document.getElementById("contact-list");
        var list = (window.SITE && window.SITE.contacts) || [];
        box.innerHTML = list
          .map(function (c) {
            return (
              '<div class="md-list-item">' +
              '<span class="md-label">' +
              MD.esc(c.label) +
              "</span>" +
              '<span class="md-mono" style="font-weight: 700; user-select: all">' +
              MD.esc(c.value) +
              "</span>" +
              "</div>"
            );
          })
          .join("");
      }
      renderContacts();

      /* ---------- 每日一言 ---------- */
      var HITOKOTO_FALLBACK = "今天也要好好生活，慢慢来比较快。";

      function fetchHitokoto() {
        var t = document.getElementById("hitokoto_text");
        var f = document.getElementById("hitokoto_from");
        t.style.opacity = 0.35;

        /* 一言接口偶尔很慢，超过 4 秒就放弃，别让访客一直看「加载中」 */
        var ctrl = "AbortController" in window ? new AbortController() : null;
        var timer = setTimeout(function () {
          if (ctrl) ctrl.abort();
        }, 4000);

        fetch("https://v1.hitokoto.cn", ctrl ? { signal: ctrl.signal } : {})
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            t.textContent = d.hitokoto;
            f.textContent = "—— 「" + d.from + "」";
            t.style.opacity = 1;
          })
          .catch(function () {
            t.textContent = HITOKOTO_FALLBACK;
            f.textContent = "—— 「Finch0714」";
            t.style.opacity = 1;
          })
          .finally(function () {
            clearTimeout(timer);
          });
      }
      fetchHitokoto();

      /* 访问统计来自第三方，实测要 1.3 秒才回来。
         绝不能挂在关键路径上：等页面 load 完、空闲了再拉，否则会把
         整个页面的「加载完成」拖到 1.5 秒，访客会觉得网站很慢。

         还有一点：官方域名 busuanzi.ibruce.info 在国内时不时连不上，
         一旦连不上页脚就永远是「—」。所以备了个用法完全兼容的
         Vercount（写的是同一批 busuanzi_value_* 元素），
         官方拿不到数字就自动换它再试一次。 */
      var BS_SOURCES = [
        "https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js",
        "https://events.vercount.one/js",
      ];
      var BS_IDS = ["busuanzi_value_site_pv", "busuanzi_value_site_uv"];

      function bsHasNumber() {
        return BS_IDS.some(function (id) {
          var el = document.getElementById(id);
          return el && /\d/.test(el.textContent);
        });
      }

      function loadBusuanzi(i) {
        if (i >= BS_SOURCES.length) {
          /* 都没拿到，就保留占位符，别一直空着 */
          BS_IDS.forEach(function (id) {
            var el = document.getElementById(id);
            if (el && !/\d/.test(el.textContent)) el.textContent = "—";
          });
          return;
        }

        var settled = false;
        function giveUp() {
          if (settled) return;
          settled = true;
          loadBusuanzi(i + 1);
        }

        var s = document.createElement("script");
        s.src = BS_SOURCES[i];
        s.async = true;
        s.onerror = giveUp; /* 域名根本不通，脚本都没下来，立刻换 */
        document.body.appendChild(s);

        /* 脚本下来了、但接口一直不吐数字，也给 4 秒 */
        setTimeout(function () {
          if (bsHasNumber()) settled = true;
          else giveUp();
        }, 4000);
      }

      if (document.readyState === "complete") {
        setTimeout(function () {
          loadBusuanzi(0);
        }, 400);
      } else {
        window.addEventListener("load", function () {
          setTimeout(function () {
            loadBusuanzi(0);
          }, 400);
        });
      }

      document.getElementById("year").textContent = new Date().getFullYear();

      /* 内容渲染完成后登记入场动画 */
      MD.reveal();
    </script>
  </body>
</html>
