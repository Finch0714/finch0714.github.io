<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 | Finch0714</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.loli.net/css2?family=Inter:wght@300;400;600&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-main: 'Inter', -apple-system, sans-serif;
            --font-serif: 'Noto Serif SC', serif;
        }

        body { 
            font-family: var(--font-main); 
            margin: 0; width: 100%; min-height: 100vh;
            background-color: #111;
            overflow-x: hidden;
            display: flex; justify-content: center;
        }

        /* 1. 初始渐变背景 */
        .gradient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientAnim 15s ease infinite;
            z-index: -3;
        }
        @keyframes gradientAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 2. 壁纸层：使用新接口，移除 fixed 附件防止抽搐 */
        #bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; 
            background-position: center center;
            background-repeat: no-repeat;
            transition: opacity 1.2s ease-in-out;
            z-index: -2; opacity: 0;
        }
        
        #bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.25); 
            z-index: -1;
        }

        .glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 一言垂直排版 */
        .hitokoto-card { font-family: var(--font-serif); writing-mode: vertical-rl; text-orientation: mixed; }
        @media (max-width: 1024px) { .hitokoto-card { writing-mode: horizontal-tb; } }
    </style>
</head>

<body class="p-6 py-12">

    <div class="gradient-bg"></div>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>

    <div class="fixed top-6 left-6 flex gap-3 z-[100]">
        <div id="snow-btn" class="w-10 h-10 glass rounded-xl flex items-center justify-center cursor-pointer shadow-lg hover:bg-white/30 transition-all" onclick="toggleSnow()">❄️</div>
        <div id="bg-btn" class="w-10 h-10 glass rounded-xl flex items-center justify-center cursor-pointer shadow-lg hover:bg-white/30 transition-all" onclick="changeWallpaper()" title="切换随机壁纸">🖼️</div>
    </div>

    <canvas id="snow-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5;"></canvas>

    <div class="flex flex-col items-center gap-8 w-full max-w-7xl z-10">
        
        <div class="flex flex-col lg:flex-row items-center lg:items-stretch justify-center gap-8 w-full">
            
            <div class="glass max-w-xl w-full rounded-[2.5rem] shadow-2xl overflow-hidden order-2 lg:order-1">
                <div class="p-10 text-center border-b border-black/5">
                    <div class="w-20 h-20 rounded-full mx-auto mb-6 shadow-xl overflow-hidden border-4 border-white bg-gray-100">
                        <img src="avatar.jpg" alt="头像" class="w-full h-full object-cover">
                    </div>
                    <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Finch0714</h1>
                    <p class="text-gray-400 mt-2 italic text-sm font-light">restless, resetless.</p>
                </div>
                <div class="p-10 text-center">
                    <p class="text-gray-600 leading-relaxed mb-10 text-sm">
                        你好！欢迎来到我的主页。我是一个热衷于终身学习和影视、游戏的探索者。 这里记录了我的技术足迹与创意构思。
                    </p>
                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <a href="https://space.bilibili.com/2066563707" target="_blank" class="px-10 py-3 bg-[#fb7299] text-white rounded-2xl font-semibold text-sm shadow-md hover:brightness-110 transition-all">Bilibili</a>
                        <button onclick="openModal()" class="px-10 py-3 bg-white/40 text-gray-800 border border-white rounded-2xl font-semibold text-sm shadow-md hover:bg-white/60 transition-all">获取联系</button>
                    </div>
                </div>
            </div>

            <div onclick="fetchHitokoto()" class="glass lg:w-24 w-full p-8 lg:py-12 rounded-[2.5rem] shadow-xl cursor-pointer hover:bg-white/40 transition-all flex items-center justify-center order-1 lg:order-2">
                <div class="hitokoto-card text-gray-800">
                    <span id="hitokoto_text" class="text-base leading-loose tracking-[0.2em] opacity-0 transition-opacity duration-700">正在寻找灵感...</span>
                    <span id="hitokoto_from" class="text-[10px] text-gray-400 mt-6 opacity-0 block text-right"></span>
                </div>
            </div>
        </div>

        <div class="glass max-w-xl lg:max-w-4xl w-full p-10 rounded-[2.5rem] shadow-xl flex flex-col order-3">
            <h2 class="text-xs font-bold text-gray-500 mb-8 tracking-widest flex items-center gap-2 uppercase">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_#10b981]"></span> Minecraft Server Monitor
            </h2>
            <div class="flex flex-col md:flex-row gap-4">
                <input id="mc_ip" type="text" placeholder="输入服务器 IP (如: play.hypixel.net)..." class="flex-1 bg-black/5 border border-white/30 rounded-2xl px-6 py-4 text-sm focus:outline-none focus:ring-2 focus:ring-white/20 transition-all text-gray-700">
                <button onclick="checkMCServer()" class="bg-gray-800 text-white px-10 py-4 rounded-2xl text-[10px] font-bold tracking-widest hover:bg-black transition-all shadow-lg active:scale-95">QUERY_SERVER</button>
            </div>
            <div id="mc_result" class="mt-10 grid grid-cols-1 md:grid-cols-3 gap-6 hidden border-t border-black/5 pt-10 font-mono text-[11px] text-gray-500">
                <div class="p-5 bg-white/20 rounded-2xl shadow-inner text-center">
                    <p class="text-[9px] mb-2 opacity-60 font-bold tracking-tighter">NETWORK_STATE</p>
                    <span id="mc_online" class="text-xs font-black"></span>
                </div>
                <div class="p-5 bg-white/20 rounded-2xl shadow-inner text-center">
                    <p class="text-[9px] mb-2 opacity-60 font-bold tracking-tighter">ONLINE_USERS</p>
                    <span id="mc_players" class="text-xs font-black text-gray-700"></span>
                </div>
                <div class="p-5 bg-white/20 rounded-2xl shadow-inner text-center">
                    <p class="text-[9px] mb-2 opacity-60 font-bold tracking-tighter">CORE_VERSION</p>
                    <span id="mc_ver" class="text-xs font-black text-gray-700"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. 🚀 使用新接口的壁纸切换 (wp.upx8.com)
        function changeWallpaper() {
            const bgLayer = document.getElementById('bg-layer');
            const bgBtn = document.getElementById('bg-btn');
            bgBtn.innerText = "⏳";
            
            // 💡 拼接随机参数强制绕过缓存
            const timestamp = new Date().getTime();
            const imgUrl = `https://wp.upx8.com/api.php?_t=${timestamp}`;

            const tempImg = new Image();
            tempImg.src = imgUrl;
            tempImg.onload = () => {
                bgLayer.style.opacity = 0; // 淡出当前
                setTimeout(() => {
                    bgLayer.style.backgroundImage = `url('${imgUrl}')`;
                    bgLayer.style.opacity = 1; // 淡入新图
                    bgBtn.innerText = "🖼️";
                }, 400);
            };
            tempImg.onerror = () => {
                bgBtn.innerText = "❌";
                setTimeout(() => bgBtn.innerText = "🖼️", 2000);
            };
        }
        changeWallpaper(); // 自动加载首屏壁纸

        // 2. 纯圆点雪花 (无样式切换，仅开关)
        const snowCanvas = document.getElementById('snow-canvas');
        const ctx = snowCanvas.getContext('2d');
        let snowActive = true;
        function resize() { snowCanvas.width = window.innerWidth; snowCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        let pts = Array.from({length:45}, () => ({x:Math.random(), y:Math.random(), s:Math.random()*1.8+0.5}));
        
        function anim(){
            ctx.clearRect(0,0,snowCanvas.width,snowCanvas.height);
            if(snowActive) {
                ctx.fillStyle = "rgba(255,255,255,0.4)";
                pts.forEach(p => { 
                    p.y += 0.0006; if(p.y>1) p.y=0; 
                    ctx.beginPath(); ctx.arc(p.x*snowCanvas.width, p.y*snowCanvas.height, p.s, 0, Math.PI*2); ctx.fill(); 
                });
            }
            requestAnimationFrame(anim);
        }
        anim();
        function toggleSnow() { 
            snowActive = !snowActive; 
            document.getElementById('snow-btn').innerText = snowActive ? "❄️" : "🚫"; 
        }

        // 3. 一言
        function fetchHitokoto() {
            const textEl = document.getElementById('hitokoto_text');
            const fromEl = document.getElementById('hitokoto_from');
            textEl.style.opacity = 0; fromEl.style.opacity = 0;
            fetch('https://v1.hitokoto.cn').then(res => res.json()).then(data => {
                setTimeout(() => {
                    textEl.innerText = data.hitokoto;
                    fromEl.innerText = `—— 「${data.from}」`;
                    textEl.style.opacity = 1; fromEl.style.opacity = 1;
                }, 300);
            });
        }
        fetchHitokoto();

        // 4. MC 查询
        async function checkMCServer() {
            const ip = document.getElementById('mc_ip').value;
            const resDiv = document.getElementById('mc_result');
            if(!ip) return;
            resDiv.classList.remove('hidden');
            const onlineEl = document.getElementById('mc_online');
            onlineEl.innerText = "CONNECTING..."; onlineEl.style.color = "#94a3b8";
            try {
                const response = await fetch(`https://api.mcstatus.io/v2/status/java/${ip}`);
                const data = await response.json();
                if(data.online) {
                    onlineEl.innerText = "ONLINE"; onlineEl.style.color = "#10b981";
                    document.getElementById('mc_players').innerText = `${data.players.online} / ${data.players.max}`;
                    document.getElementById('mc_ver').innerText = (data.version.name_clean || data.version.name).substring(0, 15);
                } else {
                    onlineEl.innerText = "OFFLINE"; onlineEl.style.color = "#ef4444";
                }
            } catch (e) { onlineEl.innerText = "TIMEOUT"; onlineEl.style.color = "#ef4444"; }
        }
    </script>
</body>
</html>
