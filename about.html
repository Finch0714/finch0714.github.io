<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>欢迎</title>
    
    <link rel="icon" type="image/png" href="Favicon.png">
    
    <link rel="preload" as="image" href="https://picui.ogmua.cn/s1/2026/03/27/69c69b7519753.webp">
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="dns-prefetch" href="https://visage.surgeplay.com">

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.loli.net/css2?family=Inter:wght@400;600;700;900&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --font-main: 'Inter', sans-serif; --font-serif: 'Noto Serif SC', serif; }
        
        body { 
            font-family: var(--font-main); 
            margin: 0; background-color: #111; overflow-x: hidden; 
            display: flex; flex-direction: column; align-items: center;
            padding: 7rem 1.5rem 3rem 1.5rem; 
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        #bg-layer { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 1s ease-out; 
            z-index: -2;
        }
        
        #bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.15); z-index: -1; }
        
        .glass { 
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* --- 老旧浏览器兼容性布局补丁 --- */
        .card-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 64rem; 
            z-index: 10;
            flex-grow: 1;
            /* 垂直方向的负 margin，抵消 main-card 的间距 */
            margin: -1.25rem 0; 
        }

        .main-card {
            margin: 1.25rem 0; /* 替代 gap-10 */
        }

        .flex-row-stack {
            display: flex;
            flex-wrap: wrap; /* 自动换行 */
            justify-content: center;
            width: 100%;
            /* 水平方向负 margin，抵消 inner-card 的间距 */
            margin: -1rem; 
        }

        .inner-card {
            margin: 1rem; /* 替代 gap-8 */
        }
        /* ---------------------------- */

        .ctrl-ball {
            width: 2.5rem; height: 2.5rem; display: flex; align-items: center; justify-content: center;
            cursor: pointer; border-radius: 0.75rem; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 150; font-size: 1.2rem;
        }
        .ctrl-ball:active { transform: scale(0.85); }

        .expand-container { transition: max-height 0.5s ease-in-out; max-height: 85px; overflow: hidden; }
        .expand-container.expanded { max-height: 1200px; }

        .hitokoto-card { font-family: var(--font-serif); writing-mode: vertical-rl; text-orientation: mixed; }
        @media (max-width: 1024px) { .hitokoto-card { writing-mode: horizontal-tb; } }
        
        #contact-modal { display: none; position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.5); backdrop-blur: 10px; }
        #contact-modal.active { display: flex; animation: modalIn 0.3s forwards; align-items: center; justify-content: center; }
        
        @keyframes modalIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>

<body>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>

    <div class="fixed top-6 left-6 flex gap-4 z-[150]">
        <div class="ctrl-ball glass" onclick="toggleSnow()">❄️</div>
        <div class="ctrl-ball glass" onclick="changeWallpaper()">🖼️</div>
    </div>

    <canvas id="snow-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5;"></canvas>

    <div class="card-container">
        <div class="flex-row-stack main-card">
            
            <div class="glass lg:w-32 w-full p-8 lg:py-12 rounded-3xl shadow-xl relative flex items-center justify-center inner-card">
                <div class="hitokoto-card text-gray-800 font-bold">
                    <span id="hitokoto_text" class="text-base leading-loose tracking-widest opacity-0 transition-opacity duration-500">加载中...</span>
                    <span id="hitokoto_from" class="text-xs text-gray-700 mt-6 font-black opacity-0 block text-right"></span>
                </div>
                <button onclick="fetchHitokoto()" class="absolute bottom-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-white bg-opacity-20 hover:bg-opacity-40 transition-colors">🔄</button>
            </div>

            <div id="profile-card" class="glass max-w-xl w-full rounded-3xl shadow-2xl overflow-hidden inner-card">
                <div class="p-10 text-center border-b border-black border-opacity-5">
                    <div class="w-20 h-20 rounded-full mx-auto mb-6 shadow-xl overflow-hidden border-4 border-white bg-gray-100">
                        <img src="./avatar.jpg" alt="Avatar" class="w-full h-full object-cover">
                    </div>
                    <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Finch0714</h1>
                    <p class="text-gray-600 mt-2 italic text-sm font-light">restless, resetless.</p>
                </div>
                <div class="p-10 text-center">
                    <p class="text-gray-800 leading-relaxed mb-10 text-sm font-semibold">你好！欢迎来到我的主页。我是一个热衷于终身学习和影视、游戏的探索者。</p>
                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <a href="https://space.bilibili.com/2091924618" target="_blank" class="px-10 py-3 bg-pink-500 text-white rounded-2xl font-bold text-sm shadow-lg active:scale-95 transition-all">Bilibili</a>
                        <button onclick="openModal()" class="px-10 py-3 bg-white bg-opacity-40 text-gray-800 border border-white rounded-2xl font-bold text-sm shadow-md active:scale-95 transition-all">获取联系</button>
                    </div>
                </div>
            </div>

        </div>

        <div id="mc_container" class="glass max-w-xl lg:max-w-4xl w-full p-6 rounded-3xl shadow-xl flex flex-col expand-container main-card">
            <div class="flex justify-between items-center min-h-[40px] px-2">
                <h2 class="text-xs font-black text-gray-900 tracking-widest flex items-center gap-2 uppercase"><span class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-lg"></span> MC智能信息查询</h2>
                <div class="flex items-center gap-4">
                    <img id="mc_icon" src="" class="w-8 h-8 rounded-lg shadow-md hidden bg-white/20">
                    <button id="mc_toggle_btn" onclick="toggleMC()" class="text-[10px] font-black text-gray-700 px-4 py-1.5 border border-black/10 rounded-full bg-white/20">展开详情</button>
                </div>
            </div>
            <div class="mt-8 space-y-8 px-2">
                <div class="flex flex-col md:flex-row gap-4">
                    <input id="mc_input" type="text" placeholder="输入服务器IP或玩家id 如mc.hypixel.net/Dream" class="flex-1 bg-white bg-opacity-40 border-2 border-white border-opacity-60 rounded-2xl px-6 py-4 text-sm focus:outline-none focus:border-green-500 text-gray-900 font-black transition-all shadow-inner">
                    <button onclick="smartQuery()" class="bg-gray-800 text-white px-10 py-4 rounded-2xl text-xs font-bold tracking-widest shadow-lg active:scale-95 transition-all">开始查询</button>
                </div>
                <div id="mc_result_box" class="hidden border-t border-black/5 pt-8">
                    <div id="player_display" class="hidden flex flex-col md:flex-row items-center md:items-start gap-10">
                        <img id="player_3d" src="" class="h-72 drop-shadow-2xl object-contain">
                        <div class="flex-1 w-full space-y-6">
                            <div><p class="text-[10px] font-bold text-gray-500 uppercase mb-2 tracking-widest">UUID</p><p id="player_uuid" class="text-xs font-mono bg-black/5 p-4 rounded-2xl break-all text-gray-800 font-bold"></p></div>
                            <div class="grid grid-cols-2 gap-3">
                                <a id="btn_namemc" target="_blank" class="p-3 bg-white/30 border border-white/40 rounded-2xl text-[10px] font-black text-center text-gray-700">NameMC</a>
                                <a id="btn_skin" target="_blank" class="p-3 bg-white/30 border border-white/40 rounded-2xl text-[10px] font-black text-center text-gray-700">Skin</a>
                            </div>
                        </div>
                    </div>
                    <div id="server_display" class="hidden grid grid-cols-3 gap-4 font-mono text-xs">
                        <div class="p-4 bg-white/30 rounded-2xl text-center"><p class="mb-1 text-gray-500 font-bold text-[9px]">STATUS</p><span id="mc_online" class="font-black"></span></div>
                        <div class="p-4 bg-white/30 rounded-2xl text-center"><p class="mb-1 text-gray-500 font-bold text-[9px]">PLAYERS</p><span id="mc_players" class="font-black"></span></div>
                        <div class="p-4 bg-white/30 rounded-2xl text-center"><p class="mb-1 text-gray-500 font-bold text-[9px]">VERSION</p><span id="mc_ver" class="font-black"></span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="glass max-w-xl lg:max-w-4xl w-full p-8 rounded-3xl shadow-xl flex flex-col main-card items-center">
            <div class="w-full flex justify-start mb-6"><h2 class="text-xs font-black text-gray-800 tracking-widest uppercase flex items-center gap-2"><span class="w-2 h-2 bg-purple-500 rounded-full"></span>个人私藏网站</h2></div>
            <a href="https://b23.tv/to79uAN" target="_blank" class="w-full max-w-xs bg-gray-800 text-white py-4 rounded-2xl text-xs font-bold tracking-widest shadow-lg active:scale-95 transition-all text-center">点击进入</a>
        </div>

        <div class="glass max-w-xl lg:max-w-4xl w-full p-8 rounded-3xl shadow-xl flex flex-col main-card items-center">
            <div class="w-full flex justify-start mb-6"><h2 class="text-xs font-black text-gray-800 tracking-widest uppercase flex items-center gap-2"><span class="w-2 h-2 bg-pink-500 rounded-full"></span>幸运福利</h2></div>
            <a href="./luckydraw.html" class="w-full max-w-xs bg-white bg-opacity-20 border border-white border-opacity-40 text-gray-800 py-4 rounded-2xl text-xs font-bold tracking-widest shadow-md active:scale-95 transition-all text-center">幸运抽奖</a>
        </div>
    </div>

    <footer class="w-full flex justify-center py-10 z-10">
        <div class="flex items-center gap-4 opacity-60 hover:opacity-100 transition-opacity cursor-default bg-white bg-opacity-10 px-6 py-2 rounded-full border border-white border-opacity-10">
            <div class="flex items-center gap-2">
                <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest">浏览数</span>
                <span id="busuanzi_value_site_pv" class="text-xs font-mono text-gray-800 font-black">...</span>
            </div>
            <span class="text-gray-500 opacity-30">|</span>
            <div class="flex items-center gap-2">
                <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest">访客数</span>
                <span id="busuanzi_value_site_uv" class="text-xs font-mono text-gray-800 font-black">...</span>
            </div>
        </div>
    </footer>

    <div id="contact-modal" onclick="if(event.target==this) closeModal()">
        <div class="glass max-w-sm w-full p-10 rounded-3xl shadow-2xl relative text-center" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 p-2 hover:text-gray-800 transition-colors">✕</button>
            <h3 class="text-xs font-black text-gray-800 mb-8 uppercase tracking-widest">Contact</h3>
            <div class="space-y-4">
                <div class="p-5 bg-white/30 rounded-2xl flex items-center justify-between shadow-inner"><span class="text-[10px] font-bold text-gray-500">QQ</span><span class="text-sm font-mono text-gray-900 font-black select-all">861288676</span></div>
                <div class="p-5 bg-white/30 rounded-2xl flex items-center justify-between shadow-inner"><span class="text-[10px] font-bold text-gray-500">EMAIL</span><span class="text-sm font-mono text-gray-900 font-black select-all">finch0714@qq.com</span></div>
                <div class="p-5 bg-white/30 rounded-2xl flex items-center justify-between shadow-inner"><span class="text-[10px] font-bold text-gray-500">STEAM</span><span class="text-sm font-mono text-gray-900 font-black select-all">Latetelly</span></div>
            </div>
            <button onclick="closeModal()" class="w-full mt-8 py-4 bg-gray-800 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest">Close</button>
        </div>
    </div>

    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    <script>
        const bgLayer = document.getElementById('bg-layer');
        const myWallpapers = [
            "https://picui.ogmua.cn/s1/2026/03/27/69c69b7519753.webp",
            "https://picui.ogmua.cn/s1/2026/03/31/69cbe0b27f7c7.webp",
            "https://picui.ogmua.cn/s1/2026/03/31/69cbe0f9533b3.webp",
            "https://picui.ogmua.cn/s1/2026/03/31/69cbe0b2b8305.webp",
            "https://picui.ogmua.cn/s1/2026/03/31/69cbe0f903373.webp"
        ];
        
        let currentIdx = Math.floor(Math.random() * myWallpapers.length);
        let useAPI = false;
        bgLayer.style.backgroundImage = `url('${myWallpapers[currentIdx]}')`;

        function changeWallpaper() {
            let nextUrl = "";
            if (!useAPI) {
                currentIdx++;
                if (currentIdx >= myWallpapers.length) {
                    useAPI = true;
                    nextUrl = `https://wp.upx8.com/api.php?_t=${Date.now()}`;
                } else {
                    nextUrl = myWallpapers[currentIdx];
                }
            } else {
                nextUrl = `https://wp.upx8.com/api.php?_t=${Date.now()}`;
            }
            const img = new Image(); 
            img.src = nextUrl;
            img.onload = () => { 
                bgLayer.style.opacity = 0; 
                setTimeout(() => { 
                    bgLayer.style.backgroundImage = `url('${nextUrl}')`; 
                    bgLayer.style.opacity = 1; 
                }, 400); 
            };
        }

        function toggleMC() { const c = document.getElementById('mc_container'), b = document.getElementById('mc_toggle_btn'); const isExp = c.classList.toggle('expanded'); b.innerText = isExp ? "收起面板" : "展开详情"; }
        async function smartQuery() { const val = document.getElementById('mc_input').value.trim(); const resBox = document.getElementById('mc_result_box'), pDisp = document.getElementById('player_display'), sDisp = document.getElementById('server_display'), iconImg = document.getElementById('mc_icon'); if(!val) return; resBox.classList.remove('hidden'); if (val.includes('.')) { pDisp.classList.add('hidden'); sDisp.classList.remove('hidden'); try { const res = await fetch(`https://api.mcstatus.io/v2/status/java/${val}`), d = await res.json(); if(d.online) { document.getElementById('mc_online').innerText = "在线"; document.getElementById('mc_players').innerText = `${d.players.online}/${d.players.max}`; document.getElementById('mc_ver').innerText = (d.version.name_clean || d.version.name).substring(0, 12); iconImg.src = d.icon || `https://visage.surgeplay.com/bust/128/steve`; iconImg.classList.remove('hidden'); } else { document.getElementById('mc_online').innerText = "离线"; } } catch(e) { document.getElementById('mc_online').innerText = "错误"; } } else { sDisp.classList.add('hidden'); pDisp.classList.remove('hidden'); document.getElementById('player_3d').src = `https://visage.surgeplay.com/full/384/${val}`; iconImg.src = `https://visage.surgeplay.com/face/128/${val}`; iconImg.classList.remove('hidden'); try { const res = await fetch(`https://playerdb.co/api/player/minecraft/${val}`), j = await res.json(); if(j.success) document.getElementById('player_uuid').innerText = j.data.player.id; document.getElementById('btn_namemc').href = `https://namemc.com/profile/${val}`; document.getElementById('btn_skin').href = `https://visage.surgeplay.com/skin/${val}`; } catch(e) { document.getElementById('player_uuid').innerText = "获取失败"; } } }
        function fetchHitokoto() { const t = document.getElementById('hitokoto_text'), f = document.getElementById('hitokoto_from'); t.style.opacity = 0; f.style.opacity = 0; fetch('https://v1.hitokoto.cn').then(r => r.json()).then(d => { t.innerText = d.hitokoto; f.innerText = `—— 「${d.from}」`; t.style.opacity = 1; f.style.opacity = 0.9; }); } fetchHitokoto();
        function openModal() { document.getElementById('contact-modal').classList.add('active'); }
        function closeModal() { document.getElementById('contact-modal').classList.remove('active'); }
        const canvas = document.getElementById('snow-canvas'), ctx = canvas.getContext('2d');
        let snowActive = true;
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        let pts = Array.from({length:40}, () => ({x:Math.random(), y:Math.random(), s:Math.random()*1.5+0.5}));
        function anim() { ctx.clearRect(0,0,canvas.width,canvas.height); if(snowActive) { ctx.fillStyle = "rgba(255,255,255,0.45)"; pts.forEach(p => { p.y += 0.0008; if(p.y>1) p.y=0; ctx.beginPath(); ctx.arc(p.x*canvas.width, p.y*canvas.height, p.s, 0, Math.PI*2); ctx.fill(); }); } requestAnimationFrame(anim); } anim();
        function toggleSnow() { snowActive = !snowActive; }
    </script>
</body>
</html>
