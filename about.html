<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finch0714 | 个人主页</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.loli.net/css2?family=Inter:wght@300;400;600&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --font-main: 'Inter', sans-serif; --font-serif: 'Noto Serif SC', serif; }
        body { font-family: var(--font-main); margin: 0; background-color: #111; overflow-x: hidden; display: flex; justify-content: center; }

        /* 背景层 - 稳定方案 */
        #bg-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-size: cover; background-position: center; transition: opacity 1s; z-index: -2; opacity: 0; will-change: opacity; }
        #bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.25); z-index: -1; }
        .gradient-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab); background-size: 400% 400%; animation: grad 15s ease infinite; z-index: -3; }
        @keyframes grad { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* 💡 透明度统一修正为 0.39 */
        .glass { 
            background: rgba(255, 255, 255, 0.39); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .tilt-card { transform-style: preserve-3d; perspective: 1000px; }
        .hitokoto-card { font-family: var(--font-serif); writing-mode: vertical-rl; text-orientation: mixed; }
        @media (max-width: 1024px) { .hitokoto-card { writing-mode: horizontal-tb; } }

        #contact-modal { display: none; }
        #contact-modal.active { display: flex; animation: modalIn 0.3s ease-out forwards; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>

<body class="p-6 py-12 lg:py-16" onmousemove="handleTilt(event)">
    <div class="gradient-bg"></div>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>

    <div class="fixed top-6 left-6 flex gap-3 z-[100]">
        <div class="w-10 h-10 glass rounded-xl flex items-center justify-center cursor-pointer shadow-xl active:scale-90" onclick="toggleSnow()">❄️</div>
        <div class="w-10 h-10 glass rounded-xl flex items-center justify-center cursor-pointer shadow-xl active:scale-90" onclick="changeWallpaper()">🖼️</div>
    </div>

    <canvas id="snow-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5;"></canvas>

    <div class="flex flex-col items-center gap-10 w-full max-w-7xl z-10">
        <div class="flex flex-col lg:flex-row items-center lg:items-stretch justify-center gap-8 w-full tilt-card">
            <div id="profile-card" class="glass max-w-xl w-full rounded-[3rem] shadow-2xl overflow-hidden order-2 lg:order-1">
                <div class="p-10 text-center border-b border-black/5">
                    <div class="w-20 h-20 rounded-full mx-auto mb-6 shadow-xl overflow-hidden border-4 border-white bg-gray-100">
                        <img src="avatar.jpg" alt="头像" class="w-full h-full object-cover">
                    </div>
                    <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Finch0714</h1>
                    <p class="text-gray-600 mt-2 italic text-sm font-light">restless, resetless.</p>
                </div>
                <div class="p-10 text-center">
                    <p class="text-gray-700 leading-relaxed mb-10 text-sm">你好！欢迎来到我的主页。我是一个热衷于终身学习和影视、游戏的探索者。</p>
                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <a href="https://space.bilibili.com/2066563707" target="_blank" class="px-10 py-3 bg-[#fb7299] text-white rounded-2xl font-semibold text-sm shadow-md hover:scale-105 transition-transform">Bilibili</a>
                        <button onclick="openModal()" class="px-10 py-3 bg-white/40 text-gray-800 border border-white rounded-2xl font-semibold text-sm shadow-md hover:bg-white/60 transition-all">获取联系</button>
                    </div>
                </div>
            </div>

            <div onclick="fetchHitokoto()" class="glass lg:w-24 w-full p-8 lg:py-12 rounded-[3rem] shadow-xl cursor-pointer hover:bg-white/50 transition-all flex items-center justify-center order-1 lg:order-2 group">
                <div class="hitokoto-card text-gray-800 group-active:scale-95 transition-transform">
                    <span id="hitokoto_text" class="text-base leading-loose tracking-[0.2em] opacity-0 transition-opacity">加载中...</span>
                    <span id="hitokoto_from" class="text-[10px] text-gray-700 mt-6 font-black opacity-0 block text-right"></span>
                </div>
            </div>
        </div>

        <div class="glass max-w-xl lg:max-w-4xl w-full p-10 rounded-[3rem] shadow-xl flex flex-col order-3">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-xs font-bold text-gray-600 tracking-widest flex items-center gap-2 uppercase">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_#10b981]"></span> MC_SMART_SYSTEM
                </h2>
                <img id="mc_icon" src="" class="w-12 h-12 rounded-xl shadow-lg hidden bg-black/10">
            </div>

            <div class="flex flex-col md:flex-row gap-4">
                <input id="mc_input" type="text" placeholder="输入服务器IP或玩家ID 如mc.hypixel.net或Dream class="flex-1 bg-black/10 border border-white/30 rounded-2xl px-6 py-4 text-sm focus:outline-none focus:ring-2 focus:ring-white/30 text-gray-800 placeholder-gray-500">
                <button onclick="smartQuery()" class="bg-gray-800 text-white px-10 py-4 rounded-2xl text-[10px] font-bold tracking-widest hover:bg-black transition-all shadow-lg active:scale-95">MC信息聚合查询</button>
            </div>

            <div id="mc_result_box" class="mt-10 hidden border-t border-black/5 pt-10">
                <div id="player_display" class="hidden flex flex-col md:flex-row items-center md:items-start gap-10">
                    <div class="relative group">
                        <img id="player_3d" src="" class="h-64 drop-shadow-2xl transition-transform group-hover:scale-110 duration-500">
                    </div>
                    <div class="flex-1 w-full space-y-6">
                        <div>
                            <p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1">UUID / Entity ID</p>
                            <p id="player_uuid" class="text-xs font-mono bg-black/5 p-4 rounded-2xl break-all text-gray-700 select-all"></p>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <a id="btn_namemc" target="_blank" class="p-4 bg-white/20 border border-white/30 rounded-2xl text-[10px] font-bold text-center text-gray-700 hover:bg-white/40 transition-all">档案: NAMEMC ↗</a>
                            <a id="btn_skin" target="_blank" class="p-4 bg-white/20 border border-white/30 rounded-2xl text-[10px] font-bold text-center text-gray-700 hover:bg-white/40 transition-all">下载皮肤 SKIN </a>
                        </div>
                        <p class="text-[9px] text-gray-400 italic">提示: 由于 Mojang API 限制，历史记录请通过档案按钮在 NameMC 查看。</p>
                    </div>
                </div>

                <div id="server_display" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6 font-mono text-[11px] text-gray-600">
                    <div class="p-5 bg-white/20 rounded-2xl text-center shadow-inner"><p class="mb-1 opacity-60">STATE</p><span id="mc_online" class="font-black"></span></div>
                    <div class="p-5 bg-white/20 rounded-2xl text-center shadow-inner"><p class="mb-1 opacity-60">PLAYERS</p><span id="mc_players" class="font-black text-gray-700"></span></div>
                    <div class="p-5 bg-white/20 rounded-2xl text-center shadow-inner"><p class="mb-1 opacity-60">VERSION</p><span id="mc_ver" class="font-black text-gray-700"></span></div>
                </div>
            </div>
        </div>
    </div>

    <div id="contact-modal" class="fixed inset-0 z-[200] items-center justify-center p-6 bg-black/40 backdrop-blur-sm" onclick="if(event.target==this) closeModal()">
        <div class="glass max-w-sm w-full p-10 rounded-[3rem] shadow-2xl relative text-center">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-gray-400 hover:text-gray-800">✕</button>
            <h3 class="text-xl font-bold text-gray-800 mb-8 uppercase tracking-widest">Connect</h3>
            <div class="space-y-4">
                <div class="p-5 bg-white/30 rounded-2xl flex items-center justify-between group hover:bg-white/50 transition-all cursor-pointer">
                    <span class="text-[10px] font-bold text-gray-500">QQ</span>
                    <span class="text-sm font-mono text-gray-800 select-all">861288676</span>
                </div>
                <div class="p-5 bg-white/30 rounded-2xl flex items-center justify-between group hover:bg-white/50 transition-all cursor-pointer">
                    <span class="text-[10px] font-bold text-gray-500">EMAIL</span>
                    <span class="text-sm font-mono text-gray-800 select-all">finch0714@qq.com</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. 3D 资料卡交互
        const card = document.getElementById('profile-card');
        function handleTilt(e) {
            if(window.innerWidth < 1024) return;
            const { clientX, clientY } = e;
            const { innerWidth, innerHeight } = window;
            const xRotation = ((clientY / innerHeight) - 0.5) * 12;
            const yRotation = ((clientX / innerWidth) - 0.5) * -12;
            card.style.transform = `rotateX(${xRotation}deg) rotateY(${yRotation}deg) scale3d(1.02, 1.02, 1.02)`;
        }
        window.addEventListener('mouseleave', () => { card.style.transform = `rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`; });

        // 2. 智能聚合查询 (稳定回退方案)
        async function smartQuery() {
            const val = document.getElementById('mc_input').value.trim();
            const resBox = document.getElementById('mc_result_box');
            const pDisplay = document.getElementById('player_display');
            const sDisplay = document.getElementById('server_display');
            const iconImg = document.getElementById('mc_icon');

            if(!val) return;
            resBox.classList.remove('hidden');
            iconImg.classList.add('hidden');

            if (val.includes('.')) {
                // --- 服务器查询 ---
                pDisplay.classList.add('hidden'); sDisplay.classList.remove('hidden');
                document.getElementById('mc_online').innerText = "CONNECTING...";
                try {
                    const res = await fetch(`https://api.mcstatus.io/v2/status/java/${val}`);
                    const data = await res.json();
                    if(data.online) {
                        document.getElementById('mc_online').innerText = "ONLINE";
                        document.getElementById('mc_players').innerText = `${data.players.online}/${data.players.max}`;
                        document.getElementById('mc_ver').innerText = (data.version.name_clean || data.version.name).substring(0, 15);
                        iconImg.src = data.icon || `https://eu.mc-api.net/v3/server/favicon/${val}`;
                        iconImg.classList.remove('hidden');
                    } else { document.getElementById('mc_online').innerText = "OFFLINE"; }
                } catch(e) { document.getElementById('mc_online').innerText = "ERROR"; }
            } else {
                // --- 玩家查询 (回退方案) ---
                sDisplay.classList.add('hidden'); pDisplay.classList.remove('hidden');
                document.getElementById('player_3d').src = `https://mc-heads.net/body/${val}/right`;
                iconImg.src = `https://mc-heads.net/avatar/${val}`;
                iconImg.classList.remove('hidden');
                
                const uuidEl = document.getElementById('player_uuid');
                uuidEl.innerText = "Fetching UUID...";

                try {
                    // 获取 UUID 的稳定 API
                    const res = await fetch(`https://api.mojang.com/users/profiles/minecraft/${val}`);
                    // 由于跨域限制，回退到第三方 UUID 转换器
                    const resAlt = await fetch(`https://api.minetools.eu/uuid/${val}`);
                    const data = await resAlt.json();
                    
                    if(data.id) {
                        const uuid = data.id;
                        uuidEl.innerText = uuid;
                        // 动态设置链接
                        document.getElementById('btn_namemc').href = `https://namemc.com/profile/${val}`;
                        document.getElementById('btn_skin').href = `https://mc-heads.net/download/${uuid}`;
                    } else { uuidEl.innerText = "Player not found."; }
                } catch(e) { uuidEl.innerText = "ID verified via mc-heads."; }
            }
        }

        // 基础功能逻辑
        function openModal() { document.getElementById('contact-modal').classList.add('active'); }
        function closeModal() { document.getElementById('contact-modal').classList.remove('active'); }

        function changeWallpaper() {
            const bgLayer = document.getElementById('bg-layer');
            const imgUrl = `https://wp.upx8.com/api.php?_t=${new Date().getTime()}`;
            const tempImg = new Image(); tempImg.src = imgUrl;
            tempImg.onload = () => {
                bgLayer.style.opacity = 0;
                setTimeout(() => { bgLayer.style.backgroundImage = `url('${imgUrl}')`; bgLayer.style.opacity = 1; }, 350);
            };
        }
        changeWallpaper();

        function fetchHitokoto() {
            const t = document.getElementById('hitokoto_text'), f = document.getElementById('hitokoto_from');
            t.style.opacity = 0; f.style.opacity = 0;
            fetch('https://v1.hitokoto.cn').then(res => res.json()).then(d => {
                setTimeout(() => { t.innerText = d.hitokoto; f.innerText = `—— 「${d.from}」`; t.style.opacity = 1; f.style.opacity = 0.9; }, 250);
            });
        }
        fetchHitokoto();

        // 雪花...
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let snowActive = true;
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        let pts = Array.from({length:40}, () => ({x:Math.random(), y:Math.random(), s:Math.random()*1.5+0.5}));
        function anim() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            if(snowActive) {
                ctx.fillStyle = "rgba(255,255,255,0.4)";
                pts.forEach(p => { p.y += 0.0007; if(p.y>1) p.y=0; ctx.beginPath(); ctx.arc(p.x*canvas.width, p.y*canvas.height, p.s, 0, Math.PI*2); ctx.fill(); });
            }
            requestAnimationFrame(anim);
        }
        anim();
        function toggleSnow() { snowActive = !snowActive; }
    </script>
</body>
</html>
