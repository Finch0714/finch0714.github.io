<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 | Finch0714</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.loli.net/css2?family=Inter:wght@300;400;600&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --font-main: 'Inter', sans-serif; --font-serif: 'Noto Serif SC', serif; }
        body { font-family: var(--font-main); margin: 0; background-color: #111; overflow-x: hidden; display: flex; justify-content: center; }

        /* 背景层 - 防抖方案 */
        #bg-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-size: cover; background-position: center; transition: opacity 1s; z-index: -2; opacity: 0; will-change: opacity; }
        #bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.25); z-index: -1; }
        .gradient-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab); background-size: 400% 400%; animation: grad 15s ease infinite; z-index: -3; }
        @keyframes grad { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .glass { background: rgba(255, 255, 255, 0.48); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.25); }
        .hitokoto-card { font-family: var(--font-serif); writing-mode: vertical-rl; text-orientation: mixed; }
        @media (max-width: 1024px) { .hitokoto-card { writing-mode: horizontal-tb; } }

        /* 弹窗 */
        #contact-modal { display: none; }
        #contact-modal.active { display: flex; animation: modalIn 0.3s ease-out forwards; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* 历史名称滚动条 */
        .name-history-list::-webkit-scrollbar { width: 4px; }
        .name-history-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
    </style>
</head>

<body class="p-6 py-12 lg:py-16">
    <div class="gradient-bg"></div>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>

    <div class="fixed top-6 left-6 flex gap-3 z-[100]">
        <div class="w-10 h-10 glass rounded-xl flex items-center justify-center cursor-pointer shadow-xl" onclick="toggleSnow()">❄️</div>
        <div class="w-10 h-10 glass rounded-xl flex items-center justify-center cursor-pointer shadow-xl" onclick="changeWallpaper()">🖼️</div>
    </div>

    <canvas id="snow-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5;"></canvas>

    <div class="flex flex-col items-center gap-10 w-full max-w-7xl z-10">
        <div class="flex flex-col lg:flex-row items-center lg:items-stretch justify-center gap-8 w-full">
            <div class="glass max-w-xl w-full rounded-[3rem] shadow-2xl overflow-hidden order-2 lg:order-1">
                <div class="p-10 text-center border-b border-black/5">
                    <div class="w-20 h-20 rounded-full mx-auto mb-6 shadow-xl overflow-hidden border-4 border-white bg-gray-100">
                        <img src="avatar.jpg" alt="头像" class="w-full h-full object-cover">
                    </div>
                    <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Finch0714</h1>
                    <p class="text-gray-500 mt-2 italic text-sm font-light">restless, resetless.</p>
                </div>
                <div class="p-10 text-center">
                    <p class="text-gray-600 leading-relaxed mb-10 text-sm">你好！欢迎来到我的主页。我是一个热衷于终身学习和影视、游戏的探索者。</p>
                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <a href="https://space.bilibili.com/2066563707" target="_blank" class="px-10 py-3 bg-[#fb7299] text-white rounded-2xl font-semibold text-sm shadow-md">Bilibili</a>
                        <button onclick="openModal()" class="px-10 py-3 bg-white/40 text-gray-800 border border-white rounded-2xl font-semibold text-sm shadow-md">获取联系</button>
                    </div>
                </div>
            </div>

            <div onclick="fetchHitokoto()" class="glass lg:w-24 w-full p-8 lg:py-12 rounded-[3rem] shadow-xl cursor-pointer hover:bg-white/50 transition-all flex items-center justify-center order-1 lg:order-2">
                <div class="hitokoto-card text-gray-800">
                    <span id="hitokoto_text" class="text-base leading-loose tracking-[0.2em] opacity-0 transition-opacity duration-700">正在生成灵感...</span>
                    <span id="hitokoto_from" class="text-[10px] text-gray-700 mt-6 font-black opacity-0 block text-right"></span>
                </div>
            </div>
        </div>

        <div class="glass max-w-xl lg:max-w-4xl w-full p-10 rounded-[3rem] shadow-xl flex flex-col order-3">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-xs font-bold text-gray-500 tracking-widest flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_#10b981]"></span> MC_INTELLIGENT_PROBE
                </h2>
                <img id="mc_icon" src="" class="w-12 h-12 rounded-xl shadow-lg hidden bg-black/5">
            </div>

            <div class="flex flex-col md:flex-row gap-4">
                <input id="mc_input" type="text" placeholder="输入服务器 IP 或 玩家 ID..." class="flex-1 bg-black/5 border border-white/30 rounded-2xl px-6 py-4 text-sm focus:outline-none focus:ring-2 focus:ring-white/30 text-gray-700">
                <button onclick="smartQuery()" class="bg-gray-800 text-white px-10 py-4 rounded-2xl text-[10px] font-bold tracking-widest hover:bg-black transition-all shadow-lg">RUN_SMART_SEARCH</button>
            </div>

            <div id="mc_result_box" class="mt-10 hidden border-t border-black/5 pt-10">
                <div id="player_display" class="hidden flex flex-col md:flex-row items-center md:items-start gap-10">
                    <img id="player_3d" src="" class="h-64 drop-shadow-2xl">
                    <div class="flex-1 w-full space-y-6">
                        <div>
                            <p class="text-[9px] font-bold text-gray-400 uppercase tracking-tighter mb-1">Current UUID</p>
                            <p id="player_uuid" class="text-xs font-mono bg-black/5 p-3 rounded-xl break-all text-gray-600 select-all"></p>
                        </div>
                        <div>
                            <p class="text-[9px] font-bold text-gray-400 uppercase tracking-tighter mb-2">Name History</p>
                            <div id="history_list" class="name-history-list max-h-40 overflow-y-auto space-y-2 pr-2">
                                </div>
                        </div>
                    </div>
                </div>

                <div id="server_display" class="hidden grid grid-cols-1 md:grid-cols-3 gap-6 font-mono text-[11px] text-gray-500">
                    <div class="p-5 bg-white/20 rounded-2xl text-center"><p class="mb-1 opacity-60">STATE</p><span id="mc_online" class="font-black"></span></div>
                    <div class="p-5 bg-white/20 rounded-2xl text-center"><p class="mb-1 opacity-60">PLAYERS</p><span id="mc_players" class="font-black text-gray-700"></span></div>
                    <div class="p-5 bg-white/20 rounded-2xl text-center"><p class="mb-1 opacity-60">VERSION</p><span id="mc_ver" class="font-black text-gray-700"></span></div>
                </div>
            </div>
        </div>
    </div>

    <div id="contact-modal" class="fixed inset-0 z-[200] items-center justify-center p-6 bg-black/40 backdrop-blur-sm">
        <div class="glass max-w-sm w-full p-10 rounded-[3rem] shadow-2xl relative text-center">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-gray-400 hover:text-gray-800">✕</button>
            <h3 class="text-xl font-bold text-gray-800 mb-8">获取联系</h3>
            <div class="space-y-4">
                <div class="p-4 bg-white/30 rounded-2xl flex items-center justify-between">
                    <span class="text-[10px] font-bold text-gray-500">QQ</span>
                    <span class="text-sm font-mono text-gray-800">你的QQ</span>
                </div>
                <div class="p-4 bg-white/30 rounded-2xl flex items-center justify-between">
                    <span class="text-[10px] font-bold text-gray-500">EMAIL</span>
                    <span class="text-sm font-mono text-gray-800">example@mail.com</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openModal() { document.getElementById('contact-modal').classList.add('active'); }
        function closeModal() { document.getElementById('contact-modal').classList.remove('active'); }

        async function smartQuery() {
            const val = document.getElementById('mc_input').value.trim();
            const resBox = document.getElementById('mc_result_box');
            const pDisplay = document.getElementById('player_display');
            const sDisplay = document.getElementById('server_display');
            const iconImg = document.getElementById('mc_icon');

            if(!val) return;
            resBox.classList.remove('hidden');
            iconImg.classList.add('hidden');

            if (val.includes('.')) {
                // --- 服务器模式 ---
                pDisplay.classList.add('hidden'); sDisplay.classList.remove('hidden');
                const onlineEl = document.getElementById('mc_online');
                onlineEl.innerText = "QUERYING...";
                try {
                    const res = await fetch(`https://api.mcstatus.io/v2/status/java/${val}`);
                    const data = await res.json();
                    if(data.online) {
                        onlineEl.innerText = "ONLINE"; onlineEl.style.color = "#10b981";
                        document.getElementById('mc_players').innerText = `${data.players.online}/${data.players.max}`;
                        document.getElementById('mc_ver').innerText = (data.version.name_clean || data.version.name).substring(0, 15);
                        iconImg.src = data.icon || `https://eu.mc-api.net/v3/server/favicon/${val}`;
                        iconImg.classList.remove('hidden');
                    } else { onlineEl.innerText = "OFFLINE"; onlineEl.style.color = "#ef4444"; }
                } catch(e) { onlineEl.innerText = "ERROR"; }
            } else {
                // --- 玩家模式 (含历史名称) ---
                sDisplay.classList.add('hidden'); pDisplay.classList.remove('hidden');
                document.getElementById('player_3d').src = `https://mc-heads.net/body/${val}/right`;
                iconImg.src = `https://mc-heads.net/avatar/${val}`;
                iconImg.classList.remove('hidden');
                
                const historyList = document.getElementById('history_list');
                const uuidEl = document.getElementById('player_uuid');
                historyList.innerHTML = '<p class="text-[10px] text-gray-400 animate-pulse">Fetching history...</p>';
                uuidEl.innerText = "Loading UUID...";

                try {
                    // 使用 playerdb.co 接口获取详细信息
                    const response = await fetch(`https://playerdb.co/api/player/minecraft/${val}`);
                    const json = await response.json();
                    
                    if(json.success) {
                        const player = json.data.player;
                        uuidEl.innerText = player.id;
                        
                        // 渲染更名记录
                        historyList.innerHTML = '';
                        // playerdb 的更名记录通常在 meta 或需要额外请求，这里我们用其返回的基础信息
                        // 如果需要更详细的更名日期，通常 Mojang API 需要 UUID
                        const historyRes = await fetch(`https://api.ashcon.app/mojang/v2/user/${val}`);
                        const historyData = await historyRes.json();
                        
                        if(historyData.username_history) {
                            historyData.username_history.reverse().forEach(entry => {
                                const date = entry.changed_at ? new Date(entry.changed_at).toLocaleDateString() : "Original";
                                historyList.innerHTML += `
                                    <div class="flex justify-between items-center bg-black/5 p-3 rounded-xl">
                                        <span class="text-gray-800 font-bold text-xs">${entry.username}</span>
                                        <span class="text-[9px] text-gray-400">${date}</span>
                                    </div>`;
                            });
                        }
                    } else {
                        uuidEl.innerText = "Player not found.";
                        historyList.innerHTML = "No history found.";
                    }
                } catch(e) { 
                    uuidEl.innerText = "API Error";
                    historyList.innerHTML = "Unable to fetch data.";
                }
            }
        }

        function changeWallpaper() {
            const bgLayer = document.getElementById('bg-layer'), bgBtn = document.getElementById('bg-btn');
            const imgUrl = `https://wp.upx8.com/api.php?_t=${new Date().getTime()}`;
            const tempImg = new Image(); tempImg.src = imgUrl;
            tempImg.onload = () => {
                bgLayer.style.opacity = 0;
                setTimeout(() => { bgLayer.style.backgroundImage = `url('${imgUrl}')`; bgLayer.style.opacity = 1; }, 350);
            };
        }
        changeWallpaper();

        function fetchHitokoto() {
            const t = document.getElementById('hitokoto_text'), f = document.getElementById('hitokoto_from');
            t.style.opacity = 0; f.style.opacity = 0;
            fetch('https://v1.hitokoto.cn').then(res => res.json()).then(d => {
                setTimeout(() => { t.innerText = d.hitokoto; f.innerText = `—— 「${d.from}」`; t.style.opacity = 1; f.style.opacity = 0.9; }, 250);
            });
        }
        fetchHitokoto();

        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let snowActive = true;
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        let pts = Array.from({length:40}, () => ({x:Math.random(), y:Math.random(), s:Math.random()*1.5+0.5}));
        function anim() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            if(snowActive) {
                ctx.fillStyle = "rgba(255,255,255,0.4)";
                pts.forEach(p => { p.y += 0.0007; if(p.y>1) p.y=0; ctx.beginPath(); ctx.arc(p.x*canvas.width, p.y*canvas.height, p.s, 0, Math.PI*2); ctx.fill(); });
            }
            requestAnimationFrame(anim);
        }
        anim();
        function toggleSnow() { snowActive = !snowActive; }
    </script>
</body>
</html>
