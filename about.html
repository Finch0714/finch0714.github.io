<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>欢迎</title>
    
    <link rel="icon" type="image/png" href="Favicon.png">
    <link rel="preload" as="image" href="https://picui.ogmua.cn/s1/2026/03/27/69c69b7519753.webp">
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="dns-prefetch" href="https://visage.surgeplay.com">

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.loli.net/css2?family=Inter:wght@400;600;700;900&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --font-main: 'Inter', sans-serif; --font-serif: 'Noto Serif SC', serif; }
        
        body { 
            font-family: var(--font-main); 
            margin: 0; background-color: #111; overflow-x: hidden; 
            display: flex; flex-direction: column; align-items: center;
            padding: 7rem 1.5rem 3rem 1.5rem; 
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* 优化后的背景层：使用 Transform 实现物理零延迟 */
        #bg-layer { 
            position: fixed; top: 0; left: 0; 
            width: 120vw; height: 100vh; /* 宽度略大于屏幕，提供滚动空间 */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
            transition: opacity 1s ease-out; /* 仅保留透明度过渡 */
            will-change: transform;
            pointer-events: none;
            transform: translate3d(0, 0, 0);
        }
        
        #bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.15); z-index: -1; }
        
        .glass { 
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 顶部功能按钮：强制置顶且防遮挡 */
        .fixed-controls {
            position: fixed; top: 1.5rem; left: 1.5rem; 
            display: flex; gap: 1rem; 
            z-index: 99999 !important; 
            transform: translateZ(999px); /* 强制提升至最高合成层 */
            pointer-events: auto;
        }

        .ctrl-ball {
            width: 2.5rem; height: 2.5rem; display: flex; align-items: center; justify-content: center;
            cursor: pointer; border-radius: 0.75rem; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 1.2rem;
        }
        .ctrl-ball:active { transform: scale(0.85); }

        .card-container { z-index: 10; position: relative; width: 100%; max-width: 64rem; margin: -1.25rem 0; }
        .main-card { margin: 1.25rem 0; }
        .flex-row-stack { display: flex; flex-wrap: wrap; justify-content: center; width: 100%; margin: -1rem; }
        .inner-card { margin: 1rem; }
        .expand-container { transition: max-height 0.5s ease-in-out; max-height: 85px; overflow: hidden; }
        .expand-container.expanded { max-height: 1200px; }
        .hitokoto-card { font-family: var(--font-serif); writing-mode: vertical-rl; text-orientation: mixed; }
        @media (max-width: 1024px) { .hitokoto-card { writing-mode: horizontal-tb; } }
        
        #contact-modal { display: none; position: fixed; inset: 0; z-index: 100000; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        #contact-modal.active { display: flex; animation: modalIn 0.3s forwards; align-items: center; justify-content: center; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>

<body>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>

    <div class="fixed-controls">
        <div class="ctrl-ball glass" onclick="toggleSnow()">❄️</div>
        <div class="ctrl-ball glass" onclick="changeWallpaper()">🖼️</div>
    </div>

    <canvas id="snow-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5;"></canvas>

    <div class="card-container">
        <div class="flex-row-stack main-card">
            <div class="glass lg:w-32 w-full p-8 lg:py-12 rounded-3xl shadow-xl relative flex items-center justify-center inner-card">
                <div class="hitokoto-card text-gray-800 font-bold">
                    <span id="hitokoto_text" class="text-base leading-loose tracking-widest opacity-0 transition-opacity duration-500">加载中...</span>
                    <span id="hitokoto_from" class="text-xs text-gray-700 mt-6 font-black opacity-0 block text-right"></span>
                </div>
                <button onclick="fetchHitokoto()" class="absolute bottom-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-white bg-opacity-20 hover:bg-opacity-40 transition-colors">🔄</button>
            </div>
            <div id="profile-card" class="glass max-w-xl w-full rounded-3xl shadow-2xl overflow-hidden inner-card">
                <div class="p-10 text-center border-b border-black border-opacity-5">
                    <div class="w-20 h-20 rounded-full mx-auto mb-6 shadow-xl overflow-hidden border-4 border-white bg-gray-100">
                        <img src="./avatar.jpg" alt="Avatar" class="w-full h-full object-cover">
                    </div>
                    <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Finch0714</h1>
                    <p class="text-gray-600 mt-2 italic text-sm font-light">restless, resetless.</p>
                </div>
                <div class="p-10 text-center">
                    <p class="text-gray-800 leading-relaxed mb-10 text-sm font-semibold">你好！欢迎来到我的主页。我是一个热衷于终身学习和影视、游戏的探索者。</p>
                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <a href="https://space.bilibili.com/2091924618" target="_blank" class="px-10 py-3 bg-pink-500 text-white rounded-2xl font-bold text-sm shadow-lg active:scale-95 transition-all">Bilibili</a>
                        <button onclick="openModal()" class="px-10 py-3 bg-white bg-opacity-40 text-gray-800 border border-white rounded-2xl font-bold text-sm shadow-md active:scale-95 transition-all">获取联系</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="feature-list" class="w-full flex flex-col items-center"></div>
    </div>

    <footer class="w-full flex justify-center py-10 z-10">
        <div class="flex items-center gap-4 opacity-60 hover:opacity-100 transition-opacity cursor-default bg-white bg-opacity-10 px-6 py-2 rounded-full border border-white border-opacity-10">
            <div class="flex items-center gap-2">
                <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest">浏览数</span>
                <span id="busuanzi_value_site_pv" class="text-xs font-mono text-gray-800 font-black">...</span>
            </div>
            <span class="text-gray-500 opacity-30">|</span>
            <div class="flex items-center gap-2">
                <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest">访客数</span>
                <span id="busuanzi_value_site_uv" class="text-xs font-mono text-gray-800 font-black">...</span>
            </div>
        </div>
    </footer>

    <div id="contact-modal" onclick="if(event.target==this) closeModal()">
        <div class="glass max-w-sm w-full p-10 rounded-3xl shadow-2xl relative text-center" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 p-2 hover:text-gray-800 transition-colors">✕</button>
            <h3 class="text-xs font-black text-gray-800 mb-8 uppercase tracking-widest">Contact</h3>
            <div class="space-y-4">
                <div class="p-5 bg-white/30 rounded-2xl flex items-center justify-between shadow-inner"><span class="text-[10px] font-bold text-gray-500">QQ</span><span class="text-sm font-mono text-gray-900 font-black select-all">861288676</span></div>
                <div class="p-5 bg-white/30 rounded-2xl flex items-center justify-between shadow-inner"><span class="text-[10px] font-bold text-gray-500">EMAIL</span><span class="text-sm font-mono text-gray-900 font-black select-all">finch0714@qq.com</span></div>
                <div class="p-5 bg-white/30 rounded-2xl flex items-center justify-between shadow-inner"><span class="text-[10px] font-bold text-gray-500">STEAM</span><span class="text-sm font-mono text-gray-900 font-black select-all">Latetelly</span></div>
            </div>
            <button onclick="closeModal()" class="w-full mt-8 py-4 bg-gray-800 text-white rounded-2xl text-[10px] font-black uppercase tracking-widest">Close</button>
        </div>
    </div>

    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    <script>
        async function renderFeatures() {
            try {
                const response = await fetch('./features.json');
                const features = await response.json();
                const list = document.getElementById('feature-list');
                list.innerHTML = features.map(item => {
                    if(item.id === 'mc_query') {
                        return `<div id="mc_container" class="glass max-w-xl lg:max-w-4xl w-full p-6 rounded-3xl shadow-xl flex flex-col expand-container main-card">...</div>`; // 这里保持你原来的MC渲染代码
                    } else {
                        const isDark = item.theme === 'dark';
                        const btnStyle = isDark ? "bg-gray-800 text-white shadow-lg" : "bg-white bg-opacity-20 border border-white border-opacity-40 text-gray-800 shadow-md";
                        return `<div class="glass max-w-xl lg:max-w-4xl w-full p-8 rounded-3xl shadow-xl flex flex-col main-card items-center">
                            <div class="w-full flex justify-start mb-6"><h2 class="text-xs font-black text-gray-800 tracking-widest uppercase flex items-center gap-2"><span class="w-2 h-2 ${item.color} rounded-full"></span>${item.title}</h2></div>
                            <a href="${item.url}" class="w-full max-w-xs ${btnStyle} py-4 rounded-2xl text-xs font-bold tracking-widest active:scale-95 transition-all text-center">${item.btnText}</a>
                        </div>`;
                    }
                }).join('');
            } catch (err) {}
        }
        renderFeatures();

        const bgLayer = document.getElementById('bg-layer');
        const myWallpapers = [
            "https://picui.ogmua.cn/s1/2026/03/27/69c69b7519753.webp",
            "https://picui.ogmua.cn/s1/2026/03/31/69cbe0b27f7c7.webp",
            "https://picui.ogmua.cn/s1/2026/03/31/69cbe0f9533b3.webp",
            "https://picui.ogmua.cn/s1/2026/03/31/69cbe0b2b8305.webp",
            "https://picui.ogmua.cn/s1/2026/03/31/69cbe0f903373.webp"
        ];
        
        let currentIdx = Math.floor(Math.random() * myWallpapers.length);
        bgLayer.style.backgroundImage = `url('${myWallpapers[currentIdx]}')`;

        // --- 零延迟、不掉帧背景滚动核心逻辑 ---
        function updateBackground() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            
            if (scrollHeight <= 0) return;

            let scrollPercent = scrollTop / scrollHeight;
            scrollPercent = Math.max(0, Math.min(1, scrollPercent));

            // 计算背景向左位移的距离 (背景宽 120vw - 屏幕宽 100vw = 20vw)
            const moveRange = bgLayer.offsetWidth - window.innerWidth;
            const moveX = -(scrollPercent * moveRange);

            // 直接通过 transform 修改位置，跳过所有过渡和重排
            bgLayer.style.transform = `translate3d(${moveX}px, 0, 0)`;
        }

        // 使用 passive 监听器提升滚动性能
        window.addEventListener('scroll', updateBackground, { passive: true });
        window.addEventListener('resize', updateBackground);
        updateBackground();

        function changeWallpaper() {
            let nextUrl = myWallpapers[++currentIdx % myWallpapers.length];
            const img = new Image(); img.src = nextUrl;
            img.onload = () => { 
                bgLayer.style.opacity = 0; 
                setTimeout(() => { 
                    bgLayer.style.backgroundImage = `url('${nextUrl}')`; 
                    bgLayer.style.opacity = 1; 
                }, 400); 
            };
        }

        // 其它业务逻辑 (fetchHitokoto, Modal, Snow) 保持不变即可
        function fetchHitokoto() { const t = document.getElementById('hitokoto_text'), f = document.getElementById('hitokoto_from'); t.style.opacity = 0; f.style.opacity = 0; fetch('https://v1.hitokoto.cn').then(r => r.json()).then(d => { t.innerText = d.hitokoto; f.innerText = `—— 「${d.from}」`; t.style.opacity = 1; f.style.opacity = 0.9; }); } 
        fetchHitokoto();
        function openModal() { document.getElementById('contact-modal').classList.add('active'); }
        function closeModal() { document.getElementById('contact-modal').classList.remove('active'); }
        const canvas = document.getElementById('snow-canvas'), ctx = canvas.getContext('2d');
        let snowActive = true;
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; updateBackground(); }
        window.addEventListener('resize', resize); resize();
        let pts = Array.from({length:40}, () => ({x:Math.random(), y:Math.random(), s:Math.random()*1.5+0.5}));
        function anim() { ctx.clearRect(0,0,canvas.width,canvas.height); if(snowActive) { ctx.fillStyle = "rgba(255,255,255,0.45)"; pts.forEach(p => { p.y += 0.0008; if(p.y>1) p.y=0; ctx.beginPath(); ctx.arc(p.x*canvas.width, p.y*canvas.height, p.s, 0, Math.PI*2); ctx.fill(); }); } requestAnimationFrame(anim); } anim();
        function toggleSnow() { snowActive = !snowActive; }
    </script>
</body>
</html>
