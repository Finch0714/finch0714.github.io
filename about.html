<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finch0714 | 个人主页</title>
    <link rel="icon" type="image/png" href="Favicon.png">
    
    <link rel="preload" as="image" href="./defbg.webp">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.loli.net/css2?family=Inter:wght@400;700;900&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root { --font-main: 'Inter', sans-serif; }
        body { 
            font-family: var(--font-main); margin: 0; background-color: #111; 
            display: flex; justify-content: center; padding: 6rem 1rem 2rem;
            -webkit-font-smoothing: antialiased;
        }
        #bg-layer { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: url('./defbg.webp') center/cover no-repeat; z-index: -2;
        }
        #bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: -1; }
        .glass { 
            background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.3);
        }
        /* 视频弹窗 */
        #video-modal { 
            display: none; position: fixed; inset: 0; z-index: 300; 
            background: rgba(0,0,0,0.9); align-items: center; justify-content: center; 
            backdrop-filter: blur(10px);
        }
        #video-modal.active { display: flex; }
        .iframe-container { width: 90%; max-width: 800px; aspect-ratio: 16/9; border-radius: 1rem; overflow: hidden; }
    </style>
</head>
<body>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>

    <div class="flex flex-col items-center gap-8 w-full max-w-4xl z-10">
        <div class="glass w-full rounded-[2.5rem] p-10 text-center shadow-2xl">
            <div class="w-24 h-24 rounded-full mx-auto mb-6 border-4 border-white shadow-lg overflow-hidden">
                <img src="./avatar.jpg" class="w-full h-full object-cover">
            </div>
            <h1 class="text-3xl font-black text-gray-900">Finch0714</h1>
            <p class="text-gray-700 italic mt-2">restless, resetless.</p>
            
            <div class="flex flex-wrap justify-center gap-4 mt-8">
                <a href="https://space.bilibili.com/2066563707" target="_blank" class="px-8 py-3 bg-pink-500 text-white rounded-2xl font-bold text-sm shadow-lg">Bilibili</a>
                <button onclick="openVideo()" class="px-8 py-3 bg-gray-900 text-white rounded-2xl font-bold text-sm shadow-lg">私藏网站</button>
                <a href="luckydraw.html" class="px-8 py-3 bg-yellow-400 text-gray-900 rounded-2xl font-black text-sm shadow-lg">幸运抽奖</a>
            </div>
        </div>
    </div>

    <div id="video-modal" onclick="closeVideo()">
        <div class="iframe-container shadow-2xl border-4 border-white/20">
            <iframe id="bili-player" src="//player.bilibili.com/player.html?bvid=BV1GJ411x7h7&page=1&high_quality=1&danmaku=0" 
                    scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true" class="w-full h-full"></iframe>
        </div>
    </div>

    <script>
        function openVideo() { document.getElementById('video-modal').classList.add('active'); }
        function closeVideo() { 
            document.getElementById('video-modal').classList.remove('active');
            // 停止播放：重置 iframe src
            const iframe = document.getElementById('bili-player');
            const src = iframe.src; iframe.src = src;
        }
    </script>
</body>
</html>
