<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 | 欢迎</title>
    
    <link rel="icon" type="image/png" href="Favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            perspective: 1500px; 
            overflow: hidden; 
            margin: 0; width: 100vw; height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative; z-index: 10;
            transform-style: preserve-3d;
            will-change: transform;
        }
        .gradient-bg {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .parallax-avatar { transform: translateZ(60px); filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15)); will-change: transform; }
        .parallax-content { transform: translateZ(30px); will-change: transform; }
        #snow-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; will-change: transform; }
        #snow-btn {
            position: fixed; top: 20px; left: 20px; width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 100; transition: all 0.3s;
        }
        .hitokoto-card {
            font-family: 'Noto Serif SC', serif;
            writing-mode: vertical-rl; 
            text-orientation: mixed;
        }
        @media (max-width: 1024px) {
            .hitokoto-card { writing-mode: horizontal-tb; }
        }
        #hitokoto_text { opacity: 0; transition: opacity 0.8s ease; }
    </style>
</head>

<body class="gradient-bg min-h-screen flex items-center justify-center p-6">

    <div id="snow-btn" onclick="toggleSnow()" title="切换飘雪样式">❄️</div>
    <canvas id="snow-canvas"></canvas>

    <div id="main-container" class="flex flex-col-reverse lg:flex-row items-center justify-center gap-8 w-full max-w-6xl z-10 transition-transform duration-300 ease-out">
        
        <div onclick="fetchHitokoto()" class="glass lg:w-24 w-full lg:min-h-[400px] p-6 lg:py-10 rounded-[2.5rem] shadow-xl cursor-pointer hover:bg-white/40 transition-all group relative flex items-center justify-center">
            <div class="hitokoto-card text-gray-700">
                <span id="hitokoto_text" class="text-lg leading-loose tracking-[0.2em]">正在采撷词句...</span>
                <span id="hitokoto_from" class="text-[10px] text-gray-400 mt-4 opacity-0 lg:mt-8 block"></span>
            </div>
            <div class="absolute bottom-4 lg:bottom-auto lg:left-2 text-[8px] text-gray-400 vertical-lr opacity-30 group-hover:opacity-100 transition-opacity uppercase">Refresh</div>
        </div>

        <div class="glass max-w-xl w-full rounded-[2.5rem] shadow-2xl overflow-hidden transition-all duration-300 ease-out">
            <div class="p-10 text-center border-b border-white/20">
                <div class="parallax-avatar w-20 h-20 rounded-full mx-auto mb-6 shadow-xl overflow-hidden border-4 border-white/50 bg-gray-200">
                    <img src="avatar.jpg" alt="头像" class="w-full h-full object-cover">
                </div>
                <div class="parallax-content">
                    <h1 class="text-3xl font-600 text-gray-800">Finch0714</h1>
                    <p class="text-gray-500 mt-2 italic text-sm">restless, resetless.</p>
                </div>
            </div>

            <div class="p-10">
                <p class="text-gray-600 leading-relaxed text-center mb-10 parallax-content">
                    你好！欢迎来到我的主页。我是一个热衷于终身学习和影视、游戏的探索者。 这里记录了我的技术足迹与创意构思。
                </p>
                <div class="flex flex-col sm:flex-row gap-4 justify-center parallax-content">
                    <a href="https://space.bilibili.com/2066563707" target="_blank" class="px-8 py-3 bg-[#fb7299] text-white rounded-2xl hover:bg-[#e06489] transition-all font-medium text-center shadow-sm">Bilibili</a>
                    <button onclick="openModal()" class="px-8 py-3 bg-white/60 text-gray-800 border border-white rounded-2xl hover:bg-white/90 transition-all font-medium shadow-sm">获取联系</button>
                </div>
            </div>

            <div class="bg-white/20 py-6 text-center">
                <p class="text-xs text-gray-400 uppercase tracking-widest">© 2026 Powered by Google Gemini and Latetelly♥</p>
                <div class="mt-2 text-[10px] text-gray-500 font-medium">
                    <span id="busuanzi_container_site_pv" style="display:none">浏览数: <span id="busuanzi_value_site_pv" class="text-indigo-500">--</span></span>
                    <span class="mx-1 text-gray-300">|</span>
                    <span id="busuanzi_container_site_uv" style="display:none">访客数: <span id="busuanzi_value_site_uv" class="text-purple-500">--</span></span>
                </div>
                <a href="index.html" class="inline-block mt-3 text-[10px] text-gray-500 hover:text-red-500 transition-colors duration-300">[ TERMINAL_LOGOUT // GO BACK ]</a>
            </div>
        </div>
    </div>

    <div id="contactModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
        <div onclick="closeModal()" class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
        <div class="glass w-full max-w-md rounded-[2.5rem] shadow-2xl relative z-10 p-8">
            <h3 class="text-2xl font-bold text-gray-800 mb-6 tracking-tight">联系方式</h3>
            <div class="space-y-4 text-left">
                <div class="p-4 bg-white/40 rounded-2xl">
                    <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Email</p>
                    <p class="text-gray-700 font-medium">finch0714@qq.com</p>
                </div>
                <div class="p-4 bg-white/40 rounded-2xl">
                    <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">QQ</p>
                    <p class="text-gray-700 font-medium">861288676</p>
                </div>
            </div>
            <button onclick="closeModal()" class="w-full mt-8 py-4 bg-indigo-500 text-white rounded-2xl font-bold shadow-lg">确认</button>
        </div>
    </div>

    <script>
        // 1. 挽留逻辑 (挽回你提到的功能)
        const originalTitle = document.title;
        document.addEventListener('visibilitychange', () => {
            document.title = document.hidden ? 'Σ(っ °Д °;)っ 别走嘛~' : 'ヾ(≧▽≦*)o 欢迎回来！';
            if(!document.hidden) setTimeout(() => document.title = originalTitle, 2000);
        });

        // 2. 一言获取
        function fetchHitokoto() {
            const textEl = document.getElementById('hitokoto_text');
            const fromEl = document.getElementById('hitokoto_from');
            textEl.style.opacity = 0; fromEl.style.opacity = 0;
            fetch('https://v1.hitokoto.cn').then(res => res.json()).then(data => {
                setTimeout(() => {
                    textEl.innerText = data.hitokoto;
                    fromEl.innerText = `—— 「${data.from}」`;
                    textEl.style.opacity = 1; fromEl.style.opacity = 1;
                }, 300);
            }).catch(() => { textEl.innerText = "生活明朗，万物可爱。"; textEl.style.opacity = 1; });
        }
        fetchHitokoto();

        // 3. 视差动画
        document.addEventListener('mousemove', (e) => {
            const xPercent = (e.clientX / window.innerWidth) - 0.5;
            const yPercent = (e.clientY / window.innerHeight) - 0.5;
            document.getElementById('main-container').style.transform = `translateX(${xPercent * 25}px) translateY(${yPercent * 25}px) rotateX(${yPercent * -10}deg) rotateY(${xPercent * 10}deg)`;
            document.getElementById('snow-canvas').style.transform = `translateX(${xPercent * -20}px) translateY(${yPercent * -20}px)`;
        });

        // 4. 弹窗控制
        function openModal() { document.getElementById('contactModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('contactModal').classList.add('hidden'); }

        // 5. 雪花逻辑 (完整复原多种模式)
        const snowCanvas = document.getElementById('snow-canvas');
        const ctx = snowCanvas.getContext('2d');
        let particles = [], animationFrame, snowMode = 1;
        function resize() { snowCanvas.width = window.innerWidth; snowCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * snowCanvas.width;
                this.y = Math.random() * snowCanvas.height - snowCanvas.height;
                this.size = Math.random() * 3 + 1;
                this.speed = Math.random() * 1 + 0.5;
                this.velX = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.char = Math.floor(Math.random() * 2);
            }
            update() { this.y += this.speed; this.x += this.velX; if (this.y > snowCanvas.height) this.reset(); }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                if (snowMode === 1) { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
                else if (snowMode === 2) { ctx.fillRect(this.x, this.y, this.size * 1.5, this.size * 1.5); }
                else if (snowMode === 3) { ctx.font = `${this.size + 10}px monospace`; ctx.fillText(this.char, this.x, this.y); }
            }
        }
        function initSnow() { particles = []; for (let i = 0; i < 80; i++) particles.push(new Particle()); }
        function animate() {
            ctx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
            if (snowMode !== 0) { particles.forEach(p => { p.update(); p.draw(); }); animationFrame = requestAnimationFrame(animate); }
        }
        function toggleSnow() {
            snowMode = (snowMode + 1) % 4;
            document.getElementById('snow-btn').innerText = ['🚫', '❄️', '🟦', '🔢'][snowMode];
            if (snowMode === 0) { ctx.clearRect(0, 0, snowCanvas.width, snowCanvas.height); cancelAnimationFrame(animationFrame); }
            else { cancelAnimationFrame(animationFrame); animate(); }
        }
        initSnow(); animate();
    </script>
</body>
</html>
