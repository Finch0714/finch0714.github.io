<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 | 欢迎</title>
    
    <link rel="icon" type="image/png" href="Favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.loli.net/css2?family=Inter:wght@300;400;600&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    
    <style>
        :root {
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-serif: 'Noto Serif SC', serif;
        }

        body { 
            font-family: var(--font-main); 
            perspective: 1500px; 
            overflow: hidden; 
            margin: 0; width: 100vw; height: 100vh;
            background-color: #111;
        }

        /* 背景层 */
        #bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -2; opacity: 0;
        }
        #bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            z-index: -1;
        }

        .glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative; z-index: 10;
        }

        .ctrl-btn {
            width: 42px; height: 42px;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 100; transition: all 0.3s;
        }

        .hitokoto-card { font-family: var(--font-serif); writing-mode: vertical-rl; text-orientation: mixed; }
        @media (max-width: 1024px) { .hitokoto-card { writing-mode: horizontal-tb; } }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>

    <div class="fixed top-6 left-6 flex gap-3 z-[100]">
        <div id="snow-btn" class="ctrl-btn" onclick="toggleSnow()">❄️</div>
        <div id="bg-btn" class="ctrl-btn" onclick="changeWallpaper()" title="随机切换壁纸">🖼️</div>
    </div>

    <canvas id="snow-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5;"></canvas>

    <div id="main-container" class="flex flex-col-reverse lg:flex-row items-stretch justify-center gap-6 w-full max-w-7xl z-10 transition-transform duration-500">
        
        <div onclick="fetchHitokoto()" class="glass lg:w-20 w-full p-6 lg:py-10 rounded-[2.5rem] shadow-xl cursor-pointer hover:bg-white/50 transition-all flex items-center justify-center">
            <div class="hitokoto-card text-gray-800">
                <span id="hitokoto_text" class="text-base leading-loose tracking-[0.2em] opacity-0 transition-opacity duration-700">正在寻找灵感...</span>
                <span id="hitokoto_from" class="text-[10px] text-gray-400 mt-6 opacity-0 block text-right"></span>
            </div>
        </div>

        <div class="glass max-w-xl w-full rounded-[2.5rem] shadow-2xl overflow-hidden">
            <div class="p-10 text-center border-b border-black/5">
                <div class="w-20 h-20 rounded-full mx-auto mb-6 shadow-2xl overflow-hidden border-4 border-white bg-gray-100">
                    <img src="avatar.jpg" alt="头像" class="w-full h-full object-cover">
                </div>
                <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Finch0714</h1>
                <p class="text-gray-400 mt-2 italic text-sm font-light">restless, resetless.</p>
            </div>
            <div class="p-10 text-center">
                <p class="text-gray-600 leading-relaxed mb-10 text-sm">
                    你好！欢迎来到我的主页。我是一个热衷于终身学习和影视、游戏的探索者。 这里记录了我的技术足迹与创意构思。
                </p>
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <a href="https://space.bilibili.com/2066563707" target="_blank" class="px-10 py-3 bg-[#fb7299] text-white rounded-2xl hover:brightness-110 transition-all font-semibold text-sm">Bilibili</a>
                    <button onclick="openModal()" class="px-10 py-3 bg-white/40 text-gray-800 border border-white rounded-2xl hover:bg-white/60 transition-all font-semibold text-sm">获取联系</button>
                </div>
            </div>
            <div class="bg-black/5 py-5 text-center">
                <p class="text-[10px] text-gray-400 uppercase tracking-widest font-medium">© 2026 Powered by Gemini</p>
            </div>
        </div>

        <div class="glass lg:w-64 w-full p-8 rounded-[2.5rem] shadow-xl flex flex-col">
            <h2 class="text-xs font-bold text-gray-400 mb-6 tracking-widest flex items-center gap-2">
                <span class="w-1.5 h-1.5 bg-green-500 rounded-full shadow-[0_0_8px_rgba(34,197,94,0.6)]"></span> SERVER_PROBE
            </h2>
            <div class="space-y-4">
                <input id="mc_ip" type="text" placeholder="mc.hypixel.net" class="w-full bg-black/5 border border-white/40 rounded-xl px-4 py-3 text-xs focus:outline-none transition-all text-gray-700 font-medium">
                <button onclick="checkMCServer()" class="w-full bg-gray-800 text-white py-3 rounded-xl text-[10px] font-bold tracking-tighter hover:bg-black transition-all shadow-lg">RUN_DIAGNOSTICS</button>
            </div>
            
            <div id="mc_result" class="mt-8 space-y-4 text-[11px] text-gray-500 hidden border-t border-black/5 pt-6">
                <div class="flex justify-between"><span>STATE:</span><span id="mc_online" class="font-bold"></span></div>
                <div class="flex justify-between"><span>POPULATION:</span><span id="mc_players"></span></div>
                <div class="flex justify-between"><span>ENGINE:</span><span id="mc_ver"></span></div>
            </div>
        </div>
    </div>

    <script>
        // 1. 🚀 强力多源壁纸切换
        async function changeWallpaper() {
            const bgLayer = document.getElementById('bg-layer');
            const bgBtn = document.getElementById('bg-btn');
            bgBtn.innerText = "⏳";
            
            // 💡 备选源列表：Bing 每日一图、360 随机图、以及一个稳定的国内 CDN 源
            const sources = [
                `https://api.dujin.org/bing/1920.php?rand=${Math.random()}`, // 必应
                `https://api.paugram.com/wallpaper/?source=sina&${Math.random()}`, // 随机风景
                `https://api.btstu.cn/sjbz/api.php?method=mobile&type=pc&${Math.random()}` // 随机
            ];

            const selectedUrl = sources[Math.floor(Math.random() * sources.length)];
            const tempImg = new Image();
            tempImg.src = selectedUrl;
            
            tempImg.onload = () => {
                bgLayer.style.opacity = 0;
                setTimeout(() => {
                    bgLayer.style.backgroundImage = `url('${selectedUrl}')`;
                    bgLayer.style.opacity = 1;
                    bgBtn.innerText = "🖼️";
                }, 400);
            };

            tempImg.onerror = () => {
                // 如果失败，递归尝试一次
                bgBtn.innerText = "❌";
                setTimeout(changeWallpaper, 1000);
            };
        }
        changeWallpaper();

        // 2. MC 服务器查询 (api.mcstatus.io 目前全球可用且非常稳)
        async function checkMCServer() {
            const ip = document.getElementById('mc_ip').value;
            const resDiv = document.getElementById('mc_result');
            if(!ip) return;
            resDiv.classList.remove('hidden');
            const onlineEl = document.getElementById('mc_online');
            onlineEl.innerText = "CONNECTING...";
            
            try {
                const response = await fetch(`https://api.mcstatus.io/v2/status/java/${ip}`);
                const data = await response.json();
                if(data.online) {
                    onlineEl.innerText = "ONLINE";
                    onlineEl.style.color = "#10b981";
                    document.getElementById('mc_players').innerText = `${data.players.online} / ${data.players.max}`;
                    document.getElementById('mc_ver').innerText = (data.version.name_clean || data.version.name).substring(0, 15);
                } else {
                    onlineEl.innerText = "OFFLINE";
                    onlineEl.style.color = "#ef4444";
                }
            } catch (e) { onlineEl.innerText = "TIMEOUT"; }
        }

        // 3. 一言、雪花、标题挽留逻辑 (保持不变，确保功能完整)
        function fetchHitokoto() {
            const textEl = document.getElementById('hitokoto_text');
            const fromEl = document.getElementById('hitokoto_from');
            textEl.style.opacity = 0; fromEl.style.opacity = 0;
            fetch('https://v1.hitokoto.cn').then(res => res.json()).then(data => {
                setTimeout(() => {
                    textEl.innerText = data.hitokoto;
                    fromEl.innerText = `—— 「${data.from}」`;
                    textEl.style.opacity = 1; fromEl.style.opacity = 1;
                }, 300);
            });
        }
        fetchHitokoto();

        // 雪花控制、视差动画、弹窗代码... (保持与上一版一致)
        const originalTitle = document.title;
        document.addEventListener('visibilitychange', () => {
            document.title = document.hidden ? 'Σ(っ °Д °;)っ 别走嘛~' : 'ヾ(≧▽≦*)o 欢迎回来！';
            if(!document.hidden) setTimeout(() => document.title = originalTitle, 2000);
        });

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            document.getElementById('main-container').style.transform = `translateX(${x * 20}px) translateY(${y * 20}px) rotateX(${y * -5}deg) rotateY(${x * 5}deg)`;
        });

        const snowCanvas = document.getElementById('snow-canvas');
        const ctx = snowCanvas.getContext('2d');
        let snowMode = 1;
        function resize() { snowCanvas.width = window.innerWidth; snowCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        let pts = Array.from({length:40}, () => ({x:Math.random(), y:Math.random(), s:Math.random()*2+1}));
        function anim(){
            ctx.clearRect(0,0,snowCanvas.width,snowCanvas.height);
            if(snowMode !== 0) {
                ctx.fillStyle = "rgba(255,255,255,0.4)";
                pts.forEach(p => { 
                    p.y += 0.001; if(p.y>1) p.y=0; 
                    ctx.beginPath(); ctx.arc(p.x*snowCanvas.width, p.y*snowCanvas.height, p.s, 0, 7); ctx.fill(); 
                });
            }
            requestAnimationFrame(anim);
        }
        anim();
        function toggleSnow() { snowMode = (snowMode + 1) % 4; document.getElementById('snow-btn').innerText = ['🚫', '❄️', '🟦', '🔢'][snowMode]; }
        function openModal() { document.getElementById('contactModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('contactModal').classList.add('hidden'); }
    </script>
</body>
</html>
