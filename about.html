    <style>
        :root {
            --font-main: 'Inter', -apple-system, sans-serif;
            --font-serif: 'Noto Serif SC', serif;
        }

        body { 
            font-family: var(--font-main); 
            margin: 0; width: 100%; min-height: 100vh;
            background-color: #111;
            overflow-x: hidden;
            display: flex; justify-content: center;
        }

        .gradient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientAnim 15s ease infinite;
            z-index: -3;
        }
        @keyframes gradientAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #bg-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-size: cover; background-position: center center;
            background-repeat: no-repeat;
            transition: opacity 1s ease-in-out;
            z-index: -2; opacity: 0;
            will-change: opacity;
        }
        
        #bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.22); 
            z-index: -1;
        }

        .glass {
            background: rgba(255, 255, 255, 0.36);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);

        .hitokoto-card { font-family: var(--font-serif); writing-mode: vertical-rl; text-orientation: mixed; }
        @media (max-width: 1024px) { .hitokoto-card { writing-mode: horizontal-tb; } }

        #mc_icon { transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: scale(0.8); opacity: 0; }
        #mc_icon.show { transform: scale(1); opacity: 1; }
    </style>
</head>

<body class="p-6 py-12 lg:py-16">

    <div class="gradient-bg"></div>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>

    <div class="fixed top-6 left-6 flex gap-3 z-[100]">
        <div id="snow-btn" class="w-10 h-10 glass rounded-xl flex items-center justify-center cursor-pointer shadow-xl hover:bg-white/60 transition-all" onclick="toggleSnow()">❄️</div>
        <div id="bg-btn" class="w-10 h-10 glass rounded-xl flex items-center justify-center cursor-pointer shadow-xl hover:bg-white/60 transition-all" onclick="changeWallpaper()">🖼️</div>
    </div>

    <canvas id="snow-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5;"></canvas>

    <div class="flex flex-col items-center gap-10 w-full max-w-7xl z-10">
        
        <div class="flex flex-col lg:flex-row items-center lg:items-stretch justify-center gap-8 w-full">
            
            <div class="glass max-w-xl w-full rounded-[3rem] shadow-2xl overflow-hidden order-2 lg:order-1">
                <div class="p-10 text-center border-b border-black/5">
                    <div class="w-20 h-20 rounded-full mx-auto mb-6 shadow-xl overflow-hidden border-4 border-white">
                        <img src="avatar.jpg" alt="头像" class="w-full h-full object-cover">
                    </div>
                    <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Finch0714</h1>
                    <p class="text-gray-500 mt-2 italic text-sm font-light">restless, resetless.</p>
                </div>
                <div class="p-10 text-center">
                    <p class="text-gray-600 leading-relaxed mb-10 text-sm">

                    </p>
                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <a href="https://space.bilibili.com/2066563707" target="_blank" class="px-10 py-3 bg-[#fb7299] text-white rounded-2xl font-semibold text-sm shadow-md hover:brightness-110 transition-all">Bilibili</a>
                        <button onclick="openModal()" class="px-10 py-3 bg-white/40 text-gray-800 border border-white rounded-2xl font-semibold text-sm shadow-md hover:bg-white/60 transition-all">获取联系</button>
                    </div>
                </div>
            </div>

            <div onclick="fetchHitokoto()" class="glass lg:w-24 w-full p-8 lg:py-12 rounded-[3rem] shadow-xl cursor-pointer hover:bg-white/50 transition-all flex items-center justify-center order-1 lg:order-2">
                <div class="hitokoto-card text-gray-800">
                    <span id="hitokoto_text" class="text-base leading-loose tracking-[0.2em] opacity-0 transition-opacity duration-700">正在寻找灵感...</span>
                    <span id="hitokoto_from" class="text-[10px] text-gray-700 mt-6 font-black opacity-0 block text-right"></span>
                </div>
            </div>
        </div>

        <div class="glass max-w-xl lg:max-w-4xl w-full p-10 rounded-[3rem] shadow-xl flex flex-col order-3">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-xs font-bold text-gray-500 tracking-widest flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_#10b981]"></span> MC服务器状态查询
                </h2>
                <img id="mc_icon" src="" alt="Server Icon" class="w-12 h-12 rounded-xl shadow-lg bg-black/10">
            </div>

            <div class="flex flex-col md:flex-row gap-4">
                <input id="mc_ip" type="text" placeholder="输入服务器 IP (eg: mc.hypixel.net)" class="flex-1 bg-black/5 border border-white/30 rounded-2xl px-6 py-4 text-sm focus:outline-none focus:ring-2 focus:ring-white/30 transition-all text-gray-700">
                <button onclick="checkMCServer()" class="bg-gray-800 text-white px-10 py-4 rounded-2xl text-[10px] font-bold tracking-widest hover:bg-black transition-all shadow-lg">RUN</button>
            </div>

            <div id="mc_result" class="mt-10 grid grid-cols-1 md:grid-cols-3 gap-6 hidden border-t border-black/5 pt-10 font-mono text-[11px] text-gray-500">
                <div class="p-5 bg-white/20 rounded-2xl shadow-inner text-center">
                    <p class="text-[9px] mb-2 opacity-60 font-bold uppercase">State</p>
                    <span id="mc_online" class="text-xs font-black"></span>
                </div>
                <div class="p-5 bg-white/20 rounded-2xl shadow-inner text-center">
                    <p class="text-[9px] mb-2 opacity-60 font-bold uppercase">Players</p>
                    <span id="mc_players" class="text-xs font-black text-gray-700"></span>
                </div>
                <div class="p-5 bg-white/20 rounded-2xl shadow-inner text-center">
                    <p class="text-[9px] mb-2 opacity-60 font-bold uppercase">Version</p>
                    <span id="mc_ver" class="text-xs font-black text-gray-700"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- ✅ 新增：联系弹窗 -->
    <div id="contactModal" class="fixed inset-0 z-[200] flex items-center justify-center p-4 hidden">
        <div onclick="closeModal()" class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
        <div class="glass w-full max-w-sm rounded-[2rem] p-8 text-center relative z-10 shadow-2xl">
            <h3 class="text-lg font-bold text-gray-800 mb-6">联系方式</h3>
            <div class="space-y-4 text-left">
                <div class="p-4 bg-white/40 rounded-xl border border-white/40">
                    <p class="text-xs text-gray-500">Email</p>
                    <p class="text-gray-800 font-medium">finch0714@qq.com</p>
                </div>
                <div class="p-4 bg-white/40 rounded-xl border border-white/40">
                    <p class="text-xs text-gray-500">QQ</p>
                    <p class="text-gray-800 font-medium">861288676</p>
                </div>
            </div>
            <button onclick="closeModal()" class="mt-6 w-full py-3 bg-gray-800 text-white rounded-xl">关闭</button>
        </div>
    </div>

    <script>
        function changeWallpaper() {
            const bgLayer = document.getElementById('bg-layer');
            const bgBtn = document.getElementById('bg-btn');
            bgBtn.innerText = "⏳";
            const timestamp = new Date().getTime();
            const imgUrl = `https://wp.upx8.com/api.php?_t=${timestamp}`;
            const tempImg = new Image();
            tempImg.src = imgUrl;
            tempImg.onload = () => {
                bgLayer.style.opacity = 0; 
                setTimeout(() => {
                    bgLayer.style.backgroundImage = `url('${imgUrl}')`;
                    bgLayer.style.opacity = 1; 
                    bgBtn.innerText = "更换背景";
                }, 350);
            };
        }
        changeWallpaper();

        function fetchHitokoto() {
            const textEl = document.getElementById('hitokoto_text');
            const fromEl = document.getElementById('hitokoto_from');
            textEl.style.opacity = 0; fromEl.style.opacity = 0;
            fetch('https://v1.hitokoto.cn').then(res => res.json()).then(data => {
                setTimeout(() => {
                    textEl.innerText = data.hitokoto;
                    fromEl.innerText = `—— 「${data.from}」`;
                    textEl.style.opacity = 1; 
                    fromEl.style.opacity = 0.9;
                }, 250);
            });
        }
        fetchHitokoto();

        async function checkMCServer() {
            const ip = document.getElementById('mc_ip').value;
            const resDiv = document.getElementById('mc_result');
            const iconImg = document.getElementById('mc_icon');
            if(!ip) return;

            resDiv.classList.remove('hidden');
            iconImg.classList.remove('show');
            const onlineEl = document.getElementById('mc_online');
            onlineEl.innerText = "CONNECTING...";

            try {
                const response = await fetch(`https://api.mcstatus.io/v2/status/java/${ip}`);
                const data = await response.json();
                
                if(data.online) {
                    onlineEl.innerText = "ONLINE"; onlineEl.style.color = "#10b981";
                    document.getElementById('mc_players').innerText = `${data.players.online} / ${data.players.max}`;
                    document.getElementById('mc_ver').innerText = (data.version.name_clean || data.version.name).substring(0, 15);
                    
                    if(data.icon) {
                        iconImg.src = data.icon;
                        iconImg.classList.add('show');
                    } else {
                        iconImg.src = "https://eu.mc-api.net/v3/server/favicon/" + ip; 
                        iconImg.classList.add('show');
                    }
                } else {
                    onlineEl.innerText = "OFFLINE"; onlineEl.style.color = "#ef4444";
                    iconImg.classList.remove('show');
                }
            } catch (e) { 
                onlineEl.innerText = "TIMEOUT";
                iconImg.classList.remove('show');
            }
        }

        const snowCanvas = document.getElementById('snow-canvas');
        const ctx = snowCanvas.getContext('2d');
        let snowActive = true;
        function resize() { snowCanvas.width = window.innerWidth; snowCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        let pts = Array.from({length:45}, () => ({x:Math.random(), y:Math.random(), s:Math.random()*1.5+0.5}));
        function anim(){
            ctx.clearRect(0,0,snowCanvas.width,snowCanvas.height);
            if(snowActive) {
                ctx.fillStyle = "rgba(255,255,255,0.4)";
                pts.forEach(p => { 
                    p.y += 0.0006; if(p.y>1) p.y=0; 
                    ctx.beginPath(); ctx.arc(p.x*snowCanvas.width, p.y*snowCanvas.height, p.s, 0, Math.PI*2); ctx.fill(); 
                });
            }
            requestAnimationFrame(anim);
        }
        anim();
        function toggleSnow() { snowActive = !snowActive; document.getElementById('snow-btn').innerText = snowActive ? "❄️" : "🚫"; }

        /* ✅ 新增函数 */
        function openModal() {
            document.getElementById('contactModal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('contactModal').classList.add('hidden');
        }
    </script>
</body>
</html>
