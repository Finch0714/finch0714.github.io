<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 | 欢迎</title>
    
    <link rel="icon" type="image/png" href="Favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            perspective: 1500px; 
            overflow: hidden; /* 防止位移导致滚动条出现 */
            margin: 0;
            width: 100vw;
            height: 100vh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            z-index: 10;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .gradient-bg {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .parallax-avatar {
            transform: translateZ(60px);
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15));
            will-change: transform;
        }
        .parallax-content {
            transform: translateZ(30px);
            will-change: transform;
        }

        #snow-canvas { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 5; 
            will-change: transform;
        }
        
        #snow-btn {
            position: fixed; top: 20px; left: 20px; width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 100; transition: all 0.3s;
        }

        /* 移动端提示样式 */
        #gyro-notice {
            position: fixed; bottom: 20px; font-size: 10px; color: rgba(255,255,255,0.5);
            pointer-events: none; z-index: 100;
        }
    </style>
</head>

<body class="gradient-bg min-h-screen flex flex-col items-center justify-center p-4" onclick="initGyro()">

    <div id="snow-btn" onclick="event.stopPropagation(); toggleSnow()" title="切换飘雪样式">❄️</div>
    <canvas id="snow-canvas"></canvas>

    <div class="glass max-w-xl w-full rounded-[2.5rem] shadow-2xl overflow-hidden transition-all duration-300 ease-out">
        <div class="p-10 text-center border-b border-white/20">
            <div class="parallax-avatar w-20 h-20 rounded-full mx-auto mb-6 shadow-xl overflow-hidden border-4 border-white/50 bg-gray-200 transition-transform duration-300 ease-out">
                <img src="avatar.jpg" alt="头像" class="w-full h-full object-cover">
            </div>
            <div class="parallax-content transition-transform duration-300 ease-out">
                <h1 class="text-3xl font-600 text-gray-800">Finch0714</h1>
                <p class="text-gray-500 mt-2 italic text-sm">“专注、创造、永不止步”</p>
            </div>
        </div>

        <div class="p-10">
            <p class="text-gray-600 leading-relaxed text-center mb-10 parallax-content transition-transform duration-300 ease-out">
                你好！欢迎来到我的主页。我是一个热衷于终身学习和影视、游戏的探索者。
                这里记录了我的技术足迹与创意构思。
            </p>

            <div class="flex flex-col sm:flex-row gap-4 justify-center parallax-content">
                <a href="https://space.bilibili.com/2066563707" target="_blank" class="px-8 py-3 bg-[#fb7299] text-white rounded-2xl hover:bg-[#e06489] transition-all font-medium text-center shadow-sm">
                    Bilibili
                </a>
                <button onclick="event.stopPropagation(); openModal()" class="px-8 py-3 bg-white/60 text-gray-800 border border-white rounded-2xl hover:bg-white/90 transition-all font-medium shadow-sm">
                    获取联系
                </button>
            </div>
        </div>

        <div class="bg-white/20 py-6 text-center">
            <p class="text-xs text-gray-400 uppercase tracking-widest">© 2026 Powered by Google Gemini and Latetelly♥</p>
            <div class="mt-2 text-[10px] text-gray-500 font-medium">
                <span id="busuanzi_container_site_pv" style="display:none">浏览数: <span id="busuanzi_value_site_pv" class="text-indigo-500">--</span></span>
                <span class="mx-1 text-gray-300">|</span>
                <span id="busuanzi_container_site_uv" style="display:none">访客数: <span id="busuanzi_value_site_uv" class="text-purple-500">--</span></span>
            </div>
            <a href="index.html" class="inline-block mt-3 text-[10px] text-gray-500 hover:text-red-500 transition-colors duration-300">
                [ TERMINAL_LOGOUT // GO BACK ]
            </a>
        </div>
    </div>

    <div id="gyro-notice" class="sm:hidden">点击页面开启重力感应视差</div>

    <div id="contactModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
        <div onclick="closeModal()" class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
        <div id="modalContent" class="glass w-full max-w-md rounded-[2.5rem] shadow-2xl relative z-10 p-8">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800 tracking-tight">联系方式</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-3xl leading-none">&times;</button>
            </div>
            <div class="space-y-4">
                <div class="flex items-center p-4 bg-white/40 rounded-2xl">
                    <span class="text-2xl mr-4">📧</span>
                    <div>
                        <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">Email</p>
                        <p class="text-gray-700 font-medium">finch0714@qq.com</p>
                    </div>
                </div>
                <div class="flex items-center p-4 bg-white/40 rounded-2xl">
                    <span class="text-2xl mr-4">💬</span>
                    <div>
                        <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">QQ</p>
                        <p class="text-gray-700 font-medium">861288676</p>
                    </div>
                </div>
            </div>
            <button onclick="closeModal()" class="w-full mt-8 py-4 bg-indigo-500 text-white rounded-2xl hover:bg-indigo-600 transition-colors font-bold shadow-lg">确认</button>
        </div>
    </div>

    <script>
        const glass = document.querySelector('.glass');
        const avatar = document.querySelector('.parallax-avatar');
        const contents = document.querySelectorAll('.parallax-content');
        const snowCanvas = document.getElementById('snow-canvas');
        const modal = document.getElementById('contactModal');

        let xPercent = 0, yPercent = 0; // 统一偏移量存储

        // 1. 鼠标移动逻辑
        document.addEventListener('mousemove', (e) => {
            xPercent = (e.clientX / window.innerWidth) - 0.5;
            yPercent = (e.clientY / window.innerHeight) - 0.5;
            updateParallax();
        });

        // 2. 💡 手机重力感应逻辑
        function initGyro() {
            // iOS 权限请求逻辑
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            document.getElementById('gyro-notice').style.display = 'none';
                        }
                    })
                    .catch(console.error);
            } else {
                // 非 iOS 系统直接监听
                window.addEventListener('deviceorientation', handleOrientation);
                document.getElementById('gyro-notice').style.display = 'none';
            }
        }

        function handleOrientation(event) {
            // beta: 前后倾斜 (-180 到 180)，取有效范围 -30 到 30
            // gamma: 左右倾斜 (-90 到 90)，取有效范围 -30 到 30
            let beta = event.beta; 
            let gamma = event.gamma;

            // 归一化处理
            xPercent = Math.max(-1, Math.min(1, gamma / 30)) * 0.5;
            yPercent = Math.max(-1, Math.min(1, (beta - 40) / 30)) * 0.5; // 减40是假设用户平时握持角度
            updateParallax();
        }

        // 3. 统一执行渲染
        function updateParallax() {
            const cardX = xPercent * 25; 
            const cardY = yPercent * 25;
            const rotateX = yPercent * -15;
            const rotateY = xPercent * 15;
            
            glass.style.transform = `translateX(${cardX}px) translateY(${cardY}px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            avatar.style.transform = `translateZ(60px) translateX(${xPercent * 45}px) translateY(${yPercent * 45}px)`;
            
            contents.forEach(content => {
                content.style.transform = `translateZ(30px) translateX(${xPercent * 30}px) translateY(${yPercent * 30}px)`;
            });
            snowCanvas.style.transform = `translateX(${xPercent * -20}px) translateY(${yPercent * -20}px)`;
        }

        // 弹窗与标题切换逻辑
        function openModal() { modal.classList.remove('hidden'); document.body.classList.add('no-scroll'); }
        function closeModal() { modal.classList.add('hidden'); document.body.classList.remove('no-scroll'); }
        const originalTitle = document.title;
        document.addEventListener('visibilitychange', () => {
            document.title = document.hidden ? 'Σ(っ °Д °;)っ 别走嘛~' : 'ヾ(≧▽≦*)o 欢迎回来！';
            if(!document.hidden) setTimeout(() => document.title = originalTitle, 2000);
        });

        // 飘雪逻辑 (保持之前的代码)
        const ctx = snowCanvas.getContext('2d');
        let particles = [], animationFrame, snowMode = 1;
        function resize() { snowCanvas.width = window.innerWidth; snowCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();
        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * snowCanvas.width;
                this.y = Math.random() * snowCanvas.height - snowCanvas.height;
                this.size = Math.random() * 3 + 1;
                this.speed = Math.random() * 1 + 0.5;
                this.velX = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.char = Math.floor(Math.random() * 2);
            }
            update() { this.y += this.speed; this.x += this.velX; if (this.y > snowCanvas.height) this.reset(); }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                if (snowMode === 1) { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
                else if (snowMode === 2) { ctx.fillRect(this.x, this.y, this.size * 1.5, this.size * 1.5); }
                else if (snowMode === 3) { ctx.font = `${this.size + 10}px monospace`; ctx.fillText(this.char, this.x, this.y); }
            }
        }
        function initSnow() { particles = []; for (let i = 0; i < 80; i++) particles.push(new Particle()); }
        function animate() {
            ctx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
            if (snowMode !== 0) { particles.forEach(p => { p.update(); p.draw(); }); animationFrame = requestAnimationFrame(animate); }
        }
        function toggleSnow() {
            snowMode = (snowMode + 1) % 4;
            document.getElementById('snow-btn').innerText = ['🚫', '❄️', '🟦', '🔢'][snowMode];
            if (snowMode === 0) { ctx.clearRect(0, 0, snowCanvas.width, snowCanvas.height); cancelAnimationFrame(animationFrame); }
            else { cancelAnimationFrame(animationFrame); animate(); }
        }
        initSnow(); animate();
    </script>
</body>
</html>
