<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>About | Finch0714</title>
    
    <link rel="icon" type="image/png" href="Favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.loli.net/css2?family=Inter:wght@400;700;900&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root { --font-main: 'Inter', sans-serif; }
        body { 
            font-family: var(--font-main); background-color: #111; 
            margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 背景层 */
        #bg-layer { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: url('./defbg.webp') center/cover no-repeat; z-index: -2; 
        }
        #bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: -1; }

        .glass { 
            background: rgba(255, 255, 255, 0.45); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* 强制 3xl 圆角 (1.5rem) */
        .rounded-3xl-custom { border-radius: 1.5rem !important; }
        .rounded-4xl-custom { border-radius: 2.5rem !important; }

        /* 链接交互 */
        .nav-link { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .nav-link:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.8); }

        /* 弹窗动画 */
        #contact-modal { display: none; position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); }
        #contact-modal.active { display: flex; align-items: center; justify-content: center; }

        /* 雪花效果容器 */
        #snow-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    </style>
</head>
<body>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>
    <div id="snow-container"></div>

    <main class="w-full max-w-lg px-6 pt-20 pb-10 flex-grow">
        <div class="glass p-8 rounded-4xl-custom shadow-2xl text-center mb-6">
            <div class="relative inline-block mb-6">
                <img src="avatar.jpg" class="w-24 h-24 rounded-full border-4 border-white shadow-lg mx-auto" alt="Avatar">
                <div class="absolute bottom-0 right-0 w-6 h-6 bg-green-500 border-4 border-white rounded-full"></div>
            </div>
            
            <h1 class="text-3xl font-black text-gray-900 tracking-tighter mb-2">Finch0714</h1>
            <p class="text-[10px] font-bold text-gray-600 uppercase tracking-[0.3em] mb-8">High School Student / Piano Player</p>
            
            <div class="grid grid-cols-2 gap-4">
                <a href="https://space.bilibili.com/2091924618" target="_blank" class="glass nav-link p-4 rounded-3xl-custom flex flex-col items-center">
                    <span class="text-[9px] font-black text-gray-500 uppercase mb-1">Bilibili</span>
                    <span class="text-xs font-bold text-gray-800">个人主页</span>
                </a>
                <a href="luckydraw.html" class="glass nav-link p-4 rounded-3xl-custom flex flex-col items-center">
                    <span class="text-[9px] font-black text-gray-500 uppercase mb-1">Activity</span>
                    <span class="text-xs font-bold text-gray-800">幸运抽奖</span>
                </a>
                <button onclick="toggleModal()" class="glass nav-link p-4 rounded-3xl-custom flex flex-col items-center">
                    <span class="text-[9px] font-black text-gray-500 uppercase mb-1">Contact</span>
                    <span class="text-xs font-bold text-gray-800">联系方式</span>
                </button>
                <a href="https://b23.tv/to79uAN" target="_blank" class="glass nav-link p-4 rounded-3xl-custom flex flex-col items-center">
                    <span class="text-[9px] font-black text-gray-500 uppercase mb-1">Collection</span>
                    <span class="text-xs font-bold text-gray-800">私藏网站</span>
                </a>
            </div>
        </div>

        <div class="glass p-6 rounded-3xl-custom text-center mb-10">
            <p id="hitokoto_text" class="text-sm font-bold text-gray-800 leading-relaxed">正在加载一言...</p>
            <p id="hitokoto_from" class="text-[9px] font-black text-gray-500 uppercase mt-4 tracking-widest">— 加载中</p>
        </div>
    </main>

    <footer class="w-full flex justify-center pb-8">
        <div class="flex items-center gap-3 opacity-30 hover:opacity-80 transition-opacity cursor-default">
            <span class="text-[8px] font-bold text-gray-500 uppercase tracking-widest">PV</span>
            <span id="busuanzi_value_site_pv" class="text-[9px] font-mono text-gray-700 font-bold">...</span>
            <span class="text-gray-400 text-[8px]">/</span>
            <span class="text-[8px] font-bold text-gray-500 uppercase tracking-widest">UV</span>
            <span id="busuanzi_value_site_uv" class="text-[9px] font-mono text-gray-700 font-bold">...</span>
        </div>
    </footer>

    <div id="contact-modal" onclick="toggleModal()">
        <div class="glass max-w-[280px] w-full p-8 rounded-4xl-custom text-center shadow-2xl" onclick="event.stopPropagation()">
            <h3 class="text-[10px] font-black text-gray-500 uppercase tracking-[0.3em] mb-6">Contact</h3>
            <div class="space-y-4">
                <div class="p-4 bg-white bg-opacity-40 rounded-3xl-custom border border-white border-opacity-30">
                    <p class="text-[9px] font-black text-gray-400 uppercase mb-1">QQ Group</p>
                    <p class="text-sm font-bold text-gray-900">769733074</p>
                </div>
                <div class="p-4 bg-white bg-opacity-40 rounded-3xl-custom border border-white border-opacity-30">
                    <p class="text-[9px] font-black text-gray-400 uppercase mb-1">Email</p>
                    <p class="text-sm font-bold text-gray-900">finch0714@outlook.com</p>
                </div>
            </div>
            <button onclick="toggleModal()" class="w-full mt-8 py-4 bg-gray-900 text-white rounded-3xl-custom font-black text-xs uppercase tracking-widest">Close</button>
        </div>
    </div>

    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    <script>
        // 弹窗控制
        function toggleModal() {
            document.getElementById('contact-modal').classList.toggle('active');
        }

        // 一言加载
        fetch('https://v1.hitokoto.cn')
            .then(response => response.json())
            .then(data => {
                document.getElementById('hitokoto_text').innerText = data.hitokoto;
                document.getElementById('hitokoto_from').innerText = `— 「${data.from}」`;
            })
            .catch(console.error);

        // 雪花效果
        function createSnowflake() {
            const snow = document.getElementById('snow-container');
            const snowflake = document.createElement('div');
            const size = Math.random() * 3 + 2 + 'px';
            
            snowflake.style.position = 'absolute';
            snowflake.style.backgroundColor = 'white';
            snowflake.style.borderRadius = '50%';
            snowflake.style.opacity = Math.random() * 0.5 + 0.3;
            snowflake.style.width = size;
            snowflake.style.height = size;
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.top = '-10px';
            snowflake.style.filter = 'blur(1px)';
            
            const duration = Math.random() * 5 + 5;
            snowflake.style.transition = `transform ${duration}s linear, opacity ${duration}s linear`;
            
            snow.appendChild(snowflake);
            
            setTimeout(() => {
                snowflake.style.transform = `translateY(100vh) translateX(${Math.random() * 200 - 100}px)`;
                snowflake.style.opacity = '0';
            }, 100);
            
            setTimeout(() => snowflake.remove(), duration * 1000);
        }
        setInterval(createSnowflake, 200);
    </script>
</body>
</html>
