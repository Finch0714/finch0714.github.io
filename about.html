<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finch0714 | 个人主页</title>
    
    <link rel="icon" type="image/png" href="Favicon.png">
    <link rel="preload" as="image" href="defbg.webp">
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="dns-prefetch" href="https://v1.hitokoto.cn">

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.loli.net/css2?family=Inter:wght@300;400;600&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --font-main: 'Inter', sans-serif; --font-serif: 'Noto Serif SC', serif; }
        body { font-family: var(--font-main); margin: 0; background-color: #111; overflow-x: hidden; display: flex; justify-content: center; }

        #bg-layer { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: url('defbg.webp') center/cover no-repeat;
            transition: opacity 0.8s ease-in-out; z-index: -2; 
        }
        #bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.35); z-index: -1; }
        
        .glass { 
            background: rgba(255, 255, 255, 0.39); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .expand-container {
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s;
            max-height: 85px; overflow: hidden;
        }
        .expand-container.expanded { max-height: 1200px; }

        .hitokoto-card { font-family: var(--font-serif); writing-mode: vertical-rl; text-orientation: mixed; }
        @media (max-width: 1024px) { .hitokoto-card { writing-mode: horizontal-tb; } }

        #contact-modal { display: none; }
        #contact-modal.active { display: flex; animation: modalIn 0.3s forwards; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        #mc_input::placeholder { color: #374151 !important; font-weight: 600; }
        
        /* 针对 Via 等老旧内核的阴影增强 */
        .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    </style>
</head>

<body class="p-6 py-12 lg:py-16">
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>

    <div class="fixed top-6 left-6 flex gap-3 z-[100]">
        <div class="w-10 h-10 glass rounded-xl flex items-center justify-center cursor-pointer shadow-xl" onclick="toggleSnow()">❄️</div>
        <div class="w-10 h-10 glass rounded-xl flex items-center justify-center cursor-pointer shadow-xl" onclick="changeWallpaper()">🖼️</div>
    </div>

    <canvas id="snow-canvas" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5;"></canvas>

    <div class="flex flex-col items-center gap-10 w-full max-w-7xl z-10">
        
        <div class="flex flex-col lg:flex-row items-center lg:items-stretch justify-center gap-8 w-full">
            <div id="profile-card" class="glass max-w-xl w-full rounded-3xl shadow-2xl overflow-hidden order-2 lg:order-1">
                <div class="p-10 text-center border-b border-black/5">
                    <div class="w-20 h-20 rounded-full mx-auto mb-6 shadow-xl overflow-hidden border-4 border-white">
                        <img src="avatar.jpg" alt="Avatar" class="w-full h-full object-cover">
                    </div>
                    <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Finch0714</h1>
                    <p class="text-gray-600 mt-2 italic text-sm font-light">restless, resetless.</p>
                </div>
                <div class="p-10 text-center">
                    <p class="text-gray-700 leading-relaxed mb-10 text-sm">你好！欢迎来到我的主页。我是一个热衷于终身学习和影视、游戏的探索者。</p>
                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <a href="https://space.bilibili.com/2066563707" target="_blank" class="px-10 py-3 bg-pink-500 text-white rounded-2xl font-semibold text-sm shadow-md active:scale-95 transition-transform">Bilibili</a>
                        <button onclick="openModal()" class="px-10 py-3 bg-white bg-opacity-40 text-gray-800 border border-white rounded-2xl font-semibold text-sm shadow-md active:scale-95 transition-transform">获取联系</button>
                    </div>
                </div>
            </div>

            <div class="glass lg:w-28 w-full p-8 lg:py-12 rounded-3xl shadow-xl relative flex items-center justify-center order-1 lg:order-2">
                <div class="hitokoto-card text-gray-800">
                    <span id="hitokoto_text" class="text-base leading-loose tracking-widest opacity-0 transition-opacity">加载中...</span>
                    <span id="hitokoto_from" class="text-xs text-gray-700 mt-6 font-bold opacity-0 block text-right"></span>
                </div>
                <button onclick="fetchHitokoto()" class="absolute bottom-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-white bg-opacity-20 hover:bg-opacity-40 transition-colors text-xs">🔄</button>
            </div>
        </div>

        <div id="mc_container" class="glass max-w-xl lg:max-w-4xl w-full p-6 rounded-3xl shadow-xl flex flex-col expand-container order-3">
            <div class="flex justify-between items-center min-h-[40px]">
                <h2 class="text-xs font-bold text-gray-800 tracking-widest flex items-center gap-2 uppercase">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-lg"></span> MC智能信息查询
                </h2>
                <div class="flex items-center gap-4">
                    <img id="mc_icon" src="" class="w-8 h-8 rounded-lg shadow-md hidden">
                    <button id="mc_toggle_btn" onclick="toggleMC()" class="text-xs font-bold text-gray-600 px-4 py-1.5 border border-black border-opacity-10 rounded-full">展开详情</button>
                </div>
            </div>

            <div class="mt-8 space-y-8">
                <div class="flex flex-col md:flex-row gap-4">
                    <input id="mc_input" type="text" placeholder="输入服务器IP或玩家ID..." class="flex-1 bg-white bg-opacity-20 border-2 border-white border-opacity-50 rounded-2xl px-6 py-4 text-sm focus:outline-none focus:border-green-400 text-gray-900 font-bold transition-all">
                    <button onclick="smartQuery()" class="bg-gray-800 text-white px-10 py-4 rounded-2xl text-xs font-bold tracking-widest shadow-lg active:scale-95 transition-all">开始查询</button>
                </div>
                <div id="mc_result_box" class="hidden border-t border-black border-opacity-5 pt-8">
                    <div id="player_display" class="hidden flex flex-col md:flex-row items-center md:items-start gap-10">
                        <img id="player_3d" src="" class="h-64 drop-shadow-2xl">
                        <div class="flex-1 w-full space-y-6 text-left">
                            <div><p class="text-[10px] font-bold text-gray-500 uppercase mb-1 tracking-widest">唯一标识码 (UUID)</p><p id="player_uuid" class="text-xs font-mono bg-black bg-opacity-5 p-4 rounded-2xl break-all text-gray-700"></p></div>
                            <div class="grid grid-cols-2 gap-3">
                                <a id="btn_namemc" target="_blank" class="p-3 bg-white bg-opacity-20 border border-white border-opacity-30 rounded-2xl text-[10px] font-bold text-center text-gray-700 uppercase">NameMC档案</a>
                                <a id="btn_skin" target="_blank" class="p-3 bg-white bg-opacity-20 border border-white border-opacity-30 rounded-2xl text-[10px] font-bold text-center text-gray-700 uppercase">下载皮肤</a>
                            </div>
                        </div>
                    </div>
                    <div id="server_display" class="hidden grid grid-cols-3 gap-6 font-mono text-xs text-gray-600">
                        <div class="p-4 bg-white bg-opacity-20 rounded-2xl text-center"><p class="mb-1 text-gray-400 uppercase">状态</p><span id="mc_online" class="font-bold"></span></div>
                        <div class="p-4 bg-white bg-opacity-20 rounded-2xl text-center"><p class="mb-1 text-gray-400 uppercase">在线人数</p><span id="mc_players" class="font-bold text-gray-700"></span></div>
                        <div class="p-4 bg-white bg-opacity-20 rounded-2xl text-center"><p class="mb-1 text-gray-400 uppercase">版本</p><span id="mc_ver" class="font-bold text-gray-700"></span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="glass max-w-xl lg:max-w-4xl w-full p-8 rounded-3xl shadow-xl flex flex-col order-4 items-center">
            <div class="w-full flex justify-start mb-6"><h2 class="text-xs font-bold text-gray-800 tracking-widest uppercase">个人私藏网站</h2></div>
            <button onclick="rickrollRedirect()" class="bg-gray-800 text-white px-16 py-4 rounded-2xl text-xs font-bold tracking-widest shadow-lg active:scale-95 transition-all">点击进入</button>
        </div>

        <div class="glass max-w-xl lg:max-w-4xl w-full p-8 rounded-3xl shadow-xl flex flex-col order-5 items-center">
            <div class="w-full flex justify-start mb-6"><h2 class="text-xs font-bold text-gray-800 tracking-widest uppercase">限时活动</h2></div>
            <div class="text-center py-2">
                <h3 class="text-xl font-serif font-bold text-gray-800 mb-2">幸运大抽奖</h3>
                <p class="text-xs text-gray-500 mb-8 uppercase tracking-widest">Win exclusive rewards</p>
                <a href="luckydraw.html" class="bg-gray-800 text-white px-16 py-4 rounded-2xl text-xs font-bold tracking-widest shadow-lg active:scale-95 transition-all">立即参与</a>
            </div>
        </div>
    </div>

    <div id="contact-modal" class="fixed inset-0 z-[200] items-center justify-center p-6 bg-black bg-opacity-40 backdrop-blur-sm" onclick="if(event.target==this) closeModal()">
        <div class="glass max-w-sm w-full p-10 rounded-3xl shadow-2xl relative text-center">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400">✕</button>
            <h3 class="text-xs font-bold text-gray-800 mb-8 uppercase tracking-widest">Connect</h3>
            <div class="space-y-4">
                <div class="p-5 bg-white bg-opacity-30 rounded-2xl flex items-center justify-between"><span class="text-[10px] font-bold text-gray-500">QQ</span><span class="text-sm font-mono text-gray-800 select-all">861288676</span></div>
                <div class="p-5 bg-white bg-opacity-30 rounded-2xl flex items-center justify-between"><span class="text-[10px] font-bold text-gray-500">EMAIL</span><span class="text-sm font-mono text-gray-800 select-all">finch0714@qq.com</span></div>
            </div>
        </div>
    </div>

    <script>
        function changeWallpaper() {
            const bg = document.getElementById('bg-layer');
            const url = `https://wp.upx8.com/api.php?_t=${Date.now()}`;
            const img = new Image(); img.src = url;
            img.onload = () => { bg.style.opacity = 0; setTimeout(() => { bg.style.backgroundImage = `url('${url}')`; bg.style.opacity = 1; }, 400); };
        }
        function rickrollRedirect() { window.open("https://player.bilibili.com/player.html?bvid=BV1UT42167xb&autoplay=1", '_blank'); }
        function toggleMC() {
            const container = document.getElementById('mc_container'), btn = document.getElementById('mc_toggle_btn');
            const isExp = container.classList.toggle('expanded');
            btn.innerText = isExp ? "收起面板" : "展开详情";
        }
        async function smartQuery() {
            const val = document.getElementById('mc_input').value.trim();
            const resBox = document.getElementById('mc_result_box'), pDisp = document.getElementById('player_display'), sDisp = document.getElementById('server_display'), iconImg = document.getElementById('mc_icon');
            if(!val) return;
            resBox.classList.remove('hidden');
            if (val.includes('.')) {
                pDisp.classList.add('hidden'); sDisp.classList.remove('hidden');
                try {
                    const res = await fetch(`https://api.mcstatus.io/v2/status/java/${val}`), data = await res.json();
                    if(data.online) {
                        document.getElementById('mc_online').innerText = "在线";
                        document.getElementById('mc_players').innerText = `${data.players.online}/${data.players.max}`;
                        document.getElementById('mc_ver').innerText = (data.version.name_clean || data.version.name).substring(0, 15);
                        iconImg.src = data.icon || `https://crafthead.net/avatar/steve`; iconImg.classList.remove('hidden');
                    } else { document.getElementById('mc_online').innerText = "离线"; }
                } catch(e) { document.getElementById('mc_online').innerText = "错误"; }
            } else {
                sDisp.classList.add('hidden'); pDisp.classList.remove('hidden');
                document.getElementById('player_3d').src = `https://crafthead.net/body/${val}`;
                iconImg.src = `https://crafthead.net/avatar/${val}`; iconImg.classList.remove('hidden');
                try {
                    const res = await fetch(`https://playerdb.co/api/player/minecraft/${val}`), json = await res.json();
                    if(json.success) document.getElementById('player_uuid').innerText = json.data.player.id;
                    document.getElementById('btn_namemc').href = `https://namemc.com/profile/${val}`;
                    document.getElementById('btn_skin').href = `https://crafthead.net/skin/${val}`;
                } catch(e) { document.getElementById('player_uuid').innerText = "获取失败"; }
            }
        }
        function fetchHitokoto() {
            const t = document.getElementById('hitokoto_text'), f = document.getElementById('hitokoto_from');
            t.style.opacity = 0; f.style.opacity = 0;
            fetch('https://v1.hitokoto.cn').then(res => res.json()).then(d => {
                t.innerText = d.hitokoto; f.innerText = `—— 「${d.from}」`; t.style.opacity = 1; f.style.opacity = 0.9;
            });
        }
        fetchHitokoto();
        function openModal() { document.getElementById('contact-modal').classList.add('active'); }
        function closeModal() { document.getElementById('contact-modal').classList.remove('active'); }
        const canvas = document.getElementById('snow-canvas'), ctx = canvas.getContext('2d');
        let snowActive = true;
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        let pts = Array.from({length:40}, () => ({x:Math.random(), y:Math.random(), s:Math.random()*1.5+0.5}));
        function anim() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            if(snowActive) {
                ctx.fillStyle = "rgba(255,255,255,0.4)";
                pts.forEach(p => { p.y += 0.0007; if(p.y>1) p.y=0; ctx.beginPath(); ctx.arc(p.x*canvas.width, p.y*canvas.height, p.s, 0, Math.PI*2); ctx.fill(); });
            }
            requestAnimationFrame(anim);
        }
        anim();
        function toggleSnow() { snowActive = !snowActive; }
    </script>
</body>
</html>
