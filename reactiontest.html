<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>反应速度测试 · Finch0714</title>
    <meta
      name="description"
      content="三轮随机延迟的反应速度测试，用毫秒记录你对绿色信号的反应时间。"
    />
    <link rel="icon" type="image/png" href="Favicon.png" />
    <link rel="stylesheet" href="./assets/md.css" />
    <!-- 字体：霞鹜文楷 Bright Medium（中文网字计划 CDN，按 unicode-range 分片）
         非阻塞加载：media=print 先挂起，下载完自动切回 all，不挡首屏绘制 -->
    <link
      rel="preconnect"
      href="https://cn-font.claude-code-best.win"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://cn-font.claude-code-best.win/packages/lxgwwenkaibright/dist/LXGWBright-Medium/result.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cn-font.claude-code-best.win/packages/lxgwwenkaibright/dist/LXGWBright-Medium/result.css"
      />
    </noscript>
    <style>
      /* 全屏测试区（顶部给应用栏留位） */
      #test-area {
        position: fixed;
        inset: var(--md-appbar-h) 0 0 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        background-color: var(--md-background);
        color: var(--md-on-surface);
        transition: background-color 0.12s ease;
        overflow-y: auto;
      }

      /* 变绿之前 —— 红色等待 */
      #test-area.state-waiting {
        background-color: #e53935;
        color: #fff;
      }

      /* 变绿 —— 该点了 */
      #test-area.state-ready {
        background-color: var(--md-primary);
        color: #fff;
      }

      /* 抢跑 —— 暗红 + 抖动，和上面两种状态区分开 */
      #test-area.state-early {
        background-color: #7f1d1d;
        color: #fff;
      }

      #test-area.state-early .rt-text {
        animation: rt-shake 0.4s ease;
      }

      @keyframes rt-shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-12px);
        }
        40% {
          transform: translateX(12px);
        }
        60% {
          transform: translateX(-7px);
        }
        80% {
          transform: translateX(7px);
        }
      }

      .rt-text {
        text-align: center;
        pointer-events: none;
      }

      .rt-text h1 {
        font-size: clamp(2.25rem, 8vw, 4.5rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-bottom: 12px;
        line-height: 1.1;
      }

      .rt-text p {
        font-size: 1rem;
        opacity: 0.78;
        font-weight: 500;
      }

      .rt-rounds {
        display: inline-flex;
        gap: 8px;
        margin-bottom: 26px;
        pointer-events: none;
      }

      .rt-rounds i {
        width: 34px;
        height: 4px;
        border-radius: 999px;
        background: currentColor;
        opacity: 0.22;
      }

      .rt-rounds i.done {
        opacity: 1;
      }

      .rt-hint {
        position: absolute;
        bottom: 26px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 0.75rem;
        opacity: 0.45;
        letter-spacing: 0.06em;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="test-area" class="state-idle" onclick="handleInteraction()">
      <div class="rt-rounds" id="rounds"><i></i><i></i><i></i></div>
      <div class="rt-text">
        <h1 id="main-text">反应测试</h1>
        <p id="sub-text">点击屏幕开始第一轮（共 3 轮）</p>
      </div>
      <div class="rt-hint">变绿之前别点，抢跑要重来</div>
    </div>

    <!-- 结果对话框 -->
    <div class="md-dialog-scrim" id="result-dialog">
      <div class="md-dialog" role="dialog" aria-modal="true">
        <h2 class="md-dialog__title md-center">测试完成</h2>
        <p class="md-body md-center" style="margin-bottom: 20px">
          三轮回合成绩如下
        </p>
        <div
          class="md-mono"
          style="
            background: var(--md-surface-container);
            border-radius: 12px;
            padding: 16px 18px;
          "
        >
          <div class="md-row" style="justify-content: space-between">
            <span>Round 1</span><b id="r1val">--</b>
          </div>
          <div
            class="md-row"
            style="justify-content: space-between; margin-top: 8px"
          >
            <span>Round 2</span><b id="r2val">--</b>
          </div>
          <div
            class="md-row"
            style="justify-content: space-between; margin-top: 8px"
          >
            <span>Round 3</span><b id="r3val">--</b>
          </div>
        </div>
        <div
          class="md-row"
          style="justify-content: space-between; margin: 20px 0 22px"
        >
          <span class="md-label">平均反应</span>
          <b
            id="avg-val"
            class="md-mono"
            style="font-size: 1.7rem; color: var(--md-primary-dark)"
            >--</b
          >
        </div>
        <button
          class="md-btn md-btn--filled md-btn--block md-btn--lg md-ripple"
          onclick="resetTest(event)"
        >
          重新测试
        </button>
        <a
          class="md-btn md-btn--text md-btn--block md-ripple"
          style="margin-top: 8px"
          href="./about.html"
          >返回主页</a
        >
      </div>
    </div>

    <script src="./assets/site.js"></script>
    <script src="./assets/nav.js"></script>
    <script>
      var currentState = "IDLE"; // IDLE / WAITING / READY / EARLY / FINISHED
      var startTime,
        timer,
        results = [];

      var testArea = document.getElementById("test-area");
      var mainText = document.getElementById("main-text");
      var subText = document.getElementById("sub-text");
      var roundsBox = document.getElementById("rounds");

      function paintRounds(done) {
        var dots = roundsBox.querySelectorAll("i");
        for (var i = 0; i < dots.length; i++) {
          dots[i].classList.toggle("done", i < done);
        }
      }

      function setState(state, cls) {
        currentState = state;
        testArea.className = cls;
      }

      function handleInteraction() {
        switch (currentState) {
          case "IDLE":
            startWaiting();
            break;
          case "WAITING":
            tooEarly();
            break;
          case "READY":
            recordResult();
            break;
          case "EARLY":
            startWaiting();
            break;
        }
      }

      function startWaiting() {
        setState("WAITING", "state-waiting");
        MD.close("result-dialog");
        mainText.textContent = "···";
        subText.textContent = "等它变绿时，迅速点击！";

        var waitTime = Math.floor(Math.random() * 4500) + 3500;

        timer = setTimeout(function () {
          setState("READY", "state-ready");
          mainText.textContent = "点击！";
          subText.textContent = "快！快！快！";
          startTime = performance.now();
        }, waitTime);
      }

      function tooEarly() {
        clearTimeout(timer);
        setState("EARLY", "state-early");
        mainText.textContent = "太快了！";
        subText.textContent = "变绿之前不能点，点击屏幕重试";
      }

      function recordResult() {
        var reactionTime = Math.round(performance.now() - startTime);
        results.push(reactionTime);

        if (results.length < 3) {
          setState("IDLE", "state-idle");
          mainText.textContent = reactionTime + " ms";
          subText.textContent = "完成第 " + results.length + "/3 轮，点击继续";
          paintRounds(results.length);
        } else {
          paintRounds(3);
          showFinalResults();
        }
      }

      function showFinalResults() {
        setState("FINISHED", "state-idle");
        document.getElementById("r1val").textContent = results[0] + " ms";
        document.getElementById("r2val").textContent = results[1] + " ms";
        document.getElementById("r3val").textContent = results[2] + " ms";

        var avg = Math.round(
          results.reduce(function (a, b) {
            return a + b;
          }) / 3,
        );
        document.getElementById("avg-val").textContent = avg + " ms";
        MD.open("result-dialog");
      }

      function resetTest(e) {
        if (e) e.stopPropagation();
        results = [];
        setState("IDLE", "state-idle");
        paintRounds(0);
        MD.close("result-dialog");
        mainText.textContent = "反应测试";
        subText.textContent = "点击屏幕开始第一轮（共 3 轮）";
      }
    </script>
  </body>
</html>
