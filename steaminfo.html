<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steam 游戏库 - 苏通666</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #1b2838; /* Steam 经典蓝黑背景 */
        color: #c7d5e0;
        font-family: "Motiva Sans", Arial, Helvetica, sans-serif;
        min-height: 100vh;
      }

      /* 顶部横幅渐变 */
      .steam-header {
        background:
          linear-gradient(rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.6) 100%),
          linear-gradient(135deg, #2a475e 0%, #1b2838 100%);
      }

      .glass-card {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition: transform 0.2s ease;
      }

      .glass-card:hover {
        background: rgba(255, 255, 255, 0.05);
        transform: translateX(5px);
      }

      .playtime-bar {
        height: 4px;
        background: rgba(103, 193, 245, 0.1);
        border-radius: 2px;
        overflow: hidden;
      }

      .playtime-fill {
        height: 100%;
        background: linear-gradient(to right, #47bfff, #1a9fff);
        box-shadow: 0 0 8px rgba(102, 192, 232, 0.5);
      }

      /* 状态标识 */
      .status-online {
        color: #66c0f4;
      }
      .status-offline {
        color: #898989;
      }
      .status-ingame {
        color: #90ba3c;
      }

      .avatar-frame {
        border: 2px solid #66c0f4;
        padding: 2px;
      }
    </style>
  </head>
  <body class="pb-12">
    <header class="steam-header w-full py-12 px-6 mb-8">
      <div
        class="max-w-4xl mx-auto flex flex-col md:flex-row items-center gap-8"
      >
        <div id="user-avatar-container">
          <img
            id="user-avatar"
            src=""
            class="w-32 h-32 rounded shadow-2xl avatar-frame bg-gray-800"
          />
        </div>
        <div class="text-center md:text-left">
          <h1 id="user-name" class="text-4xl font-bold text-white mb-2">
            加载中...
          </h1>
          <div
            class="flex flex-wrap justify-center md:justify-start gap-6 text-sm"
          >
            <div class="flex flex-col">
              <span class="text-gray-400 uppercase tracking-tighter text-xs"
                >总游戏数</span
              >
              <span id="game-count" class="text-xl font-mono text-white"
                >--</span
              >
            </div>
            <div class="flex flex-col">
              <span class="text-gray-400 uppercase tracking-tighter text-xs"
                >累计时长</span
              >
              <span id="total-hours" class="text-xl font-mono text-white"
                >--</span
              >
            </div>
            <div class="flex flex-col">
              <span class="text-gray-400 uppercase tracking-tighter text-xs"
                >最后更新</span
              >
              <span id="update-time" class="text-xl font-mono text-gray-300"
                >--</span
              >
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-6">
      <h2
        class="text-gray-400 text-xs font-bold uppercase tracking-widest mb-6 border-b border-gray-700 pb-2"
      >
        所有游戏详情
      </h2>
      <div id="games-container" class="space-y-3"></div>
    </main>

    <script>
      async function loadSteamData() {
        try {
          const response = await fetch("./steam.json");
          const data = await response.json();

          // 1. 填充个人资料
          document.getElementById("user-name").innerText = data.name;
          document.getElementById("user-avatar").src = data.avatar;
          document.getElementById("game-count").innerText = data.game_count;
          document.getElementById("total-hours").innerText =
            data.total_hours + " h";

          // 处理时间戳
          const date = new Date(data.updated_at * 1000);
          document.getElementById("update-time").innerText =
            date.toLocaleDateString();

          // 2. 填充游戏列表
          const container = document.getElementById("games-container");
          const maxTime = Math.max(...data.games_list.map((g) => g.playtime));

          container.innerHTML = data.games_list
            .map((game) => {
              const progress = ((game.playtime / maxTime) * 100).toFixed(1);
              return `
                        <div class="glass-card p-4 rounded-lg flex items-center gap-6">
                            <img src="${game.icon}" class="w-32 h-12 object-cover rounded shadow-md bg-gray-900" 
                                 onerror="this.src='https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/${game.appid}/capsule_184x69.jpg'">
                            
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-end mb-2">
                                    <h3 class="text-white font-bold truncate pr-4">${game.name}</h3>
                                    <span class="text-sm font-mono text-blue-400 whitespace-nowrap">${game.playtime} h</span>
                                </div>
                                <div class="playtime-bar">
                                    <div class="playtime-fill" style="width: ${progress}%"></div>
                                </div>
                            </div>
                        </div>
                    `;
            })
            .join("");
        } catch (error) {
          console.error("读取 Steam 数据失败:", error);
          document.getElementById("user-name").innerText = "数据读取失败";
        }
      }

      loadSteamData();
    </script>
  </body>
</html>
