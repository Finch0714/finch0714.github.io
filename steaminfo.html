<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steam 游戏库 · Finch0714</title>
    <meta
      name="description"
      content="自动同步的 Steam 游戏库：总游戏数、累计时长与每个游戏的游玩时长排行。"
    />
    <link rel="icon" type="image/png" sizes="64x64" href="Favicon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="./assets/md.css" />
    <!-- 字体：霞鹜文楷 Bright Medium（中文网字计划 CDN，按 unicode-range 分片）
         非阻塞加载：media=print 先挂起，下载完自动切回 all，不挡首屏绘制 -->
    <link
      rel="preconnect"
      href="https://cn-font.claude-code-best.win"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://cn-font.claude-code-best.win/packages/lxgwwenkaibright/dist/LXGWBright-Medium/result.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cn-font.claude-code-best.win/packages/lxgwwenkaibright/dist/LXGWBright-Medium/result.css"
      />
    </noscript>
    <script>
      document.documentElement.classList.add("md-js");
    </script>
  </head>

  <body>
    <main class="md-page">
      <div class="md-container">
        <section class="md-hero md-anim steam-hero">
          <!-- 初始 src 用 1x1 透明占位图：空 src="" 会立刻触发 onerror，
               那样头像会被永久隐藏，等 JS 填上真实地址也救不回来。
               真实地址由页面脚本从 steam.js 写入。 -->
          <img
            id="user-avatar"
            class="steam-hero__avatar"
            src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
            alt="Steam 头像"
            width="128"
            height="128"
            onload="this.classList.remove('is-broken')"
            onerror="this.classList.add('is-broken')"
          />
          <div class="steam-hero__meta">
            <span class="md-hero__badge"
              ><span class="md-dot"></span>STEAM</span
            >
            <h1 class="md-display md-hero__title" id="user-name">加载中…</h1>
            <p class="md-hero__desc">
              数据由 GitHub Actions 每天自动同步一次，按游玩时长从高到低排列。
            </p>
            <div class="steam-hero__stats">
              <div class="steam-stat">
                <p class="md-label">总游戏数</p>
                <b class="md-mono" id="game-count">--</b>
              </div>
              <div class="steam-stat">
                <p class="md-label">累计时长</p>
                <b class="md-mono" id="total-hours">--</b>
              </div>
              <div class="steam-stat">
                <p class="md-label">最后更新</p>
                <b class="md-mono" id="update-time">--</b>
              </div>
            </div>
          </div>
        </section>

        <!-- 游戏列表 -->
        <section class="md-section">
          <div class="md-section__head">
            <h2 class="md-section__title">
              <span class="md-section__rule"></span>游戏详情
            </h2>
            <span class="md-chip md-chip--muted" id="list-count">—</span>
          </div>
          <div
            id="games-container"
            style="display: flex; flex-direction: column; gap: 12px"
          ></div>
        </section>
      </div>

      <footer class="md-footer">
        <p style="margin: 0">© <span id="year"></span> Finch0714</p>
      </footer>
    </main>

    <!-- 数据用 <script> 载入，不用 fetch：
         fetch 在 file:// 下会被同源策略拦掉，双击本地文件打开就看不到数据 -->
    <script src="./assets/steam.js"></script>
    <script src="./assets/site.js"></script>
    <script src="./assets/nav.js"></script>
    <script>
      function esc(s) {
        return MD.esc(s);
      }

      /* 优先用 steam.js 里的数据；万一它没加载成功，再退回 fetch steam.json
         （老方式，只在 http/https 下有效） */
      async function readSteamData() {
        if (window.STEAM_DATA) return window.STEAM_DATA;
        var res = await fetch("./steam.json");
        return await res.json();
      }

      async function loadSteamData() {
        var container = document.getElementById("games-container");
        try {
          var data = await readSteamData();

          document.getElementById("user-name").textContent = data.name;
          document.getElementById("user-avatar").src = data.avatar;
          document.getElementById("game-count").textContent = data.game_count;
          document.getElementById("total-hours").textContent =
            data.total_hours + " h";

          var date = new Date(data.updated_at * 1000);
          document.getElementById("update-time").textContent =
            date.toLocaleDateString();

          var games = data.games_list || [];
          document.getElementById("list-count").textContent =
            games.length + " 款游戏";

          var maxTime = Math.max.apply(
            null,
            games.map(function (g) {
              return g.playtime;
            }),
          );

          container.innerHTML = games
            .map(function (game) {
              var progress = ((game.playtime / maxTime) * 100).toFixed(1);
              var fallback =
                "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/" +
                game.appid +
                "/capsule_184x69.jpg";
              return (
                '<article class="md-card md-card--elevated md-reveal" style="padding:16px">' +
                '<div class="md-row" style="gap:18px; flex-wrap:nowrap; align-items:center">' +
                '<img src="' +
                esc(game.icon) +
                '" alt="" loading="lazy" ' +
                'style="width:128px; height:48px; object-fit:cover; border-radius:8px; flex-shrink:0; background:var(--md-surface-container)" ' +
                "onerror=\"this.onerror=null;this.src='" +
                fallback +
                "'\">" +
                '<div style="flex:1; min-width:0">' +
                '<div class="md-row" style="justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:8px">' +
                '<h3 class="md-subtitle" style="margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">' +
                esc(game.name) +
                "</h3>" +
                '<span class="md-mono" style="color:var(--md-primary-dark); font-weight:700; white-space:nowrap; font-size:0.875rem">' +
                game.playtime +
                " h</span>" +
                "</div>" +
                '<div class="md-progress"><div class="md-progress__fill" style="width:' +
                progress +
                '%"></div></div>' +
                "</div></div></article>"
              );
            })
            .join("");

          /* 卡片是异步渲染的，渲染完再登记入场动画 */
          MD.reveal(container);
        } catch (error) {
          console.error("读取 Steam 数据失败:", error);
          document.getElementById("user-name").textContent = "数据读取失败";
          container.innerHTML =
            '<div class="md-card md-center"><p class="md-body" style="margin:0">暂时拿不到 Steam 数据，请稍后刷新。</p></div>';
        }
      }

      document.getElementById("year").textContent = new Date().getFullYear();
      loadSteamData();
    </script>
  </body>
</html>
