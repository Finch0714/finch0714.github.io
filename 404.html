<!DOCTYPE html>
<html lang=en>
<meta charset=utf-8>
<meta name=viewport content="initial-scale=1, minimum-scale=1, width=device-width">
<title>Error 404 (Not Found)!!1</title>
<style>
    * { margin: 0; padding: 0 }
    html, code { font: 15px/22px arial, sans-serif }
    html { background: #fff; color: #222; padding: 15px }
    body { margin: 7% auto 0; max-width: 390px; min-height: 180px; padding: 30px 0 15px }
    
    /* 保留那个经典的小机器人 */
    * > body { 
        background: url(//www.google.com/images/errors/robot.png) 100% 5px no-repeat; 
        padding-right: 205px 
    }
    
    p { margin: 11px 0 22px; overflow: hidden }
    ins { color: #777; text-decoration: none }
    
    /* 谷歌配色的 Finch Logo 样式 */
    #logo-text {
        font-family: 'Product Sans', 'Google Sans', Arial, sans-serif;
        font-size: 42px;
        font-weight: 500;
        letter-spacing: -1.5px;
        line-height: 54px;
        text-decoration: none;
        display: inline-block;
        margin-bottom: 10px;
    }
    
    /* Google 经典色值排列 */
    .g-blue   { color: #4285F4; }
    .g-red    { color: #EA4335; }
    .g-yellow { color: #FBBC05; }
    .g-green  { color: #34A853; }

    @media screen and (max-width: 772px) {
        body { background: none; margin-top: 0; max-width: none; padding-right: 0 }
    }
</style>

<a href="/" id="logo-text" aria-label="Finch">
    <span class="g-blue">F</span><span class="g-red">i</span><span class="g-yellow">n</span><span class="g-blue">c</span><span class="g-green">h</span>
