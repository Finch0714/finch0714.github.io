<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>点击速度测试 · Finch0714</title>
    <meta
      name="description"
      content="5 秒或 10 秒点击速度测试，测出你的 CPS 手速并给出称号。"
    />
    <link rel="icon" type="image/png" href="Favicon.png" />
    <link rel="stylesheet" href="./assets/md.css" />
    <!-- 字体：非阻塞加载（media=print 先挂起，下载完再切回 all），不挡首屏 -->
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.loli.net/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.loli.net/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" />
    </noscript>
    <style>
      #click-area {
        position: fixed;
        inset: var(--md-appbar-h) 0 0 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        padding: 24px;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        background-color: var(--md-background);
        background-image: radial-gradient(
          circle at center,
          rgba(76, 175, 80, 0.1) 0%,
          rgba(76, 175, 80, 0) 62%
        );
        transition: background-image 0.15s ease;
        overflow: hidden;
      }

      #click-area:active {
        background-image: radial-gradient(
          circle at center,
          rgba(46, 125, 50, 0.22) 0%,
          rgba(46, 125, 50, 0) 62%
        );
      }

      /* Material 分段按钮 */
      .cps-seg {
        display: inline-flex;
        border: 1px solid var(--md-outline);
        border-radius: var(--md-r-full);
        overflow: hidden;
        background: var(--md-surface);
      }

      .cps-seg button {
        border: none;
        background: transparent;
        padding: 10px 22px;
        font-size: 0.8125rem;
        font-weight: 700;
        color: var(--md-on-surface-variant);
        cursor: pointer;
        transition: background 0.2s var(--md-ease);
        position: relative;
        overflow: hidden;
      }

      .cps-seg button + button {
        border-left: 1px solid var(--md-outline);
      }

      .cps-seg button.active {
        background: var(--md-primary-container);
        color: var(--md-primary-dark);
      }

      .cps-stats {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
        pointer-events: none;
      }

      .cps-stat {
        min-width: 130px;
        padding: 20px 26px;
        text-align: center;
        background: var(--md-surface);
        border: 1px solid var(--md-outline-variant);
        border-radius: var(--md-r-lg);
        box-shadow: var(--md-e1);
      }

      .cps-stat b {
        display: block;
        font-size: 2rem;
        font-family: var(--md-font-mono);
        font-weight: 700;
        line-height: 1.2;
      }

      .cps-hint {
        text-align: center;
        pointer-events: none;
      }

      .cps-hint h1 {
        font-size: clamp(2rem, 7vw, 4rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-bottom: 10px;
      }

      .cps-hint p {
        color: var(--md-on-surface-muted);
        font-size: 0.875rem;
        font-weight: 500;
      }

      .click-animation {
        position: fixed;
        pointer-events: none;
        font-weight: 700;
        color: var(--md-primary);
        font-size: 1.05rem;
        animation: floatUp 0.55s ease-out forwards;
      }

      @keyframes floatUp {
        from {
          transform: translateY(0);
          opacity: 1;
        }
        to {
          transform: translateY(-56px);
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <div id="click-area" onclick="handleClick(event)">
      <div class="cps-seg">
        <button id="btn-5" class="active md-ripple" onclick="setMode(5, event)">
          5 秒
        </button>
        <button id="btn-10" class="md-ripple" onclick="setMode(10, event)">
          10 秒
        </button>
      </div>

      <div class="cps-stats">
        <div class="cps-stat">
          <p class="md-label" style="margin-bottom: 6px">剩余时间</p>
          <b id="timer-display">5.0</b>
        </div>
        <div class="cps-stat">
          <p class="md-label" style="margin-bottom: 6px">点击次数</p>
          <b id="count-display">0</b>
        </div>
      </div>

      <div class="cps-hint">
        <h1 id="hint-text">点击屏幕开始</h1>
        <p>在时间结束前尽可能快地点击</p>
      </div>
    </div>

    <!-- 结果对话框 -->
    <div class="md-dialog-scrim" id="result-dialog">
      <div class="md-dialog md-center" role="dialog" aria-modal="true">
        <p class="md-label" style="margin-bottom: 6px">测试结果</p>
        <div
          class="md-mono"
          id="final-cps"
          style="font-size: 3.6rem; font-weight: 700; color: var(--md-primary)"
        >
          0.0
        </div>
        <p class="md-label" style="margin-bottom: 22px">Clicks Per Second</p>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
          <div
            style="
              padding: 16px;
              background: var(--md-surface-container);
              border-radius: 12px;
            "
          >
            <p class="md-label" style="margin-bottom: 4px">总点击</p>
            <b class="md-mono" id="total-clicks">0</b>
          </div>
          <div
            style="
              padding: 16px;
              background: var(--md-primary-soft);
              border-radius: 12px;
            "
          >
            <p class="md-label" style="margin-bottom: 4px">称号</p>
            <b id="rank-name" style="color: var(--md-primary-dark)">新手</b>
          </div>
        </div>

        <button
          class="md-btn md-btn--filled md-btn--block md-btn--lg md-ripple"
          style="margin-top: 22px"
          onclick="resetTest(event)"
        >
          重新开始
        </button>
        <a
          class="md-btn md-btn--text md-btn--block md-ripple"
          style="margin-top: 8px"
          href="./about.html"
          >返回主页</a
        >
      </div>
    </div>

    <script src="./assets/site.js"></script>
    <script src="./assets/nav.js"></script>
    <script>
      var clicks = 0;
      var initialTime = 5;
      var timeLeft = 5;
      var isRunning = false;
      var timer = null;

      var timerDisplay = document.getElementById("timer-display");
      var countDisplay = document.getElementById("count-display");
      var hintText = document.getElementById("hint-text");

      function setMode(sec, e) {
        if (e) e.stopPropagation();
        if (isRunning) return;
        initialTime = sec;
        timeLeft = sec;
        timerDisplay.textContent = sec.toFixed(1);
        document.getElementById("btn-5").classList.toggle("active", sec === 5);
        document.getElementById("btn-10").classList.toggle("active", sec === 10);
      }

      function handleClick(e) {
        if (timeLeft <= 0) return;
        if (!isRunning) startTimer();

        clicks++;
        countDisplay.textContent = clicks;
        hintText.textContent = "继续！保持节奏";

        var particle = document.createElement("div");
        particle.className = "click-animation";
        particle.textContent = "+1";
        particle.style.left = e.clientX + 8 + "px";
        particle.style.top = e.clientY - 8 + "px";
        document.body.appendChild(particle);
        setTimeout(function () {
          particle.remove();
        }, 560);
      }

      function startTimer() {
        isRunning = true;
        var startAt = Date.now();

        timer = setInterval(function () {
          var elapsed = (Date.now() - startAt) / 1000;
          timeLeft = Math.max(0, initialTime - elapsed);
          timerDisplay.textContent = timeLeft.toFixed(1);
          if (timeLeft <= 0) endTest();
        }, 100);
      }

      function endTest() {
        clearInterval(timer);
        isRunning = false;

        var cps = (clicks / initialTime).toFixed(1);
        document.getElementById("final-cps").textContent = cps;
        document.getElementById("total-clicks").textContent = clicks;
        document.getElementById("rank-name").textContent = getRank(cps);
        MD.open("result-dialog");
      }

      function getRank(cps) {
        if (cps < 5) return "🐢 乌龟";
        if (cps < 8) return "🙂 凡人";
        if (cps < 11) return "🐆 猎豹";
        if (cps < 14) return "🐙 触手";
        return "🚀 外挂！";
      }

      function resetTest(e) {
        if (e) e.stopPropagation();
        clicks = 0;
        timeLeft = initialTime;
        isRunning = false;
        countDisplay.textContent = "0";
        timerDisplay.textContent = initialTime.toFixed(1);
        hintText.textContent = "点击屏幕开始";
        MD.close("result-dialog");
      }
    </script>
  </body>
</html>
