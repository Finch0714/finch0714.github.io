name: Continuous Code Formatting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prettier Action
        # 换用这个更稳定的版本
        uses: actions-js/prettier@v1.4.15
        with:
          # 修改为你想要格式化的后缀名
          prettier_options: --write **/*.{html,css,js,json,py}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 自动提交修改
          commit_message: "🎨 style: 自动修复代码格式"
