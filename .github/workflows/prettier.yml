name: Continuous Code Formatting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. 安装 Prettier
      - name: Install Prettier
        run: npm install -g prettier

      # 2. 运行格式化（直接执行命令，绕过 Action 的参数解析坑）
      - name: Run Prettier
        run: npx prettier --write "**/*.{html,css,js,json,py}"

      # 3. 提交变动
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🎨 style: 自动修复代码格式"
