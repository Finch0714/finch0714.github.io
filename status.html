    <style>
      /* ---------- 状态页专用样式 ---------- */

      /* Hero 里的三个统计 */
      .status-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 28px;
        margin-top: 26px;
      }

      .status-stat .md-label {

      .status-stat b {

        color: var(--md-primary-dark);
      }

      .status-actions {

        align-items: center;
        gap: 14px;

      /* 呼吸的在线小圆点 */

        100% {

        }

      /* 横向柱状图卡片 */

        flex-direction: column;
        gap: 12px;

      .gauge__top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;

      .gauge__value {
        font-size: 1.75rem;

      .gauge__value small {

      .fill--danger {

      /* ---------- 竖栏 + 分栏 ---------- */
      .status-layout {
        display: grid;

        gap: 26px;
        align-items: start;
        margin-top: 6px;
      }

      .status-rail {
        position: sticky;
        top: 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 13px 16px;
        border-radius: var(--md-r-sm);
        border: 1px solid var(--md-outline-variant);
        background: var(--md-surface);

        font: inherit;

        font-size: 0.9375rem;

      .status-rail__btn:focus-visible {

    <script>
      /* ----------------------------------------------------------------------
         家庭服务器状态 —— 每次打开都取实时数据（不缓存）

         数据链路：本页 → Tailscale Funnel（HTTPS）→ 家里小主机的 nginx
                   → /var/www/nav/status.json（由 systemd timer 每 10 分钟重写）
         同一份 JSON 里既有机器的状态，也有 AstrBot 的统计（.astrbot 字段）。
         隧道绕美国，单次请求 5~8 秒，所以这里用 30 秒超时并把等待状态显示出来。

         隐私：AstrBot 那部分只有计数与聚合值，页面不做任何会话/用户维度展示。
         ---------------------------------------------------------------------- */
      var STATUS_URL = "https://finch-server.tail36ef08.ts.net/status.json";
      var TIMEOUT_MS = 30000;

      function esc(s) {
        return MD.esc(s);
      }

      /* ---------- 小工具 ---------- */
      function fmtBytes(b) {
        if (typeof b !== "number" || !isFinite(b) || b < 0) return "未知";
        var units = ["B", "KB", "MB", "GB", "TB"];
        var i = 0;
        while (b >= 1024 && i < units.length - 1) {
          b /= 1024;
          i++;
        }
        return (i === 0 ? b : b.toFixed(2)) + " " + units[i];
      }

      function fmtInt(n) {
        if (typeof n !== "number" || !isFinite(n)) return "—";
        return n.toLocaleString("zh-CN");
      }

      function fmtTokens(n) {
        n = Number(n) || 0;
        if (n >= 100000000) return (n / 100000000).toFixed(2) + " 亿";
        if (n >= 10000) return (n / 10000).toFixed(2) + " 万";
        return fmtInt(n);
      }

      function clampPct(v) {
        v = Number(v);
        if (!isFinite(v)) return 0;
        return Math.max(0, Math.min(100, v));
      }

      function levelClass(pct) {
        return pct >= 88
          ? "fill--danger"
          : pct >= 70
            ? "fill--warn"
            : "fill--ok";
      }

      function tempClass(t) {
        return t >= 80 ? "fill--danger" : t >= 65 ? "fill--warn" : "fill--ok";
      }

      function rateClass(pct) {
        return pct >= 95
          ? "fill--ok"
          : pct >= 80
            ? "fill--warn"
            : "fill--danger";
      }

      function fmtLoad(load) {
        if (!load) return "未知";
        var f = function (n) {
          return typeof n === "number" ? n.toFixed(2) : "?";
        };
        return f(load.m1) + " / " + f(load.m5) + " / " + f(load.m15);
      }

      function fmtTime(iso) {
        if (!iso) return "未知";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return String(iso);
        var p = function (n) {
          return (n < 10 ? "0" : "") + n;
        };
        return (
          p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds())
        );
      }

      /* 后端给的是 "2026-09-27 06:20:41" 这种本地时间串，直接截取显示 */
      function fmtStamp(s) {
        if (!s) return "未知";
        var t = String(s).replace("T", " ");
        return t.length >= 16 ? t.slice(5, 16) : t;
      }

      function gaugeCard(o) {
        return (
          '<article class="md-card md-card--elevated md-reveal" style="padding:20px">' +
          '<div class="gauge">' +
          '<div class="gauge__top">' +
          '<span class="md-label">' +
          esc(o.label) +
          "</span>" +
          '<span class="gauge__value md-mono">' +
          esc(o.value) +
          (o.unit ? "<small>" + esc(o.unit) + "</small>" : "") +
          "</span>" +
          "</div>" +
          '<div class="md-progress"><div class="md-progress__fill ' +
          o.fill +
          '" style="width:' +
          o.percent +
          '%"></div></div>' +
          (o.note ? '<p class="gauge__note">' + esc(o.note) + "</p>" : "") +
          "</div></article>"
        );
      }

      /* 没有分母的绝对量卡片：只有大字，没有进度条 */
      function statCard(label, value, unit, note) {
        return (
          '<article class="md-card md-card--elevated md-reveal" style="padding:20px">' +
          '<div class="gauge">' +
          '<span class="md-label">' +
          esc(label) +
          "</span>" +
          '<span class="gauge__value md-mono">' +
          esc(value) +
          (unit ? "<small>" + esc(unit) + "</small>" : "") +
          "</span>" +
          (note ? '<p class="gauge__note">' + esc(note) + "</p>" : "") +
          "</div></article>"
        );
      }

      function specRow(label, value) {
        return (
          '<div class="md-list-item">' +
          '<span class="md-label">' +
          esc(label) +
          "</span>" +
          '<span class="md-mono" style="font-weight:700; text-align:right; user-select:all">' +
          esc(value) +
          "</span>" +
          "</div>"
        );
      }

      /* 横向柱状图：按最大值归一化宽度 */
      function barRows(items, opt) {
        opt = opt || {};
        var max = 1;
        items.forEach(function (it) {
          if (it.value > max) max = it.value;
        });
        return items
          .map(function (it) {
            var pct =
              it.value > 0
                ? Math.max(3, Math.round((it.value / max) * 100))
                : 0;
            var fill = it.value > 0 ? opt.fill || "fill--ok" : "";
            return (
              '<div class="bar-row">' +
              '<span class="bar-row__label">' +
              '<b class="bar-row__name md-mono" title="' +
              esc(it.title || it.label) +
              '">' +
              esc(it.label) +
              "</b>" +
              (it.sub
                ? '<i class="bar-row__sub">' + esc(it.sub) + "</i>"
                : "") +
              "</span>" +
              '<div class="md-progress bar-row__track"><div class="md-progress__fill ' +
              fill +
              '" style="width:' +
              pct +
              '%"></div></div>' +
              '<span class="bar-row__value md-mono' +
              (it.value > 0 ? "" : " bar-row__value--zero") +
              '">' +
              esc(opt.fmt ? opt.fmt(it.value) : it.value) +
              "</span>" +
              "</div>"
            );
          })
          .join("");
      }

      /* ---------- 渲染：服务器 ---------- */
      function render(d) {
        var cpu = d.cpu || {};
        var mem = d.memory || {};
        var disk = d.disk || {};
        var net = d.network || {};
        var ctn = d.containers || {};
        var cpuPct = clampPct(cpu.used_pct);
        var memPct = clampPct(mem.used_pct);
        var diskPct = clampPct(disk.used_pct);
        var temp = Number(cpu.temp_c);

        document.getElementById("host-name").textContent = d.host || "未知主机";
        document.getElementById("host-meta").textContent =
          [d.model, d.os, d.kernel].filter(Boolean).join(" · ") ||
          "家庭服务器实时状态";

        document.getElementById("uptime").textContent =
          d.uptime_human || "未知";
        document.getElementById("load").textContent = fmtLoad(d.load);
        document.getElementById("updated").textContent = fmtTime(d.updated);

        document.getElementById("gauges-chip").textContent =
          (cpu.cores || "?") + " 核";

        document.getElementById("gauges").innerHTML =
          gaugeCard({
            label: "CPU 使用率",
            value: cpuPct,
            unit: " %",
            percent: cpuPct,
            fill: levelClass(cpuPct),
            note: "负载 " + fmtLoad(d.load),
          }) +
          gaugeCard({
            label: "CPU 温度",
            value: isFinite(temp) ? temp : "--",
            unit: " °C",
            percent: clampPct(temp),
            fill: tempClass(temp),
            note: isFinite(temp) && temp >= 80 ? "偏高，注意散热" : "正常范围",
          }) +
          gaugeCard({
            label: "内存占用",
            value: memPct,
            unit: " %",
            percent: memPct,
            fill: levelClass(memPct),
            note: (mem.used_mb || 0) + " / " + (mem.total_mb || 0) + " MB",
          }) +
          gaugeCard({
            label: "根分区占用",
            value: diskPct,
            unit: " %",
            percent: diskPct,
            fill: levelClass(diskPct),
            note:
              ((disk.used_mb || 0) / 1024).toFixed(1) +
              " / " +
              ((disk.total_mb || 0) / 1024).toFixed(1) +
              " GB",
          });

        document.getElementById("kernel-chip").textContent = d.kernel || "—";

        document.getElementById("specs").innerHTML = [
          specRow("主机名", d.host || "未知"),
          specRow("机型", d.model || "未知"),
          specRow("操作系统", d.os || "未知"),
          specRow("内核", d.kernel || "未知"),
          specRow("CPU 核心", (cpu.cores || "?") + " 核"),
          specRow("CPU 温度", isFinite(temp) ? temp + " °C" : "未知"),
          specRow("系统在线时长", d.uptime_human || "未知"),
          specRow("数据时间", fmtTime(d.updated)),
        ].join("");

        document.getElementById("net-chip").textContent = "开机以来累计";
        document.getElementById("net").innerHTML = [
          specRow("累计接收", fmtBytes(net.rx_bytes)),
          specRow("累计发送", fmtBytes(net.tx_bytes)),
        ].join("");

        var names = (ctn.names || []).filter(Boolean);
        document.getElementById("containers-chip").textContent =
          (ctn.running || names.length || 0) + " 个运行中";
        document.getElementById("containers").innerHTML = names.length
          ? names
              .map(function (n) {
                return (
                  '<span class="container-chip"><span class="md-dot"></span>' +
                  esc(n) +
                  "</span>"
                );
              })
              .join("")
          : '<p class="md-body" style="margin:0">没有容器在运行。</p>';

        MD.reveal(document.getElementById("gauges"));

        renderAstrbot(d.astrbot);
      }

      /* ---------- 渲染：AstrBot ---------- */
      var AB_EMPTY =
        '<div class="md-card md-center" style="grid-column:1/-1">' +
        '<p class="md-body" style="margin:0">暂时拿不到 AstrBot 的统计数据。</p></div>';

      function renderAstrbot(ab) {
        var ids = [
          "ab-overview",
          "ab-msg-gauges",
          "ab-llm-gauges",
          "ab-tokens",
          "ab-tech",
        ];
        var bars = [
          "ab-msg-24h",
          "ab-msg-7d",
          "ab-llm-24h",
          "ab-llm-7d",
          "ab-models",
        ];

        if (!ab || !ab.ok) {
          ids.forEach(function (id) {
            var el = document.getElementById(id);
            el.className =
              id === "ab-overview" || id.indexOf("gauges") > -1
                ? "md-grid"
                : "md-list";
            el.innerHTML = AB_EMPTY;
          });
          bars.forEach(function (id) {
            document.getElementById(id).innerHTML = "";
          });
          document.getElementById("ab-version-chip").textContent = "未运行";
          document.getElementById("ab-msg-chip").textContent = "—";
          document.getElementById("ab-llm-chip").textContent = "—";
          document.getElementById("ab-model-chip").textContent = "—";
          document.getElementById("ab-token-chip").textContent = "—";
          document.getElementById("ab-tech-chip").textContent = "—";
          return;
        }

        var msg = ab.message || {};
        var llm = ab.llm || {};
        var plg = ab.plugins || {};
        var conv = ab.conversations || {};
        var models = llm.by_model || [];

        document.getElementById("ab-version-chip").textContent =
          "v" + (ab.version || "?") + (ab.running ? " · 运行中" : " · 未运行");

        /* 概览 */
        document.getElementById("ab-overview").innerHTML = [
          statCard(
            "版本",
            ab.version || "未知",
            "",
            ab.running ? "运行中" : "未运行",
          ),
          statCard(
            "运行时长",
            ab.uptime_human || "未知",
            "",
            "自 AstrBot 启动以来",
          ),
          statCard(
            "内存占用",
            typeof ab.memory_mb === "number" ? ab.memory_mb : "—",
            " MB",
            "AstrBot 进程 RSS",
          ),
          statCard(
            "插件",
            (plg.enabled != null ? plg.enabled : "—") +
              " / " +
              (plg.installed != null ? plg.installed : "—"),
            "",
            "已启用 / 已安装" +
              (plg.disabled ? "（禁用 " + plg.disabled + "）" : ""),
          ),
          statCard("会话数", fmtInt(conv.count), "", "不含任何会话标识"),
          statCard(
            "统计库体积",
            typeof ab.db_mb === "number" ? ab.db_mb : "—",
            " MB",
            "data_v4.db（含 WAL）",
          ),
        ].join("");

        /* 消息量 */
        document.getElementById("ab-msg-chip").textContent =
          "今日 " + fmtInt(msg.today) + " 条";
        document.getElementById("ab-msg-gauges").innerHTML = [
          statCard("今日消息", fmtInt(msg.today), " 条", "今天 00:00 起"),
          statCard(
            "最近一小时",
            fmtInt(msg.last_hour),
            " 条",
            msg.last_bucket_at
              ? "统计到 " + msg.last_bucket_at.slice(11, 16)
              : "",
          ),
          statCard("累计消息", fmtInt(msg.total), " 条", "统计库记录的总量"),
        ].join("");

        document.getElementById("ab-msg-24h").innerHTML = barRows(
          (msg.last24h || []).map(function (o) {
            return { label: o.t, value: o.n, title: o.t + " · " + o.n + " 条" };
          }),
        );
        document.getElementById("ab-msg-7d").innerHTML = barRows(
          (msg.last7d || []).map(function (o) {
            return { label: o.d, value: o.n, title: o.d + " · " + o.n + " 条" };
          }),
        );

        /* 模型调用 */
        var rate = Number(llm.success_rate) || 0;
        var cachePct = Number(llm.cache_hit_pct) || 0;
        document.getElementById("ab-llm-chip").textContent =
          fmtInt(llm.calls_total) + " 次 · 成功 " + rate + "%";
        document.getElementById("ab-llm-gauges").innerHTML = [
          gaugeCard({
            label: "调用成功率",
            value: rate,
            unit: " %",
            percent: clampPct(rate),
            fill: rateClass(rate),
            note:
              "成功 " + fmtInt(llm.completed) + " · 失败 " + fmtInt(llm.error),
          }),
          gaugeCard({
            label: "缓存命中率",
            value: cachePct,
            unit: " %",
            percent: clampPct(cachePct),
            fill: cachePct >= 50 ? "fill--ok" : "fill--warn",
            note: "命中越高越省钱",
          }),
          statCard(
            "平均响应",
            llm.avg_duration_s != null ? llm.avg_duration_s : "—",
            " s",
            "每次调用平均耗时",
          ),
          statCard(
            "今日调用",
            fmtInt(llm.calls_today),
            " 次",
            "按调用发生时间统计",
          ),
        ].join("");

        document.getElementById("ab-llm-24h").innerHTML = barRows(
          (llm.last24h || []).map(function (o) {
            return {
              label: o.t,
              value: o.n,
              title: o.t + " · " + o.n + " 次",
              fill: "fill--info",
            };
          }),
          { fill: "fill--info" },
        );
        document.getElementById("ab-llm-7d").innerHTML = barRows(
          (llm.last7d || []).map(function (o) {
            return { label: o.d, value: o.n, title: o.d + " · " + o.n + " 次" };
          }),
          { fill: "fill--info" },
        );

        /* 各模型 token */
        document.getElementById("ab-model-chip").textContent =
          models.length + " 个模型";
        document.getElementById("ab-models").innerHTML = models.length
          ? barRows(
              models.map(function (m) {
                var total =
                  (Number(m.input_tokens) || 0) +
                  (Number(m.output_tokens) || 0);
                return {
                  label: m.model,
                  title: m.model,
                  sub:
                    fmtInt(m.calls) +
                    " 次 · 平均 " +
                    (m.avg_duration_s != null ? m.avg_duration_s : "?") +
                    " s",
                  value: total,
                };
              }),
              { fmt: fmtTokens, fill: "fill--info" },
            )
          : '<p class="md-body" style="margin:0">还没有模型调用记录。</p>';

        /* 用量明细 */
        var rows = [
          specRow("输入 token（非缓存）", fmtInt(llm.input_tokens)),
          specRow("输入 token（缓存命中）", fmtInt(llm.cached_tokens)),
          specRow("输出 token", fmtInt(llm.output_tokens)),
          specRow("token 合计", fmtInt(llm.total_tokens)),
          specRow("今日 token", fmtInt(llm.tokens_today)),
          specRow("累计调用次数", fmtInt(llm.calls_total) + " 次"),
          specRow("今日调用次数", fmtInt(llm.calls_today) + " 次"),
          specRow("最近一次调用", fmtStamp(llm.last_call_at)),
        ];
        if (Number(llm.avg_ttft_s) > 0) {
          rows.push(specRow("平均首字延迟", llm.avg_ttft_s + " s"));
        }
        document.getElementById("ab-tokens").innerHTML = rows.join("");
        document.getElementById("ab-token-chip").textContent =
          "合计 " + fmtTokens(llm.total_tokens) + " token";

        /* 运行信息 */
        var platforms = (msg.by_platform || [])
          .map(function (p) {
            return p.platform + "（" + fmtInt(p.count) + " 条）";
          })
          .join("、");
        document.getElementById("ab-tech").innerHTML = [
          specRow("运行状态", ab.running ? "运行中" : "未运行"),
          specRow("AstrBot 版本", ab.version || "未知"),
          specRow(
            "进程内存",
            (ab.memory_mb != null ? ab.memory_mb : "—") + " MB",
          ),
          specRow(
            "插件",
            (plg.enabled != null ? plg.enabled : "—") +
              " 启用 / " +
              (plg.installed != null ? plg.installed : "—") +
              " 安装" +
              (plg.disabled ? "（禁用 " + plg.disabled + "）" : ""),
          ),
          specRow("消息平台", platforms || "未知"),
          specRow(
            "会话数",
            fmtInt(conv.count) +
              " 个（累计 " +
              fmtTokens(conv.tokens) +
              " token）",
          ),
          specRow("统计库体积", (ab.db_mb != null ? ab.db_mb : "—") + " MB"),
          specRow("统计生成时间", fmtStamp(ab.generated_at)),
        ].join("");
        document.getElementById("ab-tech-chip").textContent = ab.running
          ? "在线"
          : "离线";

        MD.reveal(document.getElementById("pane-astrbot"));
      }

      /* ---------- 竖栏切换 ---------- */
      function selectTab(name) {
        var isServer = name !== "astrbot";
        var tS = document.getElementById("tab-server");
        var tA = document.getElementById("tab-astrbot");
        tS.classList.toggle("is-active", isServer);
        tA.classList.toggle("is-active", !isServer);
        tS.setAttribute("aria-selected", isServer ? "true" : "false");
        tA.setAttribute("aria-selected", !isServer ? "true" : "false");
        document.getElementById("pane-server").hidden = !isServer;
        document.getElementById("pane-astrbot").hidden = isServer;
        if (!isServer) MD.reveal(document.getElementById("pane-astrbot"));
        try {
          history.replaceState(null, "", isServer ? "#server" : "#astrbot");
        } catch (e) {
          /* file:// 下可能失败，忽略 */
        }
      }

      function initTabs() {
        var tS = document.getElementById("tab-server");
        var tA = document.getElementById("tab-astrbot");
        tS.addEventListener("click", function () {
          selectTab("server");
        });
        tA.addEventListener("click", function () {
          selectTab("astrbot");
        });
        [tS, tA].forEach(function (btn) {
          btn.addEventListener("keydown", function (e) {
            if (
              e.key === "ArrowDown" ||
              e.key === "ArrowUp" ||
              e.key === "ArrowLeft" ||
              e.key === "ArrowRight"
            ) {
              e.preventDefault();
              var next = btn === tS ? tA : tS;
              next.focus();
              selectTab(next === tS ? "server" : "astrbot");
            }
          });
        });
        selectTab(location.hash === "#astrbot" ? "astrbot" : "server");
      }

      /* ---------- 取数 ----------
         站点其它页面已经预热过这份 JSON（见 assets/nav.js 的 warmup），
         所以这里先吃 HTTP 缓存：命中就立刻渲染，再在后台拉一次真正最新的。
         隧道单次要 5~8 秒，因此「800ms 内返回」就足以判定是缓存命中。 */
      var busy = false;

      async function loadStatus(opt) {
        opt = opt || {};
        var useCache = !!opt.cache;
        var background = !!opt.background;
        if (busy) return;
        busy = true;

        var state = document.getElementById("fetch-state");
        var btn = document.getElementById("refresh-btn");
        var dot = document.getElementById("live-dot");
        var liveText = document.getElementById("live-text");

        btn.disabled = true;
        state.textContent = background ? "正在同步最新数据…" : "正在读取实时数据…";
        liveText.textContent = "连接中";

        var ctrl =
          typeof AbortController === "function" ? new AbortController() : null;
        var timer = setTimeout(function () {
          if (ctrl) ctrl.abort();
        }, TIMEOUT_MS);
        var t0 = Date.now();
        var needLive = false;

        try {
          var res = await fetch(STATUS_URL, {
            cache: useCache ? "default" : "no-store",
            signal: ctrl ? ctrl.signal : undefined,
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          var data = await res.json();
          var fromCache = useCache && Date.now() - t0 < 800;

          render(data);

          dot.classList.remove("live-dot--off");
          liveText.textContent = fromCache ? "缓存" : "实时";
          if (fromCache) {
            state.textContent = "已显示缓存数据，正在同步最新…";
            needLive = true;
          } else {
            state.textContent = "刚刚更新 · 数据由小主机每 10 分钟重写一次";
          }
        } catch (e) {
          console.error("读取服务器状态失败:", e);
          dot.classList.add("live-dot--off");
          liveText.textContent = "离线";
          state.textContent = "读取失败，点「刷新」重试";
          document.getElementById("host-name").textContent = "暂时连不上";
          document.getElementById("host-meta").textContent =
            "小主机可能正在重启、离线，或隧道断了（数据全程经 Tailscale 隧道）。";
          document.getElementById("gauges").innerHTML =
            '<div class="md-card md-center" style="grid-column:1/-1"><p class="md-body" style="margin:0">拿不到状态数据，稍后再试。</p></div>';
          renderAstrbot(null);
        } finally {
          clearTimeout(timer);
          btn.disabled = false;
          busy = false;
        }

        /* 缓存命中就再悄悄拉一次最新的（此刻 busy 已释放，不会被拦掉） */
        if (needLive) loadStatus({ background: true });
      }

      document.getElementById("year").textContent = new Date().getFullYear();
      document
        .getElementById("refresh-btn")
        .addEventListener("click", function () {
          /* 手动点刷新始终绕过缓存 */
          loadStatus();
        });
      initTabs();
      loadStatus({ cache: true });
    </script>
  </body>
</html>
