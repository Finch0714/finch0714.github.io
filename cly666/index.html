<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>正在跳转…</title>
    <meta name="robots" content="noindex, follow" />
    <!-- GitHub Pages 是纯静态托管，没有服务端 302 —— 只能用客户端跳转。
         <meta refresh> 是给禁了 JS 的情况兜底，正常情况下 script 先跑。 -->
    <meta
      http-equiv="refresh"
      content="0; url=https://ai-alpha-real-7sjf6dxfzkvfqnn2c549qz.streamlit.app/"
    />
    <script>
      /* replace 而不是 assign：不在历史里留这一页，按「后退」不会来回跳 */
      window.location.replace(
        "https://ai-alpha-real-7sjf6dxfzkvfqnn2c549qz.streamlit.app/",
      );
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0d1110;
        color: #e6e6e6;
        font:
          15px/1.6 system-ui,
          -apple-system,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        text-align: center;
        padding: 24px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #4caf50;
        animation: pulse 1.1s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.9);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }

      a {
        color: #7bd88f;
      }

      .muted {
        opacity: 0.55;
        font-size: 13px;
      }

      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <span class="dot"></span>
    <p>正在跳转到 <b>cly666</b>…</p>
    <p class="muted">
      没有自动跳？<a href="https://ai-alpha-real-7sjf6dxfzkvfqnn2c549qz.streamlit.app/"
        >点这里</a
      >
    </p>
    <noscript>
      <p class="muted">当前浏览器禁用了 JavaScript，请点上方的链接。</p>
    </noscript>
  </body>
</html>
