<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SYSTEM ACCESS | THE MACHINE</title>
    <link rel="icon" type="image/png" sizes="64x64" href="Favicon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- 原来这里加载的是 Tailwind 的 Play CDN（cdn.tailwindcss.com）——
         那是「浏览器内实时编译」版，实测 398KB，官方明确标注不要用于生产：
         它会阻塞解析、然后在浏览器里现场编译 CSS，首屏要 2 秒多。
         本页实际只用到下面这一组工具类，这里把等价 CSS 直接写出来，
         去掉整包依赖（净省约 398KB，且不再依赖国外 CDN）。 -->
    <style>
      /* ---- 基础重置：等价于 Tailwind preflight 中本页会用到的部分 ---- */
      *,
      ::before,
      ::after {
        box-sizing: border-box;
        border-width: 0;
        border-style: solid;
        border-color: #e5e7eb;
      }

      html {
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        line-height: inherit;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        margin: 0;
        font-size: inherit;
        font-weight: inherit;
      }

      p {
        margin: 0;
      }

      button {
        margin: 0;
        padding: 0;
        font-family: inherit;
        font-size: 100%;
        font-weight: inherit;
        line-height: inherit;
        color: inherit;
        text-transform: none;
        background-color: transparent;
        background-image: none;
        cursor: pointer;
        -webkit-appearance: button;
      }

      /* ---- 本页用到的工具类 ---- */
      /* 布局 */
      .absolute { position: absolute; }
      .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
      .flex { display: flex; }
      .hidden { display: none; }
      .items-center { align-items: center; }
      .justify-between { justify-content: space-between; }
      .justify-center { justify-content: center; }

      /* 尺寸 */
      .w-full { width: 100%; }
      .w-0 { width: 0; }
      .h-full { height: 100%; }
      .h-1 { height: 0.25rem; }

      /* 间距 */
      .mt-4 { margin-top: 1rem; }
      .mt-12 { margin-top: 3rem; }
      .pt-6 { padding-top: 1.5rem; }
      .pb-2 { padding-bottom: 0.5rem; }
      .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
      .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
      .space-y-1 > * + * { margin-top: 0.25rem; }
      .space-y-2 > * + * { margin-top: 0.5rem; }
      .space-y-6 > * + * { margin-top: 1.5rem; }

      /* 文字 */
      .text-\[9px\] { font-size: 9px; }
      .text-\[10px\] { font-size: 10px; }
      .text-xs { font-size: 0.75rem; line-height: 1rem; }
      .text-2xl { font-size: 1.5rem; line-height: 2rem; }
      .font-bold { font-weight: 700; }
      .italic { font-style: italic; }
      .uppercase { text-transform: uppercase; }
      .text-center { text-align: center; }
      .tracking-tighter { letter-spacing: -0.05em; }
      .tracking-wider { letter-spacing: 0.05em; }
      .tracking-widest { letter-spacing: 0.1em; }
      .tracking-\[0\.2em\] { letter-spacing: 0.2em; }

      /* 颜色 */
      .text-white { color: #fff; }
      .text-black { color: #000; }
      .text-red-500 { color: #ef4444; }
      .text-yellow-500 { color: #eab308; }
      .text-gray-500 { color: #6b7280; }
      .bg-red-600 { background-color: #dc2626; }
      .bg-gray-900 { background-color: #111827; }

      /* 描边 */
      .border { border-width: 1px; }
      .border-b { border-bottom-width: 1px; }
      .border-red-600 { border-color: #dc2626; }
      .border-red-900 { border-color: #7f1d1d; }

      /* 动效 */
      .transition-all {
        transition-property: all;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 150ms;
      }
      .duration-700 { transition-duration: 700ms; }
      .animate-pulse { animation: tw-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      @keyframes tw-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      /* 交互态 */
      .hover\:bg-red-600:hover { background-color: #dc2626; }
      .active\:scale-95:active { transform: scale(0.95); }
    </style>
    <style>
      :root {
        --poi-red: #ff0000;
        --poi-yellow: #ffcc00;
        --poi-bg: #050505;
      }

      body {
        background-color: var(--poi-bg);
        color: white;
        font-family: "Courier New", Courier, monospace;
        overflow: hidden;
        height: 100vh;
        perspective: 1000px;
      }

      /* 扫描线 */
      body::before {
        content: " ";
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background:
          linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
          linear-gradient(
            90deg,
            rgba(255, 0, 0, 0.05),
            rgba(0, 255, 0, 0.02),
            rgba(0, 0, 255, 0.05)
          );
        background-size:
          100% 4px,
          3px 100%;
        z-index: 100;
        pointer-events: none;
      }

      .scene {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .machine-card {
        width: 400px;
        padding: 2rem;
        background: rgba(15, 15, 15, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.05);
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.1s ease-out;
      }

      /* 💡 修复后的捕捉框：物理定位四个 L 型角 */
      .target-box {
        position: absolute;
        width: 140px;
        height: 140px;
        top: -70px;
        left: 50%;
        transform: translateX(-50%) translateZ(60px);
        animation: pulse-target 2.5s infinite;
      }

      /* L 型角通用样式 */
      .corner {
        position: absolute;
        width: 25px;
        height: 25px;
        border: 3px solid var(--poi-yellow);
      }
      .top-left {
        top: 0;
        left: 0;
        border-right: 0;
        border-bottom: 0;
      }
      .top-right {
        top: 0;
        right: 0;
        border-left: 0;
        border-bottom: 0;
      }
      .bottom-left {
        bottom: 0;
        left: 0;
        border-right: 0;
        border-top: 0;
      }
      .bottom-right {
        bottom: 0;
        right: 0;
        border-left: 0;
        border-top: 0;
      }

      @keyframes pulse-target {
        0%,
        100% {
          transform: translateX(-50%) translateZ(60px) scale(1);
          opacity: 1;
        }
        50% {
          transform: translateX(-50%) translateZ(60px) scale(1.08);
          opacity: 0.7;
        }
      }

      .cursor {
        display: inline-block;
        width: 10px;
        height: 1.2em;
        background: var(--poi-red);
        margin-left: 5px;
        animation: blink 1s infinite;
        vertical-align: middle;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene" id="scene">
      <div class="machine-card" id="card">
        <div class="target-box">
          <div class="corner top-left"></div>
          <div class="corner top-right"></div>
          <div class="corner bottom-left"></div>
          <div class="corner bottom-right"></div>
          <div
            class="absolute inset-0 flex items-center justify-center text-[10px] text-yellow-500 font-bold tracking-tighter uppercase"
          >
            Access Detected
          </div>
        </div>

        <div class="mt-12 space-y-6">
          <div
            class="flex justify-between items-center border-b border-red-900 pb-2 text-[10px]"
          >
            <span class="text-red-500 font-bold uppercase tracking-wider"
              >The Machine: Active</span
            >
            <span class="bg-red-600 px-2 text-black font-bold">SAFE</span>
          </div>

          <div class="space-y-1">
            <p class="text-[10px] text-gray-500 italic">IDENTIFICATION:</p>
            <h1
              class="text-2xl font-bold tracking-widest uppercase text-white"
              id="typed-name"
            ></h1>
          </div>

          <div class="pt-6">
            <button
              id="init-btn"
              onclick="startSequence()"
              class="w-full border border-red-600 py-3 hover:bg-red-600 transition-all text-xs tracking-[0.2em] font-bold text-white active:scale-95"
            >
              Enter
            </button>
            <div id="loader" class="hidden mt-4 space-y-2">
              <div class="w-full bg-gray-900 h-1">
                <div
                  id="bar"
                  class="bg-red-600 h-full w-0 transition-all duration-700"
                ></div>
              </div>
              <p
                class="text-[9px] text-red-500 animate-pulse uppercase text-center font-bold"
              >
                Establishing Secure Connection...
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const card = document.getElementById("card");
      const typedName = document.getElementById("typed-name");
      const nameText = "IRRELEVANT_GUEST";

      // 💡 新增：锁机制
      let isProcessing = false;

      let i = 0;
      function typeWriter() {
        if (i < nameText.length) {
          typedName.innerHTML += nameText.charAt(i);
          i++;
          setTimeout(typeWriter, 120);
        } else {
          typedName.innerHTML += '<span class="cursor"></span>';
        }
      }
      window.onload = typeWriter;

      document.addEventListener("mousemove", (e) => {
        const xAxis = (window.innerWidth / 2 - e.pageX) / 20;
        const yAxis = (window.innerHeight / 2 - e.pageY) / 20;
        card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
      });

      // 💡 修复：添加防抖逻辑
      function startSequence() {
        if (isProcessing) return; // 如果已经在处理中，直接忽略后续点击
        isProcessing = true; // 上锁

        const btn = document.getElementById("init-btn");
        const loader = document.getElementById("loader");
        const bar = document.getElementById("bar");

        btn.classList.add("hidden");
        loader.classList.remove("hidden");

        setTimeout(() => {
          bar.style.width = "100%";
        }, 100);

        // 跳转逻辑
        setTimeout(() => {
          window.location.href = "about.html";
        }, 1600);
      }
    </script>
  </body>
</html>
