<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>夯到拉排行生成器 · Finch0714</title>
    <meta
      name="description"
      content="拖拽排序生成「夯 → 拉完了」五档排行榜，一键导出 4K 高清图。"
    />
    <link rel="icon" type="image/png" sizes="64x64" href="Favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- 依赖已全部自托管：原来走 jsdelivr，国内经常连不上，
         一旦拉不到，拖拽和导出就直接瘫痪（不是变慢，是不能用）。
         拖拽要立刻可用所以 defer 加载；html2canvas 只有点「保存高清图」才需要，
         仍然是点击时按需加载，不拖累首屏 -->
    <script defer src="./assets/sortable.min.js"></script>
    <link rel="stylesheet" href="./assets/md.css" />
    <!-- 字体：霞鹜文楷 Bright Medium（208 个 unicode-range 分片）
         样式表已自托管（assets/lxgw-bright.css），只为省掉第三方 CDN 的 307 跳转
         —— 那一跳实测要 1.4~4.7 秒；字体分片本身仍按需向原图床取用到的几个。
         非阻塞加载：media=print 先挂起，下载完自动切回 all，不挡首屏绘制 -->
    <link
      rel="preconnect"
      href="https://ik.imagekit.io"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="./assets/lxgw-bright.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="./assets/lxgw-bright.css"
      />
    </noscript>
    <style>
      /* 导出区域：白底，保证截图好看 */
      #capture-area {
        /* 用 flex 伸缩而不是 width:100%：这样右侧能留出字体选择器的位置，
           窄屏放不下时选择器会自动换到下面一行 */
        flex: 1 1 560px;
        min-width: 0;
        max-width: 860px;
        background: #fff;
        border: 1px solid var(--md-outline-variant);
        border-radius: var(--md-r-md);
        overflow: hidden;
      }

      .tier-row {
        display: flex;
        min-height: 88px;
        align-items: stretch;
        border-bottom: 1px solid var(--md-outline-variant);
      }

      .tier-row:last-child {
        border-bottom: none;
      }

      .tier-label {
        width: 84px;
        min-width: 84px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        color: #1a1c1a;
        font-size: 0.9375rem;
        text-align: center;
        padding: 10px 5px;
      }

      .tier-content {
        flex-grow: 1;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        padding: 10px;
        gap: 8px;
        min-height: 88px;
        background: #fbfdfb;
        transition: background 0.2s var(--md-ease);
      }

      .sortable-ghost {
        opacity: 0.4;
        background: var(--md-primary-container) !important;
      }

      /* 档位配色（保留经典排行配色） */
      .tier-夯 {
        background-color: #ff4b4b;
      }
      .tier-顶级 {
        background-color: #ff9f1c;
      }
      .tier-人上人 {
        background-color: #ffcf33;
      }
      .tier-NPC {
        background-color: #ffeb99;
      }
      .tier-拉完了 {
        background-color: #e5e7eb;
      }

      .item {
        width: 78px;
        height: auto;
        max-height: 190px;
        object-fit: contain;
        border-radius: 6px;
        cursor: grab;
        touch-action: none;
        background: var(--md-surface-container);
        border: 1px solid var(--md-outline-variant);
      }

      #file-input {
        display: none;
      }

      /* 待分配区 + 右侧的「描述字体」选择器 */
      .pool-wrap {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 18px;
        margin-top: 26px;
      }

      .pool-container {
        flex: 1 1 560px;
        min-width: 0;
        max-width: 860px;
        padding: 18px;
        border: 2px dashed var(--md-primary-container);
        border-radius: var(--md-r-md);
        background: var(--md-primary-tint);
      }

      #pool {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-height: 96px;
      }

      /* ---- 图片 + 描述 组合成「一格」 ----
         每张图都包在 .item-wrap 里，描述写在图片下方。
         拖动和删除针对的都是这一整格，所以描述会跟着图片一起移动。 */
      .item-wrap {
        width: 78px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: grab;
        /* 关掉移动端长按弹出的原生菜单（存图/拷贝图片），
           免得跟我们自己的长按菜单打架 */
        -webkit-touch-callout: none;
        user-select: none;
      }

      .item-wrap .item {
        width: 100%;
        cursor: inherit;
      }

      /* 图片下方的描述文字。字体由右侧选择器决定：
         默认跟网站一致（霞鹜文楷），也可以切成系统字体 */
      .item-desc,
      .item-input {
        font-family: var(--md-font);
      }

      .item-desc {
        width: 100%;
        font-size: 11px;
        line-height: 1.3;
        font-weight: 500;
        color: #1a1c1a;
        text-align: center;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      /* 「添加描述」时的行内输入框：就开在图片下方，不用浏览器弹窗 */
      .item-input {
        width: 100%;
        padding: 3px 4px;
        font-size: 11px;
        line-height: 1.3;
        text-align: center;
        color: #1a1c1a;
        background: #fff;
        border: 1px solid var(--md-primary);
        border-radius: 4px;
        outline: none;
        box-shadow: 0 0 0 2px var(--md-primary-soft);
      }

      /* 没写描述就不占位置 */
      .item-desc:empty {
        display: none;
      }

      /* 切到系统字体时挂在 body 上，这样「待分配区」和「排行榜区」的
         描述字体保持一致（导出区域是 body 的子节点，所以也跟着变） */
      body.font-system .item-desc,
      body.font-system .item-input {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          "PingFang SC", "Hiragino Sans GB", sans-serif;
      }

      /* ---- 排行榜 + 右侧控制栏 ---- */
      .board-wrap {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 18px;
      }

      .board-side {
        /* 固定宽度：不给固定值的话，里面的说明文字会把它撑到 600px+，
           结果被挤到排行榜下面去 */
        flex: 0 0 176px;
        width: 176px;
        padding: 14px 16px;
        background: var(--md-surface);
        border: 1px solid var(--md-outline-variant);
        border-radius: var(--md-r-md);
        text-align: left;
      }

      .board-side select {
        width: 100%;
        margin-top: 8px;
        padding: 8px 10px;
        font: inherit;
        font-size: 0.875rem;
        color: var(--md-on-surface);
        background: var(--md-surface);
        border: 1px solid var(--md-outline);
        border-radius: var(--md-r-sm);
        cursor: pointer;
      }

      /* ---- 图片右键菜单 ---- */
      .ctx-menu {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 3000;
        display: none;
        min-width: 136px;
        padding: 6px;
        background: var(--md-surface);
        border: 1px solid var(--md-outline-variant);
        border-radius: var(--md-r-sm);
        box-shadow: var(--md-e4);
      }

      .ctx-menu.is-open {
        display: block;
      }

      .ctx-menu__item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 9px 12px;
        font: inherit;
        font-size: 0.875rem;
        text-align: left;
        color: var(--md-on-surface);
        background: transparent;
        border: none;
        border-radius: var(--md-r-xs);
        cursor: pointer;
      }

      .ctx-menu__item:hover {
        background: var(--md-primary-soft);
        color: var(--md-primary-dark);
      }

      .ctx-menu__item--danger:hover {
        background: #fdecea;
        color: var(--md-error);
      }
    </style>
  </head>

  <body>
    <main class="md-page">
      <div class="md-container md-center">
        <section class="md-hero md-anim" style="text-align: left">
          <span class="md-hero__badge"
            ><span class="md-dot"></span>TIER LIST</span
          >
          <h1 class="md-display md-hero__title">从夯到拉排行生成器</h1>
          <p class="md-hero__desc">
            添加图片后把它们拖进下面的档位，排好后一键导出高清大图，直接发出去。
          </p>
        </section>

        <div class="md-row" style="margin: 4px 0 26px">
          <label
            for="file-input"
            class="md-btn md-btn--filled md-btn--lg md-ripple"
          >
            ＋ 添加图片
          </label>
          <input
            type="file"
            id="file-input"
            multiple
            accept="image/*"
            onchange="handleFiles(this.files)"
          />
          <button
            class="md-btn md-btn--tonal md-btn--lg md-ripple btn-download"
            onclick="downloadRank()"
          >
            ⬇ 保存高清图
          </button>
        </div>

        <div class="board-wrap">
          <div id="capture-area">
            <div class="tier-row">
              <div class="tier-label tier-夯">夯</div>
              <div class="tier-content tier-list"></div>
            </div>
            <div class="tier-row">
              <div class="tier-label tier-顶级">顶级</div>
              <div class="tier-content tier-list"></div>
            </div>
            <div class="tier-row">
              <div class="tier-label tier-人上人">人上人</div>
              <div class="tier-content tier-list"></div>
            </div>
            <div class="tier-row">
              <div class="tier-label tier-NPC">NPC</div>
              <div class="tier-content tier-list"></div>
            </div>
            <div class="tier-row">
              <div class="tier-label tier-拉完了">拉完了</div>
              <div class="tier-content tier-list"></div>
            </div>
          </div>
        </div>

        <!-- 待分配区 + 右侧的「描述字体」选择器
             （选择器在 capture-area 外面，所以不会被截进导出的图片里） -->
        <div class="pool-wrap">
          <div class="pool-container" style="text-align: left">
            <p class="md-label" style="margin-bottom: 12px">
              待分配图片 · 移动端按住约 0.2 秒可拖动，按住 0.7 秒弹出菜单
            </p>
            <div id="pool" class="tier-list"></div>
          </div>

          <aside class="board-side">
            <p class="md-label" style="margin: 0">描述字体</p>
            <select id="desc-font" aria-label="图片描述文字字体">
              <option value="site">网站字体（霞鹜文楷）</option>
              <option value="system">系统字体</option>
            </select>
            <p class="md-body" style="margin: 12px 0 0; font-size: 0.8125rem">
              右键图片可以「添加描述」或「删除」。
            </p>
          </aside>
        </div>
      </div>

      <footer class="md-footer">
        <p style="margin: 0">© <span id="year"></span> Finch0714</p>
      </footer>
    </main>

    <!-- 图片右键菜单（挂在 body 上，不在 capture-area 里，导出时不会带上它） -->
    <div class="ctx-menu" id="ctx-menu" role="menu" aria-hidden="true">
      <button class="ctx-menu__item" type="button" data-act="desc">
        ✏️ 添加描述
      </button>
      <button
        class="ctx-menu__item ctx-menu__item--danger"
        type="button"
        data-act="del"
      >
        🗑️ 删除
      </button>
    </div>

    <script src="./assets/site.js"></script>
    <script src="./assets/nav.js"></script>
    <script>
      /* CDN 脚本用了 defer，必须等 DOM 就绪后再初始化拖拽 */
      document.addEventListener("DOMContentLoaded", function () {
        if (typeof Sortable === "undefined") return;
        document.querySelectorAll(".tier-list").forEach(function (el) {
          new Sortable(el, {
            group: "shared",
            animation: 150,
            ghostClass: "sortable-ghost",
            fallbackTolerance: 3,
            delay: 100,
            delayOnTouchOnly: true,
          });
        });
      });

      /* ==========================================================
         每一格 = 图片 + 下方描述
         包成 .item-wrap 之后再交给 Sortable，拖动/删除针对的都是整格，
         描述自然会跟着图片一起移动；导出时也一起进截图。
         ========================================================== */
      function createCell(src) {
        var wrap = document.createElement("div");
        wrap.className = "item-wrap";

        var img = document.createElement("img");
        img.src = src;
        img.className = "item";
        img.alt = "";
        /* 关掉浏览器原生的图片拖拽，免得跟 Sortable 的拖动打架 */
        img.draggable = false;

        var desc = document.createElement("div");
        desc.className = "item-desc";

        wrap.appendChild(img);
        wrap.appendChild(desc);
        return wrap;
      }

      function handleFiles(files) {
        var pool = document.getElementById("pool");
        Array.prototype.forEach.call(files, function (file) {
          var reader = new FileReader();
          reader.onload = function (e) {
            pool.appendChild(createCell(e.target.result));
          };
          reader.readAsDataURL(file);
        });
      }

      /* ==========================================================
         右键菜单：删除 / 添加描述
         ========================================================== */
      var ctxMenu = document.getElementById("ctx-menu");
      var ctxCell = null; /* 当前右键点中的那一格 */

      function openCtxMenu(x, y, cell) {
        ctxCell = cell;
        /* 先显示出来才量得到尺寸，才能判断会不会超出视口 */
        ctxMenu.classList.add("is-open");
        ctxMenu.setAttribute("aria-hidden", "false");

        var r = ctxMenu.getBoundingClientRect();
        var left = Math.max(8, Math.min(x, window.innerWidth - r.width - 8));
        var top = Math.max(8, Math.min(y, window.innerHeight - r.height - 8));
        ctxMenu.style.left = left + "px";
        ctxMenu.style.top = top + "px";
      }

      function closeCtxMenu() {
        if (!ctxMenu.classList.contains("is-open")) return;
        ctxMenu.classList.remove("is-open");
        ctxMenu.setAttribute("aria-hidden", "true");
        ctxCell = null;
      }

      /* 只在图片上拦截右键；其他地方保留浏览器自带菜单 */
      document.addEventListener("contextmenu", function (e) {
        var cell = e.target.closest ? e.target.closest(".item-wrap") : null;
        if (!cell) return;
        e.preventDefault();
        openCtxMenu(e.clientX, e.clientY, cell);
      });

      ctxMenu.addEventListener("click", function (e) {
        /* 长按弹菜单时手指正压在菜单上，抬手可能带出一个 click，
           这里先吞掉，避免误触到「删除」 */
        if (ignoreNextCtxClick) {
          ignoreNextCtxClick = false;
          return;
        }
        var btn = e.target.closest ? e.target.closest("[data-act]") : null;
        if (!btn || !ctxCell) return;

        var act = btn.getAttribute("data-act");
        var cell = ctxCell;
        closeCtxMenu();

        /* 删除：整格（图片 + 描述）一起去掉 */
        if (act === "del") {
          cell.remove();
          return;
        }

        /* 添加描述：直接在图片下方开一个行内输入框，不再是浏览器弹窗 */
        if (act === "desc") startDescEdit(cell);
      });

      /* 点别处 / 按 Esc / 滚动，都收掉菜单 */
      document.addEventListener("pointerdown", function (e) {
        if (!ctxMenu.contains(e.target)) closeCtxMenu();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeCtxMenu();
      });
      window.addEventListener("scroll", closeCtxMenu, { passive: true });
      window.addEventListener("resize", closeCtxMenu);

      /* ==========================================================
         添加描述：在图片正下方开一个行内输入框
         Enter 保存 / 点别处自动保存 / Esc 取消
         ========================================================== */
      function startDescEdit(cell) {
        if (cell.querySelector(".item-input")) {
          cell.querySelector(".item-input").focus();
          return;
        }
        var desc = cell.querySelector(".item-desc");
        if (!desc) return;

        var input = document.createElement("input");
        input.type = "text";
        input.className = "item-input";
        input.value = desc.textContent || "";
        input.placeholder = "写点描述";
        input.maxLength = 60;
        input.setAttribute("aria-label", "图片描述");

        /* 插在图片和描述之间 —— 也就是「图片下方」 */
        cell.insertBefore(input, desc);
        input.focus();
        try {
          input.setSelectionRange(input.value.length, input.value.length);
        } catch (err) {}

        var done = false;
        function commit(save) {
          if (done) return;
          done = true;
          if (save) desc.textContent = input.value.trim();
          if (input.parentNode) input.remove();
        }

        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            commit(true);
            input.blur();
          } else if (e.key === "Escape") {
            e.preventDefault();
            commit(false);
          }
        });
        /* 点到别处就保存 */
        input.addEventListener("blur", function () {
          commit(true);
        });
        /* 拖动、长按菜单都别在编辑时插一脚 */
        input.addEventListener("pointerdown", function (e) {
          e.stopPropagation();
        });
        input.addEventListener("contextmenu", function (e) {
          e.stopPropagation();
        });
      }

      /* 导出前先把没保存完的输入框落定，免得把输入框截进图里 */
      function commitOpenEditors() {
        Array.prototype.forEach.call(
          document.querySelectorAll(".item-input"),
          function (inp) {
            inp.blur();
          },
        );
      }

      /* ==========================================================
         移动端：按住不动 0.7 秒 = 弹出菜单
         手指一旦移动超过 10px 就当成拖拽/滚动，立刻取消，
         所以不会和「按住 0.2 秒拖动」的手势抢
         ========================================================== */
      var LONG_PRESS_MS = 700;
      var LONG_PRESS_SLOP = 10; /* 允许的抖动像素 */
      var pressTimer = null;
      var pressOrigin = null;
      var pressCell = null;
      var ignoreNextCtxClick = false;

      function clearLongPress() {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
        }
        pressOrigin = null;
        pressCell = null;
      }

      document.addEventListener(
        "touchstart",
        function (e) {
          /* 新手势开始，解除上一次的防误触 */
          ignoreNextCtxClick = false;

          var cell = e.target.closest ? e.target.closest(".item-wrap") : null;
          if (!cell) return;
          /* 编辑描述时不长按 */
          if (e.target.classList && e.target.classList.contains("item-input")) {
            return;
          }
          if (e.touches.length !== 1) return; /* 双指缩放等不处理 */

          var t = e.touches[0];
          pressCell = cell;
          pressOrigin = { x: t.clientX, y: t.clientY };
          if (pressTimer) clearTimeout(pressTimer);
          pressTimer = setTimeout(function () {
            pressTimer = null;
            if (!pressCell || !pressOrigin) return;
            openCtxMenu(pressOrigin.x, pressOrigin.y, pressCell);
            /* 抬手可能带出 click，吞掉一次避免误触菜单项 */
            ignoreNextCtxClick = true;
            if (navigator.vibrate) navigator.vibrate(12);
            pressCell = null;
            pressOrigin = null;
          }, LONG_PRESS_MS);
        },
        { passive: true },
      );

      document.addEventListener(
        "touchmove",
        function (e) {
          if (!pressTimer || !pressOrigin) return;
          var t = e.touches[0];
          if (!t) return;
          var dx = t.clientX - pressOrigin.x;
          var dy = t.clientY - pressOrigin.y;
          if (dx * dx + dy * dy > LONG_PRESS_SLOP * LONG_PRESS_SLOP) {
            clearLongPress(); /* 在拖/滚，不是长按 */
          }
        },
        { passive: true },
      );

      document.addEventListener("touchend", clearLongPress, { passive: true });
      document.addEventListener("touchcancel", clearLongPress, {
        passive: true,
      });

      /* ==========================================================
         描述文字的字体：网站字体 / 系统字体
         切换的是 #capture-area 上的 class，导出时 html2canvas 会照搬，
         所以效果图里的字体会跟着变。
         ========================================================== */
      var FONT_KEY = "rank-desc-font";
      var fontSel = document.getElementById("desc-font");
      var captureArea = document.getElementById("capture-area");

      function applyDescFont(mode) {
        /* 挂在 body 上，待分配区和排行榜区一起变 */
        document.body.classList.toggle("font-system", mode === "system");
      }

      try {
        var savedFont = localStorage.getItem(FONT_KEY);
        if (savedFont === "site" || savedFont === "system") {
          fontSel.value = savedFont;
        }
      } catch (err) {
        /* 隐私模式下 localStorage 可能不可用，忽略即可 */
      }
      applyDescFont(fontSel.value);

      fontSel.addEventListener("change", function () {
        applyDescFont(fontSel.value);
        try {
          localStorage.setItem(FONT_KEY, fontSel.value);
        } catch (err) {}
      });

      async function downloadRank() {
        var area = document.getElementById("capture-area");
        var btn = document.querySelector(".btn-download");
        var original = btn.textContent;

        btn.textContent = "生成中（4K 采样）...";
        btn.disabled = true;

        /* 正在写描述的话先存下来，别把输入框截进图里 */
        commitOpenEditors();

        try {
          await ensureHtml2Canvas();

          /* 等一帧，确保浏览器渲染完成 */
          await new Promise(function (resolve) {
            setTimeout(resolve, 300);
          });

          var canvas = await html2canvas(area, {
            backgroundColor: "#ffffff",
            scale: 4,
            useCORS: true,
            logging: false,
            allowTaint: true,
            windowWidth: area.scrollWidth,
            windowHeight: area.scrollHeight,
          });

          var link = document.createElement("a");
          link.download = "Rank-4K-" + Date.now() + ".png";
          link.href = canvas.toDataURL("image/png", 1.0);
          link.click();
        } catch (err) {
          alert("生成失败，建议减少图片数量或尝试手动截屏");
          console.error(err);
        } finally {
          btn.textContent = original;
          btn.disabled = false;
        }
      }

      /* html2canvas 按需加载：点导出时才去下载，首屏不用等它 */
      function ensureHtml2Canvas() {
        return new Promise(function (resolve, reject) {
          if (typeof html2canvas !== "undefined") return resolve();
          var s = document.createElement("script");
          s.src = "./assets/html2canvas.min.js";
          s.onload = function () {
            resolve();
          };
          s.onerror = function () {
            reject(new Error("html2canvas 加载失败"));
          };
          document.head.appendChild(s);
        });
      }

      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
