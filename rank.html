<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>夯到拉排行生成器 · Finch0714</title>
    <meta
      name="description"
      content="拖拽排序生成「夯 → 拉完了」五档排行榜，一键导出 4K 高清图。"
    />
    <link rel="icon" type="image/png" href="Favicon.png" />
    <!-- 拖拽要立刻可用，所以 defer 加载；html2canvas 只有点「保存高清图」才需要，
         改成点击时按需加载，别让它拖住整个页面 -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"
    ></script>
    <link rel="stylesheet" href="./assets/md.css" />
    <!-- 字体：霞鹜文楷 Bright Medium（中文网字计划 CDN，按 unicode-range 分片）
         非阻塞加载：media=print 先挂起，下载完自动切回 all，不挡首屏绘制 -->
    <link
      rel="preconnect"
      href="https://cn-font.claude-code-best.win"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://cn-font.claude-code-best.win/packages/lxgwwenkaibright/dist/LXGWBright-Medium/result.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cn-font.claude-code-best.win/packages/lxgwwenkaibright/dist/LXGWBright-Medium/result.css"
      />
    </noscript>
    <style>
      /* 导出区域：白底，保证截图好看 */
      #capture-area {
        width: 100%;
        max-width: 860px;
        background: #fff;
        border: 1px solid var(--md-outline-variant);
        border-radius: var(--md-r-md);
        overflow: hidden;
      }

      .tier-row {
        display: flex;
        min-height: 88px;
        align-items: stretch;
        border-bottom: 1px solid var(--md-outline-variant);
      }

      .tier-row:last-child {
        border-bottom: none;
      }

      .tier-label {
        width: 84px;
        min-width: 84px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        color: #1a1c1a;
        font-size: 0.9375rem;
        text-align: center;
        padding: 10px 5px;
      }

      .tier-content {
        flex-grow: 1;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        padding: 10px;
        gap: 8px;
        min-height: 88px;
        background: #fbfdfb;
        transition: background 0.2s var(--md-ease);
      }

      .sortable-ghost {
        opacity: 0.4;
        background: var(--md-primary-container) !important;
      }

      /* 档位配色（保留经典排行配色） */
      .tier-夯 {
        background-color: #ff4b4b;
      }
      .tier-顶级 {
        background-color: #ff9f1c;
      }
      .tier-人上人 {
        background-color: #ffcf33;
      }
      .tier-NPC {
        background-color: #ffeb99;
      }
      .tier-拉完了 {
        background-color: #e5e7eb;
      }

      .item {
        width: 78px;
        height: auto;
        max-height: 190px;
        object-fit: contain;
        border-radius: 6px;
        cursor: grab;
        touch-action: none;
        background: var(--md-surface-container);
        border: 1px solid var(--md-outline-variant);
      }

      #file-input {
        display: none;
      }

      .pool-container {
        width: 100%;
        max-width: 860px;
        margin-top: 26px;
        padding: 18px;
        border: 2px dashed var(--md-primary-container);
        border-radius: var(--md-r-md);
        background: var(--md-primary-tint);
      }

      #pool {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-height: 96px;
      }
    </style>
  </head>

  <body>
    <main class="md-page">
      <div class="md-container md-center">
        <section class="md-hero md-anim" style="text-align: left">
          <span class="md-hero__badge"
            ><span class="md-dot"></span>TIER LIST</span
          >
          <h1 class="md-display md-hero__title">从夯到拉排行生成器</h1>
          <p class="md-hero__desc">
            添加图片后把它们拖进下面的档位，排好后一键导出高清大图，直接发出去。
          </p>
        </section>

        <div class="md-row" style="margin: 4px 0 26px">
          <label
            for="file-input"
            class="md-btn md-btn--filled md-btn--lg md-ripple"
          >
            ＋ 添加图片
          </label>
          <input
            type="file"
            id="file-input"
            multiple
            accept="image/*"
            onchange="handleFiles(this.files)"
          />
          <button
            class="md-btn md-btn--tonal md-btn--lg md-ripple btn-download"
            onclick="downloadRank()"
          >
            ⬇ 保存高清图
          </button>
        </div>

        <div style="width: 100%; display: flex; justify-content: center">
          <div id="capture-area">
            <div class="tier-row">
              <div class="tier-label tier-夯">夯</div>
              <div class="tier-content tier-list"></div>
            </div>
            <div class="tier-row">
              <div class="tier-label tier-顶级">顶级</div>
              <div class="tier-content tier-list"></div>
            </div>
            <div class="tier-row">
              <div class="tier-label tier-人上人">人上人</div>
              <div class="tier-content tier-list"></div>
            </div>
            <div class="tier-row">
              <div class="tier-label tier-NPC">NPC</div>
              <div class="tier-content tier-list"></div>
            </div>
            <div class="tier-row">
              <div class="tier-label tier-拉完了">拉完了</div>
              <div class="tier-content tier-list"></div>
            </div>
          </div>
        </div>

        <div class="pool-container" style="text-align: left">
          <p class="md-label" style="margin-bottom: 12px">
            待分配图片 · 移动端长按约 0.2 秒即可拖动
          </p>
          <div id="pool" class="tier-list"></div>
        </div>
      </div>

      <footer class="md-footer">
        <p style="margin: 0">© <span id="year"></span> Finch0714</p>
      </footer>
    </main>

    <script src="./assets/site.js"></script>
    <script src="./assets/nav.js"></script>
    <script>
      /* CDN 脚本用了 defer，必须等 DOM 就绪后再初始化拖拽 */
      document.addEventListener("DOMContentLoaded", function () {
        if (typeof Sortable === "undefined") return;
        document.querySelectorAll(".tier-list").forEach(function (el) {
          new Sortable(el, {
            group: "shared",
            animation: 150,
            ghostClass: "sortable-ghost",
            fallbackTolerance: 3,
            delay: 100,
            delayOnTouchOnly: true,
          });
        });
      });

      function handleFiles(files) {
        var pool = document.getElementById("pool");
        Array.prototype.forEach.call(files, function (file) {
          var reader = new FileReader();
          reader.onload = function (e) {
            var img = document.createElement("img");
            img.src = e.target.result;
            img.className = "item";
            pool.appendChild(img);
          };
          reader.readAsDataURL(file);
        });
      }

      async function downloadRank() {
        var area = document.getElementById("capture-area");
        var btn = document.querySelector(".btn-download");
        var original = btn.textContent;

        btn.textContent = "生成中（4K 采样）...";
        btn.disabled = true;

        try {
          await ensureHtml2Canvas();

          /* 等一帧，确保浏览器渲染完成 */
          await new Promise(function (resolve) {
            setTimeout(resolve, 300);
          });

          var canvas = await html2canvas(area, {
            backgroundColor: "#ffffff",
            scale: 4,
            useCORS: true,
            logging: false,
            allowTaint: true,
            windowWidth: area.scrollWidth,
            windowHeight: area.scrollHeight,
          });

          var link = document.createElement("a");
          link.download = "Rank-4K-" + Date.now() + ".png";
          link.href = canvas.toDataURL("image/png", 1.0);
          link.click();
        } catch (err) {
          alert("生成失败，建议减少图片数量或尝试手动截屏");
          console.error(err);
        } finally {
          btn.textContent = original;
          btn.disabled = false;
        }
      }

      /* html2canvas 按需加载：点导出时才去下载，首屏不用等它 */
      function ensureHtml2Canvas() {
        return new Promise(function (resolve, reject) {
          if (typeof html2canvas !== "undefined") return resolve();
          var s = document.createElement("script");
          s.src =
            "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
          s.onload = function () {
            resolve();
          };
          s.onerror = function () {
            reject(new Error("html2canvas 加载失败"));
          };
          document.head.appendChild(s);
        });
      }

      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
