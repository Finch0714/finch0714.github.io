    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        overflow: auto;
        background: #f2f2f7;
        color: #1c1c1e;

        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          "PingFang SC", sans-serif;
      }

      /* =========================================================
           密码页面
        ========================================================= */

      #loginBox {
        position: fixed;
        inset: 0;
        overflow: hidden;

        width: 100%;
        height: 100vh;

        display: flex;
        flex-direction: column;
        align-items: center;

        padding-top: 13vh;

        background: #f2f2f7;

        transition: opacity 0.35s ease;
      }

      /* 提示文字 */

      #message {
        height: 28px;
        margin-bottom: 20px;

        font-size: 17px;
        font-weight: 400;

        color: #8e8e93;

        transition: color 0.2s ease;
      }

      #message.error {
        color: #ff3b30;
      }

      /* =========================================================
           密码圆点
        ========================================================= */

      #dots {
        display: flex;
        justify-content: center;

        gap: 14px;

        margin-bottom: 45px;
      }

      .dot {
        width: 11px;
        height: 11px;

        border-radius: 50%;

        background: #d1d1d6;

        transition:
          background 0.15s ease,
          transform 0.15s ease;
      }

      .dot.active {
        background: #1c1c1e;
        transform: scale(1.05);
      }

      /* 错误抖动 */

      #dots.shake {
        animation: shake 0.35s ease;
      }

      @keyframes shake {
        0% {
          transform: translateX(0);
        }

        20% {
          transform: translateX(-8px);
        }

        40% {
          transform: translateX(8px);
        }

        60% {
          transform: translateX(-6px);
        }

        80% {
          transform: translateX(6px);
        }

        100% {
          transform: translateX(0);
        }
      }

      /* =========================================================
           数字键盘
        ========================================================= */

      #keypad {
        width: 280px;

        display: grid;

        grid-template-columns: repeat(3, 78px);

        grid-auto-rows: 78px;

        justify-content: center;

        gap: 13px;
      }

      .key {
        width: 78px;
        height: 78px;

        border: none;
        border-radius: 50%;

        background: #ffffff;
        color: #1c1c1e;

        font-size: 27px;
        font-weight: 400;

        cursor: pointer;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);

        transition:
          transform 0.08s ease,
          background 0.08s ease;
      }

      .key:active {
        transform: scale(0.9);
        background: #e5e5ea;
      }

      .empty {
        visibility: hidden;
      }

      .delete {
        font-size: 25px;
      }

           信件页面
        ========================================================= */

      #content {

        inset: 0;

        height: 100%;

        background: #ffffff;

        opacity: 0;

        pointer-events: none;

        transition: opacity 0.35s ease;

        overflow-y: auto;

        -webkit-overflow-scrolling: touch;

        overscroll-behavior: contain;
      }

      #content.show {
        opacity: 1;
        pointer-events: auto;
      }

           信件主体
        ========================================================= */

      #letter {

        max-width: 760px;

        }
      }

    <script>
      /* =========================================================
           信件内容
        ========================================================= */

      const letterMarkdown = `
<h1 align="center">致方鸿</h1>

　　展信安。

　　我在内心斗争许久，思虑再三，最终写下这封信，可能这样我的内心才能释然。至于密码的含义，是这个想法诞生的日子。

　　抱歉，当你阅读到这行文字的时候，意味着我们仍然认识彼此，但不再是好朋友。我们之间没有对与错，我明白每个人都有自己的生活方式和习惯，无高下好坏之分，只是走到这里，我发现我已经没有力气再维持这段关系了。

　　认识这么久以来，我逐渐意识到，即使高一的一年我们度过了许多快乐的时光，也无法掩盖我们从内心深处不合的事实，即我们不是同一类人。和你待在一起的时候，你的一些行为言论我实在无法苟同，有时候甚至有点看不过眼，一次次的欲言又止使我负重不堪，今天我想卸下这些包袱了。

　　接下来我会先谈谈我自己，再谈谈关于你的事情。

---

## 关于我自己

　　我对自己没有很清晰的认知，我感觉自己的性格像一块大拼图，和谁在一起久了，谁占的比例就会越大。我知道任何人都差不多是这样，但我的这种现象尤为严重。长久以来（真的很久），我一直在习惯性地“解构”身边的人，无法停止这种行为。在 d 老师的帮助下，我才知道这是一种自我防御的机制——只有足够了解别人，就不会被伤害、被抛弃，这大概也是我行为性格同化比较严重的原因。

　　即使这样，种种现象使我确定了关于我的一些确定的部分，不会被影响、改变的部分：

　　1. **我很注重与人之间的情感。** 我极不希望别人因我而受到伤害从而讨厌我，因此我学习他们，尽量不冒犯别人。可以概括地说，我是一个感性的人（直到前不久，我一直认为自己理性脑占主导）。我并不讨厌这样，这是真实的我。

　　2. **我大概是一个理想主义者。** 这里引用 d 老师原话：

> 容易把“人应该怎样”投射到具体的人身上。理想主义者对朋友、伴侣、群体往往有很高的期待。他们不是要求对方完美，而是要求对方“符合我心中那个善良/正直/真诚的标准”。一旦对方达不到，他们会比普通人更受伤——因为那不只是失望，是信念被冒犯。

　　和你在一起的时候我确实偶尔会有些失望，最起码的：

　　- 我不希望我的朋友和我单独出去吃饭时会一直看着视频；
　　- 我也不希望谁都没告诉的二人旅行的视频会被随手发给刚认识的素未谋面的网友；
　　- 我更不希望我的朋友们整天聊的内容都是谁很强，谁比谁弱，谁最卷，谁不卷，谁瞧不起谁。

　　特别是最后一条，每天我听得耳朵都快起茧。这也是为什么我和钱泓文、张江平、王浩峰也不怎么说话了——这种类型的玩笑在我心里是属于“过分”范畴的，这样的群体我只好敬而远之。

---

## 关于你

　　说实话，在你身上我看到了许多徐钰轩的影子：口无遮拦，做事比较随性，偶尔我甚至能看到我自己以前的样子：个性张扬，爱憎分明。你这些其实都挺好的。

　　不过我得提醒你一个实际存在的问题：**你的随性太没有边界了。**

　　人与人之间，再亲密无间的朋友间也应该有边界感，有分寸，不随便插手别人的事情，别人喜爱讨厌的事物不做太多评价。而到了你这里，冒犯别人成了家常便饭。起码我被冒犯过很多次，我不想和别人闹掰，也就忍了，时间的确会磨平一切。

　　徐钰轩也是个随性的人，但他如果做错事会道歉，他待人接物是有分寸的。

　　我和曹峦逸之间，其实也有很长一段时间没说过话，从初一下一直到九上。那时候的情况和我们现在差不多，只不过我成了现在的你，曹峦逸成了现在的我。那时我也随性，个性外露，也曾冒犯过他。记得有一次我把他父母的名字合并成了一个人名，结果他板着脸没说话，我也没有道歉。我和他决定“绝交”的那天，几乎同时提出这个要求。前一天晚上我想了很久，也 figure out 了一些东西，我还记得我的结论是：**我俩必须有一个人做出改变，否则就不适合做朋友。**

　　Things turn out，我不知不觉间变了，收敛了很多，我和他之间又和好了。和好是突然发生的，没有任何迹象，某一天我们突然就像什么都没发生过，又成了朋友，一直到现在。

　　我当然不希望你变，我估计你也不会变，这样挺好的。有时我也想变回从前的我，却做不到。

---

　　以上分析，我们不太适合做朋友了，但我仍然对你真心祝好。

　　人生有梦，各自精彩，愿你保重。

<div class="signature">

<p>Finch</p>

<p>20260925</p>

</div>
`;

      /* =========================================================
           Markdown 渲染
        ========================================================= */

      function escapeHTML(text) {
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function renderMarkdown(markdown) {
        /*
         * 这里保留原本的 HTML 标签，
         * 同时支持 Markdown。
         *
         * 因为信件中使用了：
         *
         * <h1 align="center">
         * <div class="signature">
         *
         * 所以不能简单地把全部 HTML 转义。
         */

        let text = markdown;

        /* =====================================================
               代码块保护
            ===================================================== */

        const codeBlocks = [];

        text = text.replace(/```([\s\S]*?)```/g, function (match, code) {
          const index = codeBlocks.length;

          codeBlocks.push(
            "<pre><code>" + escapeHTML(code.trim()) + "</code></pre>",
          );

          return "@@CODEBLOCK" + index + "@@";
        });

        /* =====================================================
               Markdown 标题
            ===================================================== */

        text = text.replace(/^### (.*)$/gm, "<h3>$1</h3>");

        text = text.replace(/^## (.*)$/gm, "<h2>$1</h2>");

        text = text.replace(/^# (.*)$/gm, "<h1>$1</h1>");

        /* =====================================================
               Markdown 分割线
            ===================================================== */

        text = text.replace(/^---$/gm, "<hr>");

        /* =====================================================
               Markdown 引用
            ===================================================== */

        text = text.replace(/^> (.*)$/gm, "<blockquote>$1</blockquote>");

        /* =====================================================
               Markdown 无序列表
            ===================================================== */

        text = text.replace(/^[-*] (.*)$/gm, "<li>$1</li>");

        text = text.replace(/(?:<li>.*<\/li>\n?)+/g, function (match) {
          return "<ul>" + match + "</ul>";
        });

        /* =====================================================
               Markdown 有序列表
            ===================================================== */

        text = text.replace(/^\d+\. (.*)$/gm, "<li>$1</li>");

        /* =====================================================
               Markdown 粗体
            ===================================================== */

        text = text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

        /* =====================================================
               Markdown 斜体
            ===================================================== */

        text = text.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, "<em>$1</em>");

        /* =====================================================
               Markdown 行内代码
            ===================================================== */

        text = text.replace(/`([^`]+)`/g, "<code>$1</code>");

        /* =====================================================
               Markdown 链接
            ===================================================== */

        text = text.replace(
          /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,

          '<a href="$2" target="_blank" rel="noopener">$1</a>',
        );

        /* =====================================================
               处理普通段落
            ===================================================== */

        const lines = text.split("\n");

        let result = "";

        let paragraph = [];

        function flushParagraph() {
          if (paragraph.length === 0) {
            return;
          }

          const content = paragraph.join("<br>");

          result += "<p>" + content + "</p>";

          paragraph = [];
        }

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];

          const trimmed = line.trim();

          /*
           * 空行
           */

          if (trimmed === "") {
            flushParagraph();

            continue;
          }

          /*
           * HTML 标签
           */

          if (
            trimmed.startsWith("<h1") ||
            trimmed.startsWith("</h1") ||
            trimmed.startsWith("<h2") ||
            trimmed.startsWith("</h2") ||
            trimmed.startsWith("<h3") ||
            trimmed.startsWith("</h3") ||
            trimmed.startsWith("<hr") ||
            trimmed.startsWith("<blockquote") ||
            trimmed.startsWith("</blockquote") ||
            trimmed.startsWith("<ul") ||
            trimmed.startsWith("</ul") ||
            trimmed.startsWith("<ol") ||
            trimmed.startsWith("</ol") ||
            trimmed.startsWith("<li") ||
            trimmed.startsWith("</li") ||
            trimmed.startsWith("<div") ||
            trimmed.startsWith("</div") ||
            trimmed.startsWith("<p") ||
            trimmed.startsWith("</p") ||
            trimmed.startsWith("@@CODEBLOCK")
          ) {
            flushParagraph();

            result += line;

            continue;
          }

          /*
           * 普通文字
           */

          paragraph.push(line);
        }

        flushParagraph();

        /* =====================================================
               恢复代码块
            ===================================================== */

        codeBlocks.forEach(function (codeBlock, index) {
          result = result.replace("@@CODEBLOCK" + index + "@@", codeBlock);
        });

        return result;
      }

      /* =========================================================
           渲染信件
        ========================================================= */

      document.getElementById("letter").innerHTML =
        renderMarkdown(letterMarkdown);

      /* =========================================================
           密码系统
        ========================================================= */

      let password = "";

      function updateDots() {
        const dots = document.querySelectorAll(".dot");

        dots.forEach(function (dot, index) {
          if (index < password.length) {
            dot.classList.add("active");
          } else {
            dot.classList.remove("active");
          }
        });
      }

      /* =========================================================
           输入数字
        ========================================================= */

      function pressKey(number) {
        if (password.length >= 4) {
          return;
        }

        const message = document.getElementById("message");

        if (message.classList.contains("error")) {
          message.textContent = "请输入密码";

          message.classList.remove("error");
        }

        password += number;

        updateDots();

        if (password.length === 4) {
          setTimeout(function () {
            verifyPassword();
          }, 120);
        }
      }

      /* =========================================================
           删除
        ========================================================= */

      function deleteKey() {
        if (password.length > 0) {
          password = password.slice(0, -1);

          updateDots();
        }
      }

      /* =========================================================
           验证密码
        ========================================================= */

      function verifyPassword() {
        /*
         * MD5(MD5(password))
         */

        const firstMD5 = md5(password);

        const secondMD5 = md5(firstMD5);

        /*
         * 双重 MD5
         */

        const target = "131aadf2c6880dbe424030542ff1cd07";

        /* =====================================================
               密码正确
            ===================================================== */

        if (secondMD5 === target) {
          const loginBox = document.getElementById("loginBox");

          loginBox.style.opacity = "0";

          setTimeout(function () {
            loginBox.style.display = "none";

            document.getElementById("content").classList.add("show");
          }, 350);
        }

        /* =====================================================
               密码错误
            ===================================================== */
        else {
          const message = document.getElementById("message");

          const dots = document.getElementById("dots");

          message.textContent = "密码错误";

          message.classList.add("error");

          /*
           * 重新触发抖动
           */

          dots.classList.remove("shake");

          void dots.offsetWidth;

          dots.classList.add("shake");

          /*
           * 自动重置
           */

          setTimeout(function () {
            password = "";

            updateDots();

            message.textContent = "请输入密码";
