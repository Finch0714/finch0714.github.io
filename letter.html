<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>给YOOXY的信</title>
    <link rel="icon" type="image/png" sizes="64x64" href="Favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- 字体：霞鹜文楷 Bright Medium —— 外部托管（cn-font 分片 CDN，样式表不再放本仓库）
         ① preconnect：两个域名的握手提前做掉（含 307 跳转的目标域 ik.imagekit.io）
         ② preload：抢高优先级，不用等 CSS 解析完才发现要下字体
         ③ media 交换：样式表不阻塞首屏，下完再应用；字体分片按需从图床取 -->
    <link rel="preconnect" href="https://cn-font.claude-code-best.win" />
    <link rel="preconnect" href="https://ik.imagekit.io" crossorigin />
    <link rel="preload" as="style" href="https://cn-font.claude-code-best.win/packages/lxgwwenkaibright/dist/LXGWBright-Medium/result.css" />
    <link
      rel="stylesheet"
      href="https://cn-font.claude-code-best.win/packages/lxgwwenkaibright/dist/LXGWBright-Medium/result.css"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://cn-font.claude-code-best.win/packages/lxgwwenkaibright/dist/LXGWBright-Medium/result.css" />
    </noscript>

    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      body {
        overflow: auto;
        background: #f2f2f7;
        color: #1c1c1e;

        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          "PingFang SC", sans-serif;
      }

      /* =========================================================
           密码页面
        ========================================================= */

      #loginBox {
        position: fixed;
        inset: 0;
        overflow: hidden;

        width: 100%;
        height: 100vh;

        display: flex;
        flex-direction: column;
        align-items: center;

        padding-top: 13vh;

        background: #f2f2f7;

        transition: opacity 0.35s ease;
      }

      /* 提示文字 */

      #message {
        height: 28px;
        margin-bottom: 20px;

        font-size: 17px;
        font-weight: 400;

        color: #8e8e93;

        transition: color 0.2s ease;
      }

      #message.error {
        color: #ff3b30;
      }

      /* =========================================================
           密码圆点
        ========================================================= */

      #dots {
        display: flex;
        justify-content: center;

        gap: 14px;

        margin-bottom: 45px;
      }

      .dot {
        width: 11px;
        height: 11px;

        border-radius: 50%;

        background: #d1d1d6;

        transition:
          background 0.15s ease,
          transform 0.15s ease;
      }

      .dot.active {
        background: #1c1c1e;
        transform: scale(1.05);
      }

      /* 错误抖动 */

      #dots.shake {
        animation: shake 0.35s ease;
      }

      @keyframes shake {
        0% {
          transform: translateX(0);
        }

        20% {
          transform: translateX(-8px);
        }

        40% {
          transform: translateX(8px);
        }

        60% {
          transform: translateX(-6px);
        }

        80% {
          transform: translateX(6px);
        }

        100% {
          transform: translateX(0);
        }
      }

      /* =========================================================
           数字键盘
        ========================================================= */

      #keypad {
        width: 280px;

        display: grid;

        grid-template-columns: repeat(3, 78px);

        grid-auto-rows: 78px;

        justify-content: center;

        gap: 13px;
      }

      .key {
        width: 78px;
        height: 78px;

        border: none;
        border-radius: 50%;

        background: #ffffff;
        color: #1c1c1e;

        font-size: 27px;
        font-weight: 400;

        cursor: pointer;

        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);

        transition:
          transform 0.08s ease,
          background 0.08s ease;
      }

      .key:active {
        transform: scale(0.9);
        background: #e5e5ea;
      }

      .empty {
        visibility: hidden;
      }

      .delete {
        font-size: 25px;
      }

      /* =========================================================
           信件页面
        ========================================================= */

      #content {
        position: fixed;

        inset: 0;

        height: 100%;

        background: #ffffff;

        opacity: 0;

        pointer-events: none;

        transition: opacity 0.35s ease;

        overflow-y: auto;

        -webkit-overflow-scrolling: touch;

        overscroll-behavior: contain;
      }

      #content.show {
        opacity: 1;
        pointer-events: auto;
      }

      /* =========================================================
           信件主体
        ========================================================= */

      #letter {
        width: 100%;
        max-width: 760px;

        margin: 0 auto;

        padding: 48px 26px 80px;

        color: #1c1c1e;

        font-family:
          "LXGW Bright Medium",
          "LXGWBright-Medium",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Microsoft YaHei",
          "PingFang SC",
          sans-serif;

        font-size: 17px;

        line-height: 1.9;

        word-wrap: break-word;
        overflow-wrap: break-word;
      }

      /* =========================================================
           Markdown 标题
        ========================================================= */

      #letter h1 {
        margin: 0 0 38px;

        padding: 0;

        font-size: 30px;

        line-height: 1.4;

        font-weight: 700;

        color: #1c1c1e;

        text-align: center;
      }

      #letter h2 {
        margin: 42px 0 22px;

        padding: 0;

        font-size: 24px;

        line-height: 1.45;

        font-weight: 700;

        color: #1c1c1e;
      }

      #letter h3 {
        margin: 30px 0 16px;

        font-size: 20px;

        line-height: 1.45;

        font-weight: 600;
      }

      /* =========================================================
           段落
        ========================================================= */

      #letter p {
        margin: 0 0 22px;

        padding: 0;
      }

      /* 最后一段落不要额外留太大空间 */

      #letter p:last-child {
        margin-bottom: 0;
      }

      /* =========================================================
           粗体
        ========================================================= */

      #letter strong {
        font-weight: 700;
      }

      /* =========================================================
           斜体
        ========================================================= */

      #letter em {
        font-style: italic;
      }

      /* =========================================================
           引用
        ========================================================= */

      #letter blockquote {
        margin: 24px 0;

        padding: 12px 18px;

        border-left: 4px solid #d1d1d6;

        background: #f5f5f7;

        color: #6e6e73;

        line-height: 1.8;
      }

      #letter blockquote p {
        margin: 0;
      }

      /* =========================================================
           列表
        ========================================================= */

      #letter ul,
      #letter ol {
        margin: 0 0 24px;

        padding-left: 30px;
      }

      #letter li {
        margin-bottom: 10px;

        padding-left: 4px;
      }

      /* =========================================================
           分割线
        ========================================================= */

      #letter hr {
        margin: 38px 0;

        border: none;

        border-top: 1px solid #e5e5ea;
      }

      /* =========================================================
           链接
        ========================================================= */

      #letter a {
        color: #007aff;

        text-decoration: none;
      }

      /* =========================================================
           行内代码
        ========================================================= */

      #letter code {
        padding: 2px 6px;

        border-radius: 5px;

        background: #f2f2f7;

        font-family: "SFMono-Regular", Consolas, monospace;

        font-size: 0.9em;
      }

      /* =========================================================
           代码块
        ========================================================= */

      #letter pre {
        margin: 20px 0;

        padding: 16px;

        border-radius: 10px;

        background: #f2f2f7;

        overflow-x: auto;
      }

      #letter pre code {
        padding: 0;

        background: none;
      }

      /* =========================================================
           图片
        ========================================================= */

      #letter img {
        max-width: 100%;
        height: auto;

        border-radius: 10px;
      }

      /* =========================================================
           落款
        ========================================================= */

      #letter .signature {
        margin-top: 42px;

        text-align: right;

        line-height: 1.8;
      }

      #letter .signature p {
        margin: 0;
      }

      /* =========================================================
           手机屏幕适配
        ========================================================= */

      @media (max-width: 600px) {
        #letter {
          padding: 38px 22px 70px;

          font-size: 16px;

          line-height: 1.9;
        }

        #letter h1 {
          font-size: 27px;

          margin-bottom: 32px;
        }

        #letter h2 {
          font-size: 22px;

          margin-top: 38px;
        }

        #letter h3 {
          font-size: 19px;
        }
      }

      @media (max-width: 400px) {
        #loginBox {
          padding-top: 10vh;
        }

        #dots {
          margin-bottom: 35px;
        }

        #keypad {
          width: 250px;

          grid-template-columns: repeat(3, 70px);

          grid-auto-rows: 70px;

          gap: 11px;
        }

        .key {
          width: 70px;

          height: 70px;

          font-size: 25px;
        }

        #letter {
          padding: 32px 19px 65px;

          font-size: 16px;
        }

        #letter h1 {
          font-size: 26px;
        }

        #letter h2 {
          font-size: 21px;
        }
      }
    </style>
      <!-- 信件托管在家里的小主机上：提前把隧道 TLS 握好 -->
    <link rel="preconnect" href="https://finch-server.tail36ef08.ts.net" crossorigin />
</head>

  <body>
    <!-- =========================================================
         密码输入页面
    ========================================================= -->

    <div id="loginBox">
      <div id="message">请输入密码</div>

      <div id="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <div id="keypad">
        <button class="key" onclick="pressKey('1')">1</button>

        <button class="key" onclick="pressKey('2')">2</button>

        <button class="key" onclick="pressKey('3')">3</button>

        <button class="key" onclick="pressKey('4')">4</button>

        <button class="key" onclick="pressKey('5')">5</button>

        <button class="key" onclick="pressKey('6')">6</button>

        <button class="key" onclick="pressKey('7')">7</button>

        <button class="key" onclick="pressKey('8')">8</button>

        <button class="key" onclick="pressKey('9')">9</button>

        <button class="key empty"></button>

        <button class="key" onclick="pressKey('0')">0</button>

        <button class="key delete" onclick="deleteKey()">⌫</button>
      </div>
    </div>

    <!-- =========================================================
         信件页面
    ========================================================= -->

    <div id="content">
      <article id="letter"></article>
    </div>

    <script>
      /* ---------------------------------------------------------
         信件正文不再写在这个页面里。

         输对密码后，才向家里的小主机取：
           https://finch-server.tail36ef08.ts.net/letter.md?pwd=四位密码
         密码由服务端（nginx）校验：不对就直接拿不到文件，
         所以这个页面里既没有信的正文，也没有密码。
         --------------------------------------------------------- */

      const LETTER_URL = "https://finch-server.tail36ef08.ts.net/letter.md";

      const LETTER_TIMEOUT_MS = 30000;

      /* =========================================================
           Markdown 渲染
        ========================================================= */

      function escapeHTML(text) {
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function renderMarkdown(markdown) {
        /*
         * 这里保留原本的 HTML 标签，
         * 同时支持 Markdown。
         *
         * 因为信件中使用了：
         *
         * <h1 align="center">
         * <div class="signature">
         *
         * 所以不能简单地把全部 HTML 转义。
         */

        let text = markdown;

        /* =====================================================
               代码块保护
            ===================================================== */

        const codeBlocks = [];

        text = text.replace(/```([\s\S]*?)```/g, function (match, code) {
          const index = codeBlocks.length;

          codeBlocks.push(
            "<pre><code>" + escapeHTML(code.trim()) + "</code></pre>",
          );

          return "@@CODEBLOCK" + index + "@@";
        });

        /* =====================================================
               Markdown 标题
            ===================================================== */

        text = text.replace(/^### (.*)$/gm, "<h3>$1</h3>");

        text = text.replace(/^## (.*)$/gm, "<h2>$1</h2>");

        text = text.replace(/^# (.*)$/gm, "<h1>$1</h1>");

        /* =====================================================
               Markdown 分割线
            ===================================================== */

        text = text.replace(/^---$/gm, "<hr>");

        /* =====================================================
               Markdown 引用
            ===================================================== */

        text = text.replace(/^> (.*)$/gm, "<blockquote>$1</blockquote>");

        /* =====================================================
               Markdown 无序列表
            ===================================================== */

        text = text.replace(/^[-*] (.*)$/gm, "<li>$1</li>");

        text = text.replace(/(?:<li>.*<\/li>\n?)+/g, function (match) {
          return "<ul>" + match + "</ul>";
        });

        /* =====================================================
               Markdown 有序列表
            ===================================================== */

        text = text.replace(/^\d+\. (.*)$/gm, "<li>$1</li>");

        /* =====================================================
               Markdown 粗体
            ===================================================== */

        text = text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

        /* =====================================================
               Markdown 斜体
            ===================================================== */

        text = text.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, "<em>$1</em>");

        /* =====================================================
               Markdown 行内代码
            ===================================================== */

        text = text.replace(/`([^`]+)`/g, "<code>$1</code>");

        /* =====================================================
               Markdown 链接
            ===================================================== */

        text = text.replace(
          /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,

          '<a href="$2" target="_blank" rel="noopener">$1</a>',
        );

        /* =====================================================
               处理普通段落
            ===================================================== */

        const lines = text.split("\n");

        let result = "";

        let paragraph = [];

        function flushParagraph() {
          if (paragraph.length === 0) {
            return;
          }

          const content = paragraph.join("<br>");

          result += "<p>" + content + "</p>";

          paragraph = [];
        }

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];

          const trimmed = line.trim();

          /*
           * 空行
           */

          if (trimmed === "") {
            flushParagraph();

            continue;
          }

          /*
           * HTML 标签
           */

          if (
            trimmed.startsWith("<h1") ||
            trimmed.startsWith("</h1") ||
            trimmed.startsWith("<h2") ||
            trimmed.startsWith("</h2") ||
            trimmed.startsWith("<h3") ||
            trimmed.startsWith("</h3") ||
            trimmed.startsWith("<hr") ||
            trimmed.startsWith("<blockquote") ||
            trimmed.startsWith("</blockquote") ||
            trimmed.startsWith("<ul") ||
            trimmed.startsWith("</ul") ||
            trimmed.startsWith("<ol") ||
            trimmed.startsWith("</ol") ||
            trimmed.startsWith("<li") ||
            trimmed.startsWith("</li") ||
            trimmed.startsWith("<div") ||
            trimmed.startsWith("</div") ||
            trimmed.startsWith("<p") ||
            trimmed.startsWith("</p") ||
            trimmed.startsWith("@@CODEBLOCK")
          ) {
            flushParagraph();

            result += line;

            continue;
          }

          /*
           * 普通文字
           */

          paragraph.push(line);
        }

        flushParagraph();

        /* =====================================================
               恢复代码块
            ===================================================== */

        codeBlocks.forEach(function (codeBlock, index) {
          result = result.replace("@@CODEBLOCK" + index + "@@", codeBlock);
        });

        return result;
      }


      /* =========================================================
           密码系统

         密码本体的校验在服务端（nginx 的 ?pwd= 判断），
         这里只负责把四位数字发给服务器、再把拿回来的信渲染出来。
        ========================================================= */

      let password = "";

      /* 正在向服务器取信时，不接受新的按键 */
      let loading = false;

      function updateDots() {
        const dots = document.querySelectorAll(".dot");

        dots.forEach(function (dot, index) {
          if (index < password.length) {
            dot.classList.add("active");
          } else {
            dot.classList.remove("active");
          }
        });
      }

      /* =========================================================
           中文乱码防护

         优先按 UTF-8 解；万一拿到的是 GBK，解出来会满是 U+FFFD（），
         这时用 GBK 再解一次、取更干净的那个；
         顺手去掉 BOM，并把 CRLF 统一成 LF。
        ========================================================= */

      function decodeBytes(buffer) {
        const bytes = new Uint8Array(buffer);

        /* UTF-16 LE 的 BOM */
        if (bytes.length > 2 && bytes[0] === 0xff && bytes[1] === 0xfe) {
          return decodeAs("utf-16le", bytes).replace(/^\uFEFF/, "");
        }

        let text = decodeAs("utf-8", bytes);

        const broken = (text.match(/\uFFFD/g) || []).length;

        if (broken > 0) {
          try {
            const gbk = decodeAs("gbk", bytes);

            if ((gbk.match(/\uFFFD/g) || []).length < broken) {
              text = gbk;
            }
          } catch (error) {
            /* 浏览器不支持 gbk 就算了 */
          }
        }

        return text.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
      }

      function decodeAs(encoding, bytes) {
        if (typeof TextDecoder === "function") {
          try {
            return new TextDecoder(encoding, { fatal: false }).decode(bytes);
          } catch (error) {
            /* 不认识的编码名，走下面的兜底 */
          }
        }

        /* 老浏览器兜底：还原成 %XX 再 decodeURIComponent（等价 UTF-8 解码） */
        let escaped = "";

        for (let i = 0; i < bytes.length; i++) {
          escaped += "%" + ("0" + bytes[i].toString(16)).slice(-2);
        }

        try {
          return decodeURIComponent(escaped);
        } catch (error) {
          return String.fromCharCode.apply(null, bytes);
        }
      }

      /* =========================================================
           输入数字
        ========================================================= */

      function pressKey(number) {
        if (loading || password.length >= 4) {
          return;
        }

        const message = document.getElementById("message");

        if (message.classList.contains("error")) {
          message.textContent = "请输入密码";

          message.classList.remove("error");
        }

        password += number;

        updateDots();

        if (password.length === 4) {
          setTimeout(function () {
            unlock();
          }, 120);
        }
      }

      /* =========================================================
           删除
        ========================================================= */

      function deleteKey() {
        if (loading || password.length === 0) {
          return;
        }

        password = password.slice(0, -1);

        updateDots();
      }

      /* =========================================================
           取信 → 渲染

         密码不对：403/404；被限流：429；连不上：fetch 抛错。
         三种情况都给提示，并且清空重输。
        ========================================================= */

      async function unlock() {
        if (loading) {
          return;
        }

        loading = true;

        const message = document.getElementById("message");

        message.textContent = "正在打开…";

        message.classList.remove("error");

        let text = null;
        let error = "";

        const controller =
          typeof AbortController === "function" ? new AbortController() : null;

        const timer = setTimeout(function () {
          if (controller) {
            controller.abort();
          }
        }, LETTER_TIMEOUT_MS);

        try {
          const response = await fetch(
            LETTER_URL + "?pwd=" + encodeURIComponent(password),
            {
              cache: "no-store",
              signal: controller ? controller.signal : undefined,
            },
          );

          if (response.status === 429) {
            error = "尝试太频繁，等一会儿再试";
          } else if (!response.ok) {
            error = "密码错误";
          } else {
            text = decodeBytes(await response.arrayBuffer());
          }
        } catch (requestError) {
          error = "连不上服务器，检查网络后再试";
        } finally {
          clearTimeout(timer);
        }

        loading = false;

        if (error || text === null) {
          showError(error || "读取失败");

          return;
        }

        document.getElementById("letter").innerHTML = renderMarkdown(text);

        const loginBox = document.getElementById("loginBox");

        loginBox.style.opacity = "0";

        setTimeout(function () {
          loginBox.style.display = "none";

          document.getElementById("content").classList.add("show");
        }, 350);
      }

      /* =========================================================
           出错：提示 + 抖动 + 清空重输
        ========================================================= */

      function showError(text) {
        const message = document.getElementById("message");

        const dots = document.getElementById("dots");

        message.textContent = text;

        message.classList.add("error");

        /* 重新触发抖动 */

        dots.classList.remove("shake");

        void dots.offsetWidth;

        dots.classList.add("shake");

        setTimeout(function () {
          password = "";

          updateDots();

          message.textContent = "请输入密码";

          message.classList.remove("error");

          dots.classList.remove("shake");
        }, 900);
      }

      /* =========================================================
           电脑键盘
        ========================================================= */

      document.addEventListener("keydown", function (event) {
        if (/^[0-9]$/.test(event.key)) {
          pressKey(event.key);
        } else if (event.key === "Backspace") {
          deleteKey();
        }
      });

    </script>
  </body>
</html>
