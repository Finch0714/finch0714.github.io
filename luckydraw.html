<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幸运大抽奖 | Finch0714</title>
    
    <link rel="icon" type="image/png" href="Favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.loli.net/css2?family=Inter:wght@400;700;900&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root { --font-main: 'Inter', sans-serif; }
        body { 
            font-family: var(--font-main); background-color: #111; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; padding: 1.5rem;
        }
        #bg-layer { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: url('./defbg.webp') center/cover no-repeat; z-index: -2; 
        }
        #bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: -1; }
        
        .glass { 
            background: rgba(255, 255, 255, 0.45); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* 奖池网格动画 */
        .prize-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .prize-item { 
            aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 1.5rem; transition: all 0.2s; background: rgba(255,255,255,0.2);
            border: 2px solid transparent;
        }
        .prize-item.active { 
            background: rgba(255,255,255,0.8); border-color: #f59e0b; 
            transform: scale(1.05); box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }
        .prize-item img { width: 40%; margin-bottom: 5px; }
        .prize-item span { font-size: 10px; font-weight: 900; color: #1f2937; }

        /* 按钮样式 */
        .draw-btn {
            background: #1f2937; color: white; border-radius: 1.5rem;
            transition: all 0.2s; font-weight: 900; letter-spacing: 0.1em;
        }
        .draw-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .draw-btn:active:not(:disabled) { transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>

    <div class="glass max-w-md w-full p-8 rounded-[2rem] shadow-2xl text-center">
        <div class="mb-8">
            <h1 class="text-2xl font-black text-gray-900 uppercase tracking-tighter">Lucky Draw</h1>
            <p class="text-[10px] text-gray-600 font-bold uppercase tracking-[0.2em] mt-1">抽取你的专属好礼</p>
        </div>

        <div class="prize-grid mb-8" id="grid">
            <div class="prize-item" id="item-0"><span>再接再厉</span></div>
            <div class="prize-item" id="item-1"><span>1元红包</span></div>
            <div class="prize-item" id="item-2"><span>谢谢参与</span></div>
            <div class="prize-item" id="item-7"><span>视频会员</span></div>
            <button onclick="startDraw()" id="draw-button" class="draw-btn text-xs">GO</button>
            <div class="prize-item" id="item-3"><span>5元红包</span></div>
            <div class="prize-item" id="item-6"><span>谢谢参与</span></div>
            <div class="prize-item" id="item-5"><span>10元红包</span></div>
            <div class="prize-item" id="item-4"><span>神秘大奖</span></div>
        </div>

        <div class="p-4 bg-black/5 rounded-2xl text-left border border-white/20">
            <h4 class="text-[9px] font-black text-gray-500 uppercase mb-2 tracking-widest">概率公示 / Probability</h4>
            <ul class="text-[10px] text-gray-700 font-bold space-y-1">
                <li class="flex justify-between"><span>谢谢参与/再接再厉</span><span>85%</span></li>
                <li class="flex justify-between"><span>1元/5元红包</span><span>14.5%</span></li>
                <li class="flex justify-between text-yellow-700"><span>视频会员/神秘大奖</span><span>0.5%</span></li>
            </ul>
        </div>

        <div class="mt-8 flex justify-between items-center px-2">
            <a href="about.html" class="text-[10px] font-black text-gray-500 uppercase hover:text-gray-800 transition-colors">← Back Home</a>
            <span class="text-[10px] font-black text-gray-400 uppercase">Finch0714 © 2026</span>
        </div>
    </div>

    <script>
        let index = 0; // 当前亮起的索引
        let timer = null;
        let speed = 100;
        let times = 0; // 转动次数
        let cycle = 30; // 至少转多少次
        let prize = -1; // 中奖位置

        const items = [0, 1, 2, 3, 4, 5, 6, 7];

        function startDraw() {
            if (timer) return;
            const btn = document.getElementById('draw-button');
            btn.disabled = true;
            btn.innerText = "RUN...";

            // 简单的概率控制
            const rand = Math.random() * 100;
            if (rand < 85) {
                prize = [0, 2, 6][Math.floor(Math.random() * 3)]; // 谢谢参与类
            } else if (rand < 99.5) {
                prize = [1, 3, 5][Math.floor(Math.random() * 3)]; // 红包类
            } else {
                prize = [4, 7][Math.floor(Math.random() * 2)]; // 大奖
            }

            times = 0;
            speed = 100;
            roll();
        }

        function roll() {
            // 清除上一格状态
            items.forEach(i => document.getElementById(`item-${i}`).classList.remove('active'));
            
            // 激活当前格
            document.getElementById(`item-${items[index]}`).classList.add('active');

            times++;
            index++;
            if (index > 7) index = 0;

            // 减速逻辑
            if (times > cycle + 10 && index === prize) {
                clearTimeout(timer);
                timer = null;
                setTimeout(() => {
                    alert('抽奖结束！感谢参与。');
                    document.getElementById('draw-button').disabled = false;
                    document.getElementById('draw-button').innerText = "GO";
                }, 500);
            } else {
                if (times < cycle) {
                    speed -= 2;
                } else {
                    speed += 15;
                }
                if (speed < 40) speed = 40;
                timer = setTimeout(roll, speed);
            }
        }
    </script>
</body>
</html>
