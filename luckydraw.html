<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽大奖</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: url('https://picui.ogmua.cn/s1/2026/03/27/69c69b7519753.webp') center/cover no-repeat fixed;
            font-family: 'Inter', sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        /* 九宫格容器 */
        .lottery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 320px; height: 320px;
        }
        .cell {
            border-radius: 16px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold;
            color: #fff; transition: all 0.2s;
            text-align: center; padding: 5px;
        }
        /* 激活状态 */
        .cell.active {
            background: rgba(255, 255, 255, 0.8) !important;
            color: #333; transform: scale(1.05);
            box-shadow: 0 0 20px #fff;
        }
        .start-btn {
            background: linear-gradient(135deg, #ff6b6b, #f06595);
            cursor: pointer; box-shadow: 0 4px 15px rgba(240, 101, 149, 0.4);
        }
        .start-btn:active { transform: scale(0.95); }
        .start-btn.disabled { filter: grayscale(1); cursor: not-allowed; }

        /* 弹窗样式 */
        #modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
        #modal.active { display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="glass p-8 rounded-3xl relative">
        <div class="mb-6 flex justify-between items-center text-white">
            <h2 class="text-xl font-black tracking-widest uppercase">Lucky Draw</h2>
            <div class="text-sm font-bold bg-white/20 px-3 py-1 rounded-full">次数: <span id="count">3</span></div>
        </div>

        <div class="lottery-grid" id="lottery">
            <div class="cell glass" id="cell-0">🎁<br>点赞</div>
            <div class="cell glass" id="cell-1">💰<br>投币</div>
            <div class="cell glass" id="cell-2">⭐<br>收藏</div>
            <div class="cell glass" id="cell-7">🏮<br>谢谢惠顾</div>
            <div class="cell start-btn" id="start-node" onclick="startLottery()">
                <span class="text-lg">START</span>
                <span class="text-[10px] opacity-80">点击开始</span>
            </div>
            <div class="cell glass" id="cell-3">🔥<br>三连</div>
            <div class="cell glass" id="cell-6">💎<br>超级大奖</div>
            <div class="cell glass" id="cell-5">🎮<br>MC正版号</div>
            <div class="cell glass" id="cell-4">🍃<br>谢谢惠顾</div>
        </div>
    </div>

    <div id="modal">
        <div class="glass m-6 p-10 rounded-3xl max-w-sm w-full text-center text-white">
            <h3 class="text-2xl font-black mb-4">🎊 恭喜中奖</h3>
            <p id="prize-name" class="text-lg font-bold text-pink-300 mb-2"></p>
            <p id="prize-desc" class="text-sm opacity-80 leading-relaxed mb-8"></p>
            <div id="action-area" class="flex flex-col gap-3">
                </div>
        </div>
    </div>

    <script>
        let chances = 3;
        let isRunning = false;
        let currentIndex = -1; // 当前选中的索引
        const sequence = [0, 1, 2, 3, 4, 5, 6, 7]; // 顺时针旋转序列
        
        const prizes = {
            0: { name: "点赞", desc: "由Latetelly免费送出的一个点赞" },
            1: { name: "投币", desc: "由Latetelly免费送出的一个投币" },
            2: { name: "收藏", desc: "由Latetelly免费送出的一个收藏" },
            3: { name: "三连", desc: "由Latetelly免费送出的一个三连" },
            4: { name: "谢谢惠顾", desc: "很遗憾，这次手气一般般哦~" },
            5: { name: "MC临时正版号", desc: "获得一个Minecraft临时正版账号使用权！" },
            6: { name: "超级大奖", desc: "天选之人！你获得了最终的隐藏神级奖励！", special: true },
            7: { name: "谢谢惠顾", desc: "差一点就抽到了，再试一次吧！" }
        };

        function startLottery() {
            if (isRunning || chances <= 0) return;

            isRunning = true;
            chances--;
            document.getElementById('count').innerText = chances;
            document.getElementById('start-node').classList.add('disabled');

            let speed = 100;
            let cycles = 0;
            const totalCycles = 4; // 至少转多少圈
            const targetIndex = Math.floor(Math.random() * 8); // 随机目标

            function roll() {
                currentIndex++;
                if (currentIndex >= 8) {
                    currentIndex = 0;
                    cycles++;
                }

                // 清除所有高亮
                sequence.forEach(idx => document.getElementById(`cell-${idx}`).classList.remove('active'));
                // 高亮当前
                document.getElementById(`cell-${sequence[currentIndex]}`).classList.add('active');

                // 速度控制逻辑
                if (cycles >= totalCycles && currentIndex === targetIndex) {
                    stopAt(targetIndex);
                } else {
                    if (cycles < totalCycles - 1) speed -= 2; // 加速
                    else speed += 15; // 减速
                    if (speed < 40) speed = 40;
                    setTimeout(roll, speed);
                }
            }
            roll();
        }

        function stopAt(index) {
            isRunning = false;
            document.getElementById('start-node').classList.remove('disabled');
            setTimeout(() => { showModal(prizes[index]); }, 500);
        }

        function showModal(prize) {
            const modal = document.getElementById('modal');
            const nameEl = document.getElementById('prize-name');
            const descEl = document.getElementById('prize-desc');
            const actionArea = document.getElementById('action-area');

            nameEl.innerText = prize.name;
            descEl.innerText = prize.desc;
            actionArea.innerHTML = ''; // 清空

            // 如果是超级大奖，加兑奖按钮
            if (prize.special) {
                const btn = document.createElement('button');
                btn.className = "w-full py-3 bg-pink-500 rounded-xl font-bold text-sm shadow-lg";
                btn.innerText = "立即兑奖";
                btn.onclick = () => window.location.href = "https://bilibili.com/video/BV1GJ411x7h7";
                actionArea.appendChild(btn);
            }

            // 关闭按钮
            const closeBtn = document.createElement('button');
            closeBtn.className = "w-full py-3 bg-white/20 rounded-xl font-bold text-sm";
            closeBtn.innerText = "确定";
            closeBtn.onclick = () => modal.classList.remove('active');
            actionArea.appendChild(closeBtn);

            modal.classList.add('active');
        }
    </script>
</body>
</html>
