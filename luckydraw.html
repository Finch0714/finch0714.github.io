<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucky Wheel | Finch0714</title>
    <link rel="icon" type="image/png" href="Favicon.png">
    <link rel="preload" as="image" href="./defbg.webp">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; margin: 0; background-color: #111; 
            overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; 
        }
        #bg-layer { position: fixed; inset: 0; background: url('./defbg.webp') center/cover no-repeat; z-index: -2; }
        #bg-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: -1; }
        .glass { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.3); }
        
        /* 转盘样式 */
        .wheel-container { position: relative; width: 300px; height: 300px; margin: 0 auto 2rem; }
        #wheel { 
            width: 100%; height: 100%; border-radius: 50%; border: 8px solid #fff;
            position: relative; overflow: hidden; transition: transform 4.5s cubic-bezier(0.15, 0, 0.15, 1);
            background: conic-gradient(
                #ff6b6b 0deg 108deg,   /* 谢谢 */
                #ffd93d 108deg 180deg, /* 签名 */
                #6bc1ff 180deg 216deg, /* MC */
                #6bffab 216deg 288deg, /* 三连 */
                #b66bff 288deg 360deg  /* 大奖 */
            );
        }
        .prize-text { position: absolute; inset: 0; pointer-events: none; }
        .prize-item { 
            position: absolute; top: 0; left: 50%; width: 100px; height: 50%; 
            margin-left: -50px; transform-origin: bottom center;
            display: flex; justify-content: center; align-items: flex-start;
            padding-top: 30px; font-size: 12px; font-weight: 900; color: #000;
        }
        /* 修正文字角度：扇区中心点 */
        .item1 { transform: rotate(54deg); } .item2 { transform: rotate(144deg); } 
        .item3 { transform: rotate(198deg); } .item4 { transform: rotate(252deg); } .item5 { transform: rotate(324deg); }

        .pointer { 
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent;
            border-top: 35px solid #fff; z-index: 20; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.4));
        }

        #result-modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        #result-modal.active { display: flex; }
    </style>
</head>
<body>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>

    <div class="glass w-[92%] max-w-[380px] p-8 rounded-[3rem] text-center shadow-2xl">
        <h2 class="text-[11px] font-black text-gray-800 tracking-[0.4em] uppercase mb-8">Lucky Wheel</h2>
        
        <div class="wheel-container">
            <div class="pointer"></div>
            <div id="wheel">
                <div class="prize-text">
                    <div class="prize-item item1"><span>谢谢惠顾</span></div>
                    <div class="prize-item item2"><span>亲笔签名</span></div>
                    <div class="prize-item item3"><span>MC账号</span></div>
                    <div class="prize-item item4"><span>送三连</span></div>
                    <div class="prize-item item5"><span>超级大奖</span></div>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center px-6 py-4 bg-white/30 rounded-2xl mb-6">
            <span class="text-[10px] font-black text-gray-700 uppercase">Chances Left</span>
            <span id="chance-count" class="text-xl font-black text-black">3</span>
        </div>

        <button onclick="startSpin()" class="w-full py-5 bg-gray-900 text-white rounded-2xl font-black tracking-widest active:scale-95 transition-all text-xs shadow-xl">START SPINNING</button>
    </div>

    <div id="result-modal">
        <div class="glass max-w-[280px] w-full p-8 rounded-[2rem] text-center shadow-2xl">
            <h3 class="text-[9px] font-black text-gray-500 uppercase tracking-widest mb-2">Result</h3>
            <div id="prize-text" class="text-lg font-black text-black mb-6"></div>
            <button id="modal-btn" class="w-full py-4 bg-gray-900 text-white rounded-xl font-bold text-xs uppercase tracking-widest shadow-lg"></button>
        </div>
    </div>

    <script>
        let chances = localStorage.getItem('draw_chances') === null ? 3 : parseInt(localStorage.getItem('draw_chances'));
        document.getElementById('chance-count').innerText = chances;

        // 奖项及其对应的度数区间 [min, max]
        const prizes = [
            { name: "谢谢惠顾", weight: 30, range: [0, 108] },
            { name: "Latetelly 亲笔签名", weight: 20, range: [108, 180] },
            { name: "我的世界正版账号", weight: 10, range: [180, 216] },
            { name: "Latetelly 的三连", weight: 20, range: [216, 288] },
            { name: "✨ 超级大奖 ✨", weight: 20, range: [288, 360] }
        ];

        let isSpinning = false;
        let totalRotation = 0; // 记录总旋转度数

        function startSpin() {
            if (isSpinning || chances <= 0) {
                if(chances <= 0) alert("今日机会已用完！");
                return;
            }

            isSpinning = true;
            chances--;
            localStorage.setItem('draw_chances', chances);
            document.getElementById('chance-count').innerText = chances;

            // 1. 权重随机
            const random = Math.random() * 100;
            let currentWeight = 0;
            let winPrize = prizes[0];
            for (const p of prizes) {
                currentWeight += p.weight;
                if (random <= currentWeight) { winPrize = p; break; }
            }

            // 2. 核心数学修复：计算旋转增量
            // 在奖项区间内取随机点，并避开色块分界线
            const sectorRandom = 8 + Math.random() * (winPrize.range[1] - winPrize.range[0] - 16);
            const targetPos = winPrize.range[0] + sectorRandom;
            
            // 指针在顶部(0度)，转盘顺时针转，所以落点相对于转盘初始位置是 (360 - targetPos)
            const finalAngle = 360 - targetPos;
            
            // 确保每次旋转至少转 10 圈 (3600度)，且在上一抽的基础上增加
            const currentMod = totalRotation % 360;
            const extraRounds = (10 + Math.floor(Math.random() * 5)) * 360;
            const compensation = (finalAngle - currentMod + 360) % 360;
            
            totalRotation += extraRounds + compensation;

            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                showResult(winPrize.name);
                isSpinning = false;
            }, 4600);
        }

        function showResult(name) {
            const modal = document.getElementById('result-modal');
            const text = document.getElementById('prize-text');
            const btn = document.getElementById('modal-btn');
            
            if (name === "✨ 超级大奖 ✨") {
                text.innerText = `恭喜获得：\n${name}`;
                btn.innerText = "立即兑奖";
                btn.onclick = () => { window.location.href = "https://b23.tv/to79uAN"; };
            } else {
                text.innerText = name === "谢谢惠顾" ? "遗憾，未中奖" : `恭喜获得：\n${name}`;
                btn.innerText = "OK";
                btn.onclick = () => { modal.classList.remove('active'); };
            }
            modal.classList.add('active');
        }
    </script>
</body>
</html>
