<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw | Finch0714</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.loli.net/css2?family=Inter:wght@300;400;600&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --font-main: 'Inter', sans-serif; --font-serif: 'Noto Serif SC', serif; }
        body { font-family: var(--font-main); margin: 0; background-color: #111; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }

        /* 背景层 - 固定使用 defbg.webp */
        #bg-layer { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background-image: url('defbg.webp'); background-size: cover; background-position: center; 
            z-index: -2; 
        }
        #bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: -1; }

        /* 统一透明度 0.39 */
        .glass { 
            background: rgba(255, 255, 255, 0.39); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* 转盘/按钮点击效果 */
        .btn-active:active { transform: scale(0.95); }
        
        #result-modal { display: none; }
        #result-modal.active { display: flex; animation: modalIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>

<body>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>

    <div class="glass max-w-md w-full p-10 rounded-[3rem] shadow-2xl text-center z-10 mx-4">
        <h2 class="text-xs font-bold text-gray-700 tracking-[0.3em] uppercase mb-2">Limited Event</h2>
        <h1 class="text-3xl font-bold text-gray-800 mb-8 font-serif">幸运大抽奖</h1>
        
        <div class="space-y-6">
            <div class="py-3 bg-black/10 rounded-2xl">
                <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Remaining Chances</p>
                <span id="chance-count" class="text-2xl font-mono font-black text-gray-800">2</span>
            </div>

            <button id="draw-btn" onclick="performDraw()" class="w-full py-6 bg-gray-800 text-white rounded-[2rem] font-bold tracking-widest hover:bg-black transition-all shadow-xl btn-active uppercase text-sm">
                Start Drawing
            </button>

            <p class="text-[9px] text-gray-500 font-medium">每个用户仅有 2 次机会，奖品最终解释权归 Latetelly 所有</p>
        </div>
    </div>

    <div id="result-modal" class="fixed inset-0 z-[100] items-center justify-center p-6 bg-black/60 backdrop-blur-md">
        <div class="glass max-w-sm w-full p-10 rounded-[3rem] shadow-2xl text-center relative">
            <h3 class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-4">Draw Result</h3>
            <div id="prize-text" class="text-xl font-bold text-gray-800 mb-8 leading-relaxed"></div>
            
            <div id="action-area" class="space-y-3">
                <button onclick="closeModal()" class="w-full py-4 bg-white/40 text-gray-800 border border-white/50 rounded-2xl font-bold text-xs uppercase tracking-widest hover:bg-white/60 transition-all">确认</button>
            </div>
        </div>
    </div>

    <script>
        // 初始化抽奖机会
        let chances = localStorage.getItem('draw_chances');
        if (chances === null) {
            chances = 2;
            localStorage.setItem('draw_chances', 2);
        }
        document.getElementById('chance-count').innerText = chances;

        const prizes = [
            { name: "谢谢惠顾", weight: 30 },
            { name: "Latetelly 亲笔签名", weight: 20 },
            { name: "我的世界临时正版账号", weight: 10 },
            { name: "由 Latetelly 送出的三连", weight: 20 },
            { name: "✨ 超级大奖 ✨", weight: 20 }
        ];

        function performDraw() {
            if (chances <= 0) {
                alert("你的抽奖机会已用完！下次再来吧~");
                return;
            }

            // 扣除机会
            chances--;
            localStorage.setItem('draw_chances', chances);
            document.getElementById('chance-count').innerText = chances;

            // 权重随机算法
            const random = Math.random() * 100;
            let currentWeight = 0;
            let winPrize = "";

            for (const prize of prizes) {
                currentWeight += prize.weight;
                if (random <= currentWeight) {
                    winPrize = prize.name;
                    break;
                }
            }

            showResult(winPrize);
        }

        function showResult(prize) {
            const modal = document.getElementById('result-modal');
            const text = document.getElementById('prize-text');
            const actionArea = document.getElementById('action-area');
            
            text.innerText = prize === "谢谢惠顾" ? "很遗憾，这次没抽中..." : `恭喜你获得：\n${prize}`;
            
            // 如果是超级大奖，添加兑奖按钮
            if (prize === "✨ 超级大奖 ✨") {
                const exchangeBtn = document.createElement('button');
                exchangeBtn.innerText = "立即兑奖";
                exchangeBtn.className = "w-full py-4 bg-yellow-500 text-white rounded-2xl font-bold text-xs uppercase tracking-widest shadow-lg hover:bg-yellow-600 transition-all mb-2 animate-bounce";
                exchangeBtn.onclick = () => {
                    // 跳转回 Rickroll 页面（假设主页叫 index.html）
                    window.location.href = "index.html"; 
                };
                actionArea.prepend(exchangeBtn);
            }

            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('result-modal');
            modal.classList.remove('active');
            // 清理动态添加的按钮
            const actionArea = document.getElementById('action-area');
            if (actionArea.children.length > 1) {
                actionArea.removeChild(actionArea.firstChild);
            }
        }
    </script>
</body>
</html>
