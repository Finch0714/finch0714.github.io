<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucky Draw | Finch0714</title>
    
    <link rel="icon" type="image/png" href="Favicon.png">
    <link rel="preconnect" href="https://picui.ogmua.cn">
    <link rel="preload" as="image" href="https://picui.ogmua.cn/s1/2026/03/27/69c69b7519753.webp">
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.loli.net/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --font-main: 'Inter', sans-serif; }
        body { 
            font-family: var(--font-main); margin: 0; background-color: #111; 
            overflow: hidden; display: flex; justify-content: center; align-items: center; 
            height: 100vh; -webkit-font-smoothing: antialiased; 
        }

        /* 1. 高速背景 */
        #bg-layer { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: url('https://picui.ogmua.cn/s1/2026/03/27/69c69b7519753.webp') center/cover no-repeat;
            z-index: -2; 
        }
        #bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: -1; }

        .glass { 
            background: rgba(255, 255, 255, 0.5); 
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* 2. 九宫格 - 强力圆角控制 */
        .grid-container { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            width: 300px; height: 300px; margin: 0 auto 1.5rem; 
        }
        .grid-item { 
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            border-radius: 1.5rem !important; 
            background: rgba(255,255,255,0.25);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border: 2px solid transparent;
            font-size: 11px; font-weight: 900; color: #111; text-align: center; padding: 0.5rem;
            text-transform: uppercase; line-height: 1.2;
        }
        .grid-item.active { 
            background: #fff !important; border-color: #fff; 
            transform: scale(1.08); box-shadow: 0 0 25px rgba(255,255,255,0.8);
            z-index: 10;
        }

        /* 中央 GO 按钮 */
        #draw-btn-grid {
            background: #111; color: white; border-radius: 1.5rem !important;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 18px; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }
        #draw-btn-grid:active { transform: scale(0.9); }
        #draw-btn-grid:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 概率卡片 - 增强版 */
        .prob-card { 
            position: fixed; bottom: 40px; left: 40px; padding: 24px; 
            border-radius: 2rem; width: 210px; 
            background: rgba(255,255,255,0.98); z-index: 50;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }
        .prob-item { 
            display: flex; justify-content: space-between; 
            font-size: 11px; font-weight: 900; color: #333; margin-top: 8px; 
            letter-spacing: 0.05em;
        }

        /* 结果弹窗按钮 */
        #result-modal { 
            display: none; position: fixed; inset: 0; z-index: 1000; 
            background: rgba(0,0,0,0.85); align-items: center; justify-content: center; 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        #result-modal.active { display: flex; }
    </style>
</head>

<body>
    <div id="bg-layer"></div>
    <div id="bg-overlay"></div>

    <div class="prob-card">
        <p class="text-[9px] font-black text-gray-400 uppercase tracking-[0.3em] border-b border-gray-100 mb-4 pb-2">Odds / 概率公示</p>
        <div class="prob-item"><span>谢谢惠顾</span><span class="text-gray-400">30%</span></div>
        <div class="prob-item"><span>亲笔签名</span><span class="text-gray-600">20%</span></div>
        <div class="prob-item"><span>MC正版</span><span class="text-gray-600">10%</span></div>
        <div class="prob-item"><span>送三连</span><span class="text-gray-600">20%</span></div>
        <div class="prob-item text-yellow-600"><span>超级大奖</span><span>20%</span></div>
    </div>

    <div class="glass w-[92%] max-w-[400px] p-10 rounded-[3rem] text-center z-10">
        <h2 class="text-[11px] font-black text-gray-900 tracking-[0.5em] uppercase mb-10">Fortune Grid</h2>
        
        <div class="grid-container">
            <div class="grid-item" id="item-0"><span>谢谢<br>惠顾</span></div>
            <div class="grid-item" id="item-1"><span>亲笔<br>签名</span></div>
            <div class="grid-item" id="item-2"><span>MC<br>账号</span></div>
            <div class="grid-item" id="item-7"><span>谢谢<br>惠顾</span></div>
            <button onclick="startSpin()" id="draw-btn-grid">GO</button>
            <div class="grid-item" id="item-3"><span>送<br>三连</span></div>
            <div class="grid-item" id="item-6"><span>超级<br>大奖</span></div>
            <div class="grid-item" id="item-5"><span>送<br>三连</span></div>
            <div class="grid-item" id="item-4"><span>谢谢<br>惠顾</span></div>
        </div>
        
        <div class="space-y-6 mt-4">
            <div class="flex justify-between items-center px-8 py-5 bg-white bg-opacity-40 rounded-[1.5rem] border border-white border-opacity-50">
                <span class="text-[10px] font-black text-gray-800 uppercase tracking-widest">Available</span>
                <span id="chance-count" class="text-2xl font-black text-black">3</span>
            </div>
            <a href="about.html" class="block text-[10px] text-gray-900 font-black underline uppercase tracking-widest opacity-60 hover:opacity-100 transition-opacity">← Back to Home</a>
        </div>
    </div>

    <div id="result-modal">
        <div class="glass max-w-[320px] w-full p-10 rounded-[2.5rem] text-center shadow-2xl" onclick="event.stopPropagation()">
            <h3 class="text-[10px] font-black text-gray-500 uppercase tracking-[0.2em] mb-4">Discovery</h3>
            <div id="prize-text" class="text-xl font-black text-black mb-8 leading-tight whitespace-pre-line"></div>
            <div id="modal-footer" class="space-y-4"></div>
        </div>
    </div>

    <script>
        let chances = localStorage.getItem('draw_chances') === null ? 3 : parseInt(localStorage.getItem('draw_chances'));
        document.getElementById('chance-count').innerText = chances;

        const prizes = [
            { name: "谢谢惠顾", weight: 30, pos: [0, 4, 7] },
            { name: "Latetelly 亲笔签名", weight: 20, pos: [1] },
            { name: "我的世界正版账号", weight: 10, pos: [2] },
            { name: "Latetelly 的三连", weight: 20, pos: [3, 5] },
            { name: "✨ 超级大奖 ✨", weight: 20, pos: [6] }
        ];

        let isSpinning = false;
        let currentPos = 0; 
        const track = [0, 1, 2, 3, 4, 5, 6, 7];

        function startSpin() {
            if (isSpinning || chances <= 0) {
                if(chances <= 0) alert("今日机会已用完！");
                return;
            }

            isSpinning = true;
            chances--;
            localStorage.setItem('draw_chances', chances);
            document.getElementById('chance-count').innerText = chances;
            document.getElementById('draw-btn-grid').disabled = true;

            // 1. 确定中奖项
            const random = Math.random() * 100;
            let currentWeight = 0;
            let winPrize = prizes[0];
            for (const p of prizes) {
                currentWeight += p.weight;
                if (random <= currentWeight) { winPrize = p; break; }
            }

            const finalPos = winPrize.pos[Math.floor(Math.random() * winPrize.pos.length)];
            let steps = 0; 
            let totalSteps = (track.length * 5) + track.indexOf(finalPos) - currentPos + (currentPos > track.indexOf(finalPos) ? 8 : 0);
            let speed = 120; 

            function roll() {
                document.querySelectorAll('.grid-item').forEach(el => el.classList.remove('active'));
                document.getElementById(`item-${track[currentPos]}`).classList.add('active');

                steps++;
                currentPos = (currentPos + 1) % 8;

                if (steps >= totalSteps) {
                    setTimeout(() => {
                        showResult(winPrize.name);
                        isSpinning = false;
                        document.getElementById('draw-btn-grid').disabled = false;
                    }, 800);
                } else {
                    // 变速逻辑
                    if (steps < totalSteps * 0.6) speed -= 5;
                    else speed += 15;
                    if (speed < 50) speed = 50;
                    setTimeout(roll, speed);
                }
            }
            roll();
        }

        function showResult(name) {
            const modal = document.getElementById('result-modal');
            const textEl = document.getElementById('prize-text');
            const footer = document.getElementById('modal-footer');
            
            modal.classList.add('active');
            footer.innerHTML = '';

            if (name.includes("超级大奖")) {
                textEl.innerText = `恭喜获得：\n${name}`;
                const claimBtn = document.createElement('button');
                claimBtn.className = "w-full py-5 bg-gray-900 text-white rounded-[1.5rem] font-black text-xs uppercase tracking-widest shadow-xl active:scale-95 transition-all";
                claimBtn.innerText = "Claim Prize / 立即兑奖";
                claimBtn.onclick = () => { window.location.href = "https://b23.tv/to79uAN"; };
                footer.appendChild(claimBtn);
            } else {
                textEl.innerText = name === "谢谢惠顾" ? "遗憾，未中奖" : `恭喜获得：\n${name}`;
                const okBtn = document.createElement('button');
                okBtn.className = "w-full py-4 bg-gray-900 text-white rounded-[1.5rem] font-black text-xs uppercase tracking-widest";
                okBtn.innerText = "Confirm / 确认";
                okBtn.onclick = () => modal.classList.remove('active');
                footer.appendChild(okBtn);
            }
        }
    </script>
</body>
</html>
